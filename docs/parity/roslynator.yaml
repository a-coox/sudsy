tool: "roslynator"
version: "5.0.1 (NuGet Roslynator.Analyzers latest); catalogue from the repo main (clone Oct 31 2026), src/Analyzers.xml has 340 analyzer entries"
languages: ["csharp"]
sources:
  - "https://www.nuget.org/packages/Roslynator.Analyzers"
  - "https://github.com/dotnet/roslynator (src/Analyzers.xml: id, title, default severity, IsEnabledByDefault)"
  - "https://josefpihrt.github.io/docs/roslynator/analyzers"
scope: "NOT a full catalogue: only analyzers that overlap Sudsy's existing rules or the planned StyleCop rules (plus the formatting analyzers RCS0xxx that match SA layout rules). The remaining ~280 are intentionally not listed."
entries:
  RCS1075: rule no-empty-catch
  RCS1046: rule async-suffix
  "RCS1047": "planned | Non-async method names should not end with Async (on by default in Roslynator). Proposal: option `unnecessary_suffix: true` on async-suffix, or a second rule `no-async-suffix`; low priority."
  RCS1084: sdk IDE0029
  RCS1128: sdk IDE0270
  RCS1173: sdk IDE0270
  RCS1148: rule unreachable-code
  RCS1213: rule unused-private-member
  RCS1179: rule unused-assignment
  RCS1212: rule unused-assignment
  RCS1202: rule possible-null-dereference
  RCS0056: rule max-line-length | no allow_non_breakable_words
  RCS0015: rule using-order | no blank-line group handling
  RCS0037: rule using-order | no blank-line group handling
  RCS0038: rule using-order | no blank-line group handling
