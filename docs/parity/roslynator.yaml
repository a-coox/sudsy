    notes: "Add blank line between closing brace and next statement (off). Same idea as SA1513/IDE2003."
    priority: "p2"
    batch: "B8 stylecop-layout-formatter"
    usage: "high"
    overlaps: "SA1513"
  - id: "RCS1153"
    name: "Add empty line after closing brace"
    default: "off (Info)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Add empty line after closing brace (off)."
    priority: "p2"
    batch: "B8 stylecop-layout-formatter"
    usage: "high"
    overlaps: "SA1513"
  - id: "RCS0009"
    name: "Add blank line between declaration and documentation comment"
