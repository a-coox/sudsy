  - id: "RCS0063"
    name: "Remove unnecessary blank line"
    default: "off (Info)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Remove unnecessary blank line (off): blank lines after `{`, before `}`, doubled lines are removed by the formatter."
    overlaps: "SA1505-SA1510, IDE2000"
  - id: "RCS0008"
    name: "Add blank line between closing brace and next statement"
    default: "off (Info)"
    kind: "lint"
    sudsy: "planned"
