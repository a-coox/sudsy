  RCS1037: formatter
  RCS1013: sdk IDE0049
  "RCS1078": "planned | Use \"\" or string.Empty (off, default prefers \"\"; option roslynator_empty_string_style = literal|field). SA1122 requires string.Empty. Merged: one rule `empty-string-style` with option `style`."
  RCS1032: sdk IDE0047
  RCS1123: sdk IDE0048
