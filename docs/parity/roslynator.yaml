tool: "roslynator"
version: "5.0.1 (NuGet Roslynator.Analyzers latest); catalogue from the repo main (clone Oct 31 2026), src/Analyzers.xml has 340 analyzer entries"
languages: ["csharp"]
sources:
  - "https://www.nuget.org/packages/Roslynator.Analyzers"
  - "https://github.com/dotnet/roslynator (src/Analyzers.xml: id, title, default severity, IsEnabledByDefault)"
  - "https://josefpihrt.github.io/docs/roslynator/analyzers"
scope: "NOT a full catalogue: only analyzers that overlap Sudsy's existing rules or the planned StyleCop rules (plus the formatting analyzers RCS0xxx that match SA layout rules). The remaining ~280 are intentionally not listed."
note: "'default' is IsEnabledByDefault + DefaultSeverity from Analyzers.xml; severities Hidden/Info are not shown in builds, so 'on' for Hidden/Info rules rarely produces output without an .editorconfig opt-in."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "RCS1075"
    name: "Avoid empty catch clause that catches System.Exception"
    default: "on (Warning)"
    kind: "lint"
    sudsy: "rule: no-empty-catch"
    coverage: "covered"
    notes: "Differs: RCS1075 (Warning) flags an empty catch only when it catches System.Exception (or has no type); whether a comment in the block silences it is unverified; Sudsy flags any catch with no statements and no comment (warn). Merged proposal: keep Sudsy's behavior, add option `types: any|general` (default any) so the Roslynator narrow reading is selectable."
    overlaps: "sudsy rule no-empty-catch"
  - id: "RCS1046"
    name: "Asynchronous method name should end with 'Async'"
    default: "off (Info)"
    kind: "lint"
    sudsy: "rule: async-suffix"
    coverage: "covered"
    notes: "RCS1046 (off): async methods should end with Async; Sudsy (warn by default): methods returning Task/ValueTask (uses the type layer; name-based at fast), skipping overrides, explicit implementations, Main. SDK: IDE1006 can require the suffix only for methods with the `async` modifier. Merged proposal: keep Sudsy; also flag IAsyncEnumerable<T> returners if RCS1046 does (unverified)."
    overlaps: "sudsy rule async-suffix"
  - id: "RCS1047"
    name: "Non-asynchronous method name should not end with 'Async'"
    default: "on (Info)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Non-async method names should not end with Async (on by default in Roslynator). Proposal: option `unnecessary_suffix: true` on async-suffix, or a second rule `no-async-suffix`; low priority."
    priority: "p3"
    batch: "B13 existing-rule-options"
    usage: "low"
    overlaps: "inverse of async-suffix"
  - id: "RCS1084"
    name: "Use coalesce expression instead of conditional expression"
    default: "on (Info)"
    kind: "lint"
    sudsy: "sdk: IDE0029"
    coverage: "sdk"
    notes: "`x != null ? x : y` -> `x ?? y` (on). The SDK has the same checks: IDE0029 (conditional), IDE0030 (nullable value type), IDE0270 (if-null-throw). Sudsy has no rule for it."
    gap: ""
    priority: "p1"
    batch: "B13 existing-rule-options"
    usage: "medium"
    overlaps: "sdk IDE0029 / IDE0030"
  - id: "RCS1128"
    name: "Use coalesce expression"
    default: "on (Info)"
    kind: "lint"
    sudsy: "sdk: IDE0270"
    coverage: "sdk"
    notes: "`var s = x; if (s == null) s = y;` -> coalesce; IDE0270 / IDE0074 cover it."
    overlaps: "sdk IDE0029 / IDE0030"
  - id: "RCS1173"
    name: "Use coalesce expression instead of 'if'"
    default: "on (Info)"
    kind: "lint"
    sudsy: "sdk: IDE0270"
    coverage: "sdk"
    notes: "Use coalesce expression instead of `if` (on)."
    overlaps: "sdk IDE0029 / IDE0030"
  - id: "RCS1148"
    name: "Remove unreachable code"
    default: "on (Hidden)"
    kind: "lint"
    sudsy: "rule: unreachable-code"
    coverage: "covered"
    notes: "Hidden severity; compiler CS0162 and IDE0035 report the same. Policy: Sudsy's rule also uses the flow layer (constant conditions, non-returning calls via `semantics.does_not_return`), which CS0162 only partly does. Sudsy: the rule is off by default because the compiler already reports it."
    overlaps: "sudsy rule unreachable-code"
  - id: "RCS1213"
    name: "Remove unused member declaration"
    default: "on (Info)"
    kind: "lint"
    sudsy: "rule: unused-private-member"
    coverage: "covered"
    notes: "Remove unused member declaration (on). SDK: IDE0051 (unused private member), IDE0052 (unread). Sudsy is project scope, `analysis: deep` only. Policy conflict (IDE0051/0052 exist)."
    overlaps: "sudsy rule unused-private-member"
  - id: "RCS1179"
    name: "Unnecessary assignment"
    default: "on (Info)"
    kind: "lint"
    sudsy: "rule: unused-assignment"
    coverage: "covered"
    notes: "Unnecessary assignment (on); IDE0059 is the SDK equivalent (policy conflict, Sudsy rule is off by default)."
    overlaps: "sudsy rule unused-assignment"
  - id: "RCS1212"
    name: "Remove redundant assignment"
    default: "on (Info)"
    kind: "lint"
    sudsy: "rule: unused-assignment"
    coverage: "covered"
    notes: "Remove redundant assignment (on)."
    overlaps: "sudsy rule unused-assignment"
  - id: "RCS1202"
    name: "Avoid NullReferenceException"
    default: "on (Info)"
    kind: "lint"
    sudsy: "rule: possible-null-dereference"
    coverage: "covered"
    notes: "Avoid NullReferenceException (on) is a heuristic set (First/Single on possibly-null...); the compiler's CS8602 is the exact version Sudsy repeats (rule off by default)."
    overlaps: "sudsy rule possible-null-dereference"
  - id: "RCS0056"
    name: "A line is too long"
    default: "off (Info)"
    kind: "lint"
    sudsy: "rule: max-line-length"
    coverage: "partial"
    notes: "A line is too long (off; max 125 default, configurable via roslynator_max_line_length). Sudsy default max 120, off. Merged: keep Sudsy; add `allow_non_breakable_words` (yamllint) so long URLs/strings can pass."
    gap: "no allow_non_breakable_words"
    priority: "p2"
    batch: "B1 yaml-defaults"
    usage: "medium"
    overlaps: "sudsy rule max-line-length"
  - id: "RCS0015"
    name: "Add/remove blank line between using directives"
    default: "off (Info)"
    kind: "lint"
    sudsy: "rule: using-order"
    coverage: "partial"
    notes: "Add/remove blank line between using directives (off). Roslynator has no sort analyzer; `using-order` sorts (ordinal, System first) but ignores blank-line groups. Compare dotnet_separate_import_directive_groups, StyleCop blankLinesBetweenUsingGroups."
    gap: "no blank-line group handling"
    priority: "p2"
    batch: "B7 stylecop-ordering"
    usage: "medium"
    overlaps: "sudsy rule using-order"
  - id: "RCS0037"
    name: "Remove empty line between using directives with different root namespace"
    default: "off (Info)"
    kind: "lint"
    sudsy: "rule: using-order"
    coverage: "partial"
    notes: "Remove empty line between using directives with different root namespace."
    gap: "no blank-line group handling"
    priority: "p2"
    batch: "B7 stylecop-ordering"
    usage: "medium"
    overlaps: "sudsy rule using-order"
  - id: "RCS0038"
    name: "Remove blank line between using directives with same root namespace"
    default: "off (Info)"
    kind: "lint"
    sudsy: "rule: using-order"
    coverage: "partial"
    notes: "Remove blank line between using directives with same root namespace."
    gap: "no blank-line group handling"
    priority: "p2"
    batch: "B7 stylecop-ordering"
    usage: "medium"
    overlaps: "sudsy rule using-order"
  - id: "RCS1001"
    name: "Add braces (when expression spans over multiple lines)"
    default: "on (Info)"
    kind: "lint"
    sudsy: "sdk: IDE0011"
    coverage: "sdk"
    notes: "Add braces when the expression spans multiple lines (on) = IDE0011 csharp_prefer_braces=when_multiline."
    overlaps: "SA1503/SA1519 (sdk IDE0011)"
  - id: "RCS1003"
    name: "Add braces to if-else (when expression spans over multiple lines)"
    default: "on (Info)"
    kind: "lint"
    sudsy: "sdk: IDE0011"
    coverage: "sdk"
    notes: "Add braces to if-else when expression spans multiple lines (on)."
    overlaps: "SA1503/SA1519"
  - id: "RCS1007"
    name: "Add braces"
    default: "off (Info)"
    kind: "lint"
    sudsy: "sdk: IDE0011"
    coverage: "sdk"
    notes: "Add braces (off) = csharp_prefer_braces=true."
    overlaps: "SA1503"
  - id: "RCS1126"
    name: "Add braces to if-else"
    default: "off (Info)"
    kind: "lint"
    sudsy: "sdk: IDE0011"
    coverage: "sdk"
    notes: "Add braces to if-else (off)."
    overlaps: "SA1503"
  - id: "RCS1002"
    name: "Remove braces"
    default: "off (Hidden)"
    kind: "lint"
    sudsy: "wontfix: opposite of SA1503/IDE0011 true"
    coverage: "wontfix"
    notes: "Remove braces (hidden). Opposite policy; csharp_prefer_braces=false covers it."
    overlaps: "inverse of SA1503"
  - id: "RCS1038"
    name: "Remove empty statement"
    default: "off (Info)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Remove empty statement (off). Same check as SA1106 (default-on there). Merged: one rule `no-empty-statement`, StyleCop default (on, warn), safe fix."
    priority: "p1"
    batch: "B5 stylecop-lexical"
    usage: "medium"
    overlaps: "SA1106"
  - id: "RCS1037"
    name: "Remove trailing white-space"
    default: "on (Info)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Remove trailing whitespace (on): the formatter always trims."
    overlaps: "SA1028"
  - id: "RCS1013"
    name: "Use predefined type"
    default: "off (Info)"
    kind: "lint"
    sudsy: "sdk: IDE0049"
    coverage: "sdk"
    notes: "Use predefined type (off)."
    overlaps: "SA1121"
  - id: "RCS1078"
    name: "Use \"\" or 'string.Empty'"
    default: "off (Info)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Use \"\" or string.Empty (off, default prefers \"\"; option roslynator_empty_string_style = literal|field). SA1122 requires string.Empty. Merged: one rule `empty-string-style` with option `style`."
    priority: "p2"
    batch: "B5 stylecop-lexical"
    usage: "medium"
    overlaps: "SA1122"
  - id: "RCS1032"
    name: "Remove redundant parentheses"
    default: "on (Info)"
    kind: "lint"
    sudsy: "sdk: IDE0047"
    coverage: "sdk"
    notes: "Remove redundant parentheses (on)."
    overlaps: "SA1119"
  - id: "RCS1123"
    name: "Add parentheses when necessary"
    default: "on (Info)"
    kind: "lint"
    sudsy: "sdk: IDE0048"
    coverage: "sdk"
    notes: "Add parentheses when necessary (on) ~ add parentheses for clarity."
    overlaps: "SA1407/SA1408"
  - id: "RCS1048"
    name: "Use lambda expression instead of anonymous method"
    default: "on (Info)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Use lambda expression instead of anonymous method (on). Same check as SA1130 (default-on there)."
    priority: "p1"
    batch: "B6 stylecop-syntax"
    usage: "low"
    overlaps: "SA1130"
  - id: "RCS1098"
    name: "Constant values should be placed on right side of comparisons"
    default: "on (Info)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Constant values should be placed on right side of comparisons (on). Same direction as SA1131."
    priority: "p1"
    batch: "B6 stylecop-syntax"
    usage: "medium"
    overlaps: "SA1131"
  - id: "RCS1081"
    name: "Split variable declaration"
    default: "off (Info)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Split variable declaration (off): `int a, b;`. SA1132 is on by default and also covers fields (RCS1081 locals only: unverified)."
    priority: "p1"
    batch: "B6 stylecop-syntax"
    usage: "medium"
    overlaps: "SA1132"
  - id: "RCS1052"
    name: "Declare each attribute separately"
    default: "off (Info)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Declare each attribute separately (off)."
    priority: "p1"
    batch: "B5 stylecop-lexical"
    usage: "low"
    overlaps: "SA1133"
  - id: "RCS0016"
    name: "Put attribute list on its own line"
    default: "off (Info)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Put attribute list on its own line (off): the formatter does this for declarations (verified)."
    overlaps: "SA1134"
  - id: "RCS1025"
    name: "Add new line before enum member"
    default: "off (Info)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Add new line before enum member (off): enum members are one per line (verified)."
    overlaps: "SA1136"
  - id: "RCS0031"
    name: "Put enum member on its own line"
    default: "off (Info)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Put enum member on its own line."
    overlaps: "SA1136"
  - id: "RCS0029"
    name: "Put constructor initializer on its own line"
    default: "off (Info)"
    kind: "lint"
    sudsy: "option: csharp.format.constructor_initializer_line"
    coverage: "covered"
    notes: "Put constructor initializer on its own line (off) == constructor_initializer_line: new_line."
    overlaps: "SA1128"
  - id: "RCS0034"
    name: "Put type parameter constraint on its own line"
    default: "off (Info)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Put type parameter constraint on its own line (off): done (verified)."
    overlaps: "SA1127"
  - id: "RCS0033"
    name: "Put statement on its own line"
    default: "off (Info)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Put statement on its own line (off): done (verified)."
    overlaps: "SA1107"
  - id: "RCS0030"
    name: "Put embedded statement on its own line"
    default: "off (Info)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Put embedded statement on its own line (off): done (verified)."
    overlaps: "SA1501/IDE2001"
  - id: "RCS1026"
    name: "Add new line before statement"
    default: "off (Info)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Add new line before statement (off)."
    overlaps: "SA1107"
  - id: "RCS1027"
    name: "Add new line before embedded statement"
    default: "off (Info)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Add new line before embedded statement (off)."
    overlaps: "IDE2001"
  - id: "RCS1091"
    name: "Remove empty region"
    default: "off (Hidden)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Remove empty region (off). SA1124 forbids all regions."
    priority: "p3"
    batch: "B5 stylecop-lexical"
    usage: "low"
    overlaps: "SA1124"
  - id: "RCS1020"
    name: "Simplify Nullable<T> to T?"
    default: "on (Info)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Simplify Nullable<T> to T? (on). Same check as SA1125."
    priority: "p1"
    batch: "B6 stylecop-syntax"
    usage: "low"
    overlaps: "SA1125"
  - id: "RCS1018"
    name: "Add/remove accessibility modifiers"
    default: "off (Info)"
    kind: "lint"
    sudsy: "sdk: IDE0040"
    coverage: "sdk"
    notes: "Add/remove accessibility modifiers (off; configurable explicit|implicit via roslynator_accessibility_modifiers)."
    overlaps: "SA1400"
  - id: "RCS1019"
    name: "Order modifiers"
    default: "off (Info)"
    kind: "lint"
    sudsy: "sdk: IDE0036"
    coverage: "sdk"
    notes: "Order modifiers (off)."
    overlaps: "SA1206"
  - id: "RCS1060"
    name: "Declare each type in separate file"
    default: "off (Info)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Declare each type in separate file (off). Same check as SA1402 (on there)."
    priority: "p1"
    batch: "B6 stylecop-syntax"
    usage: "high"
    overlaps: "SA1402"
  - id: "RCS1094"
    name: "Declare using directive on top level"
    default: "off (Info)"
    kind: "lint"
    sudsy: "sdk: IDE0065"
