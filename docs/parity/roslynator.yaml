    notes: "Add blank line between declaration and documentation comment (off): a blank line before a `///` header, same as SA1514 (Sudsy only does it under blank_lines_between_members: separate)."
    priority: "p2"
    batch: "B8 stylecop-layout-formatter"
    usage: "medium"
    overlaps: "SA1514"
