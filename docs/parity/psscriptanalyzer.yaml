tool: "psscriptanalyzer"
version: "1.25.0 (PowerShell Gallery; the version `scripts/parity.sh format invoke-formatter` saves)"
languages: ["powershell"]
sources:
  - "https://learn.microsoft.com/powershell/utility-modules/psscriptanalyzer/rules/readme"
  - "https://github.com/PowerShell/PSScriptAnalyzer/blob/main/Engine/Settings/CodeFormatting.psd1"
  - "tests/parity/invoke-formatter (differential numbers, docs/development/parity.md)"
scope: "Every built-in rule: the formatting rules of `Invoke-Formatter` with its default settings (the CodeFormatting preset, run without PSUseCorrectCasing) and the lint rules (preset `powershell/psscriptanalyzer` turns on those that exist, at upstream severities: Error is error, Warning is warn). Differences in layout are measured by `scripts/parity.sh format invoke-formatter` on the fixtures and the PowerShell corpus (`tests/conformance/fetch-powershell-corpus.sh`); the list of known differences is `tests/parity/invoke-formatter/expected-diff.txt`. Needs PowerShell 7 (`pwsh`) and network."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "PSPlaceOpenBrace"
    name: "PSPlaceOpenBrace"
    default: "OnSameLine, NewLineAfter, IgnoreOneLineBlock"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: "An opening brace on a line of its own after `)`, `]` or a keyword joins the line of its head when the block spans lines; a statement after `{` goes to its own line. A one-line block is left alone. Allman and Stroustrup styles (`OnSameLine: false`) are not options."
    gap: "A brace after a command (`ForEach-Object` + line break + `{`) stays: joining it would change the meaning. No Allman option."
    priority: "p1"
    usage: "high"
  - id: "PSPlaceCloseBrace"
    name: "PSPlaceCloseBrace"
    default: "NewLineAfter, IgnoreOneLineBlock, NoEmptyLineBefore false"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "A closing brace stands on a line of its own and `else`, `elseif`, `catch` and `finally` start a line after it, for blocks that span lines. Blank lines before `}` are kept."
    gap: ""
    priority: "p1"
    usage: "high"
  - id: "PSUseConsistentIndentation"
    name: "PSUseConsistentIndentation"
    default: "4 spaces, IncreaseIndentationForFirstPipeline"
    kind: "format-option"
    sudsy: "option: powershell.format.indent_size"
    coverage: "covered"
    notes: "Each open bracket (`{`, `@{`, `(`, `$(`, `@(`) indents the lines up to its closer by one level; the lines after a `|` or a backtick at the end of a line are indented one more level. Comments stand at the level of the code around them. `indent_style` also has tabs."
    gap: ""
    priority: "p1"
    usage: "high"
  - id: "PSUseConsistentWhitespace"
    name: "PSUseConsistentWhitespace"
    default: "CheckInnerBrace, CheckOpenBrace, CheckOpenParen, CheckOperator, CheckPipe, CheckSeparator"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "A blank is added after `,` and `;`, around `=`, binary operators (not `..`) and `|`, before `{`, inside a one-line `{ }`, and between `if`, `elseif`, `while`, `switch`, `foreach`, `for` or `until` and `(`. Existing blanks are never removed (`CheckParameter` and `CheckPipeForRedundantWhitespace` are off by default upstream)."
    gap: ""
    priority: "p1"
    usage: "high"
  - id: "PSAlignAssignmentStatement"
    name: "PSAlignAssignmentStatement"
    default: "CheckHashtable"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "The `=` of the entries of a hashtable that spans lines line up, across blank lines and comments."
    gap: ""
    priority: "p1"
    usage: "high"
  - id: "PSUseCorrectCasing"
    name: "PSUseCorrectCasing"
    default: "on"
    kind: "format-option"
    sudsy: "wontfix: needs the command and parameter tables of a PowerShell runtime"
    coverage: "wontfix"
    notes: "Rewrites cmdlet and parameter names to their declared casing."
    gap: "The formatter never changes the text of a word."
    priority: "p2"
    usage: "medium"
  - id: "PSAvoidUsingCmdletAliases"
    name: "PSAvoidUsingCmdletAliases"
    default: "on, Warning"
    kind: "lint"
    sudsy: "rule: no-cmdlet-aliases"
    coverage: "partial"
    notes: "A command whose name is one of the default aliases of Windows PowerShell and PowerShell 7 (`gci`, `ls`, `%`, `?`, `iex`, ...) is reported at the name."
    gap: "The table is fixed (a Windows host's); PSScriptAnalyzer reads the aliases of the host it runs on, so on Linux `ls` and `cat` are not aliases there, and user-defined aliases are not known. No fix that expands the alias. `& ls` is not checked."
    priority: "p1"
    usage: "high"
  - id: "PSAvoidUsingWriteHost"
    name: "PSAvoidUsingWriteHost"
    default: "on, Warning"
    kind: "lint"
    sudsy: "rule: no-write-host"
    coverage: "covered"
    notes: "A call of `Write-Host`."
    gap: ""
    priority: "p1"
    usage: "high"
  - id: "PSAvoidUsingInvokeExpression"
    name: "PSAvoidUsingInvokeExpression"
    default: "on, Warning"
    kind: "lint"
    sudsy: "rule: no-invoke-expression"
    coverage: "covered"
    notes: "A call of `Invoke-Expression` or `iex`."
    gap: ""
    priority: "p1"
    usage: "medium"
  - id: "PSAvoidUsingConvertToSecureStringWithPlainText"
    name: "PSAvoidUsingConvertToSecureStringWithPlainText"
    default: "on, Error"
    kind: "lint"
    sudsy: "rule: no-plain-text-secure-string"
    coverage: "covered"
    notes: "`ConvertTo-SecureString` with `-AsPlainText`, reported at the command name."
    gap: ""
    priority: "p1"
    usage: "medium"
  - id: "PSAvoidUsingWMICmdlet"
    name: "PSAvoidUsingWMICmdlet"
    default: "on, Warning"
    kind: "lint"
    sudsy: "rule: no-wmi-cmdlets"
    coverage: "covered"
    notes: "`Get-WmiObject`, `Invoke-WmiMethod`, `Register-WmiEvent`, `Remove-WmiObject` and `Set-WmiInstance`."
    gap: ""
    priority: "p2"
    usage: "medium"
  - id: "PSAvoidUsingPlainTextForPassword"
    name: "PSAvoidUsingPlainTextForPassword"
    default: "on, Warning"
    kind: "lint"
    sudsy: "rule: no-plain-text-password"
    coverage: "partial"
    notes: "A `[string]` parameter whose name contains `password` or `passphrase`."
    gap: "PSScriptAnalyzer's own name list (`Password`, `Passphrase`, `Pass`, `Pwd`, ...) is not reproduced."
    priority: "p1"
    usage: "medium"
  - id: "PSAvoidDefaultValueSwitchParameter"
    name: "PSAvoidDefaultValueSwitchParameter"
    default: "on, Warning"
    kind: "lint"
    sudsy: "rule: no-default-true-switch"
    coverage: "partial"
    notes: "A `[switch]` parameter with the default `$true`."
    gap: "Other values that evaluate to true (`= 1`) are not reported."
    priority: "p1"
    usage: "medium"
  - id: "PSAvoidUsingEmptyCatchBlock"
    name: "PSAvoidUsingEmptyCatchBlock"
    default: "on, Warning"
    kind: "lint"
    sudsy: "rule: empty-catch-block"
    coverage: "partial"
    notes: "A `catch` whose block has no statement and no comment."
    gap: "A block that holds only a comment is not reported (the comment says why); PSScriptAnalyzer reports it."
    priority: "p1"
    usage: "high"
  - id: "PSUseApprovedVerbs"
    name: "PSUseApprovedVerbs"
    default: "on, Warning"
    kind: "lint"
    sudsy: "rule: approved-verbs"
    coverage: "partial"
    notes: "The name of a function, filter or workflow written `Verb-Noun` whose verb is not in the list of `Get-Verb` (data in the rule)."
    gap: "Names without a dash are not checked; the verb list is fixed and cannot follow the host."
    priority: "p1"
    usage: "high"
  - id: "PSAvoidGlobalVars"
    name: "PSAvoidGlobalVars"
    default: "on, Warning"
    kind: "lint"
    sudsy: "rule: no-global-vars"
    coverage: "partial"
    notes: "A variable written `$global:name`."
    gap: "Variables inside strings, and `Get-Variable -Scope Global`, are not looked at."
    priority: "p1"
    usage: "medium"
  - id: "PSAvoidTrailingWhitespace"
    name: "PSAvoidTrailingWhitespace"
    default: "on, Information"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "The formatter removes trailing blanks (Invoke-Formatter keeps them)."
    gap: ""
    priority: "p2"
    usage: "medium"
  - id: "PSMisleadingBacktick"
    name: "PSMisleadingBacktick"
    default: "on, Warning"
    kind: "lint"
    sudsy: "rule: no-misleading-backtick"
    coverage: "covered"
    notes: "A backtick followed by blanks before the line break, reported at the backtick."
    gap: ""
    priority: "p1"
    usage: "medium"
  - id: "PSPossibleIncorrectComparisonWithNull"
    name: "PSPossibleIncorrectComparisonWithNull"
    default: "on, Warning"
    kind: "lint"
    sudsy: "rule: null-comparison-side"
    coverage: "partial"
    notes: "`-eq` or `-ne` (also `-ceq`, `-ine`, ...) with `$null` as the right operand."
    gap: "A comparison whose expression also holds `-and`, `-or` or `-xor` at the same level is skipped (the expression is not split). No fix that swaps the operands."
    priority: "p1"
    usage: "high"
  - id: "PSAvoidAssignmentToAutomaticVariable"
    name: "PSAvoidAssignmentToAutomaticVariable"
    default: "on, Warning"
    kind: "lint"
    sudsy: "rule: no-automatic-variable-assignment"
    coverage: "partial"
    notes: "An assignment to `$true`, `$false`, `$null`, `$args`, `$input`, `$PSItem`, `$_`, `$PID`, `$HOME`, `$Host`, `$PWD`, `$MyInvocation`, ... (a fixed list)."
    gap: "A parameter or `foreach` variable named like an automatic variable is not reported."
    priority: "p2"
    usage: "medium"
  - id: "PSAvoidLongLines"
    name: "PSAvoidLongLines"
    default: "off, 120 characters"
    kind: "lint"
    sudsy: "rule: max-line-length"
    coverage: "covered"
    notes: "The shared rule, off until configured; `max` defaults to 120 as upstream."
    gap: ""
    priority: "p3"
    usage: "low"
deferred:
  - gap: "Needs the parameter metadata of the called command (PowerShell's command tables), which Sudsy does not have."
    ids: [PSAvoidUsingPositionalParameters, PSUseCmdletCorrectly, PSShouldProcess, PSAvoidOverwritingBuiltInCmdlets]
  - gap: "Needs the compatibility profiles of PowerShell versions and platforms (command, type and syntax tables)."
    ids: [PSUseCompatibleCmdlets, PSUseCompatibleCommands, PSUseCompatibleTypes, PSUseCompatibleSyntax]
  - gap: "Needs type inference of the output of the commands in the function."
    ids: [PSUseOutputTypeCorrectly]
  - gap: "Needs the semantics of a module manifest (Test-ModuleManifest, the module's exports) or the bytes and layout of the files of a module."
    ids: [PSMissingModuleManifestField, PSUseToExportFieldsInManifest, PSAvoidUsingDeprecatedManifestFields, PSUseBOMForUnicodeEncodedFile, PSUseUTF8EncodingForHelpFile, PSDSCDscExamplesPresent, PSDSCDscTestsPresent]
  - gap: "Needs the DSC resource model (resource classes and the standard Get/Set/Test functions across a module)."
    ids: [PSDSCReturnCorrectTypesForDSCFunctions, PSDSCStandardDSCFunctionsInResource, PSDSCUseIdenticalMandatoryParametersForDSC, PSDSCUseIdenticalParametersForDSC, PSDSCUseVerboseMessageInDSCResource]
  - gap: "Needs a scope pass over variables (assignments, reads, nested script blocks, dot-sourcing)."
    ids: [PSUseDeclaredVarsMoreThanAssignments, PSReviewUnusedParameter]
  - gap: "Syntax only; not built yet."
    ids: [PSAvoidUsingDoubleQuotesForConstantString, PSAvoidSemicolonsAsLineTerminators, PSAvoidExclaimOperator, PSAvoidMultipleTypeAttributes, PSAvoidNullOrEmptyHelpMessageAttribute, PSAvoidGlobalAliases, PSAvoidGlobalFunctions, PSAvoidInvokingEmptyMembers, PSAvoidShouldContinueWithoutForce, PSAvoidUsingUsernameAndPasswordParams, PSAvoidUsingComputerNameHardcoded, PSAvoidUsingBrokenHashAlgorithms, PSAvoidUsingAllowUnencryptedAuthentication, PSAvoidDefaultValueForMandatoryParameter, PSPossibleIncorrectUsageOfAssignmentOperator, PSPossibleIncorrectUsageOfRedirectionOperator, PSReservedCmdletChar, PSReservedParams, PSUseLiteralInitializerForHashtable, PSUseConsistentParametersKind, PSUseConsistentParameterSetName, PSProvideCommentHelp, PSUsePSCredentialType, PSUseShouldProcessForStateChangingFunctions, PSUseSupportsShouldProcess, PSUseProcessBlockForPipelineCommand]
  - gap: "Needs English noun pluralization tables."
    ids: [PSUseSingularNouns]
