tool: "psscriptanalyzer"
version: "1.25.0 (PowerShell Gallery; the version `scripts/parity.sh format invoke-formatter` saves)"
languages: ["powershell"]
sources:
  - "https://learn.microsoft.com/powershell/utility-modules/psscriptanalyzer/rules/readme"
  - "https://github.com/PowerShell/PSScriptAnalyzer/blob/main/Engine/Settings/CodeFormatting.psd1"
  - "tests/parity/invoke-formatter and tests/parity/psscriptanalyzer (differential numbers, docs/development/parity.md); the rule list is that of `Get-ScriptAnalyzerRule`, which `scripts/parity.sh psscriptanalyzer` checks"
scope: "Every built-in rule: the formatting rules of `Invoke-Formatter` with its default settings (the CodeFormatting preset, run without PSUseCorrectCasing) and the lint rules (preset `powershell/psscriptanalyzer` turns on those that exist, at upstream severities: Error is error, Warning is warn). Differences in layout are measured by `scripts/parity.sh format invoke-formatter` on the fixtures and the PowerShell corpus (`tests/conformance/fetch-powershell-corpus.sh`); the list of known differences is `tests/parity/invoke-formatter/differences.yaml`. Lint differences are measured by `scripts/parity.sh psscriptanalyzer` (rule fixtures and the corpus; known differences in `tests/parity/psscriptanalyzer/differences.yaml`). `[SuppressMessageAttribute(...)]` is honored by function or file scope (target and scope arguments are not read). Needs PowerShell 7 (`pwsh`) and network."
entries:
  "PSPlaceOpenBrace": "formatter | A brace after a command (`ForEach-Object` + line break + `{`) stays: joining it would change the meaning. No Allman option."
  PSPlaceCloseBrace: formatter
  PSUseConsistentIndentation: option powershell.format.indent_size
  PSUseConsistentWhitespace: formatter
  PSAlignAssignmentStatement: formatter
  PSUseCorrectCasing: wontfix needs the command and parameter tables of a PowerShell runtime
  PSAvoidUsingCmdletAliases: rule no-cmdlet-aliases | The table is fixed (a Windows host's); PSScriptAnalyzer reads the aliases of the host it runs on, so on Linux `ls` and `cat` are not aliases there, and user-defined aliases are not known. No fix that expands the alias. `& ls` is reported at the `&`.
  PSAvoidUsingWriteHost: rule no-write-host
  PSAvoidUsingInvokeExpression: rule no-invoke-expression
  PSAvoidUsingConvertToSecureStringWithPlainText: rule no-plain-text-secure-string
  PSAvoidUsingWMICmdlet: rule no-wmi-cmdlets
  PSAvoidUsingPlainTextForPassword: rule no-plain-text-password | `SuppressMessageAttribute` is not honored (see the scope).
  PSAvoidDefaultValueSwitchParameter: rule no-default-true-switch | Other values that evaluate to true (`= 1`) are not reported.
  PSAvoidUsingEmptyCatchBlock: rule empty-catch-block
  PSUseApprovedVerbs: rule approved-verbs | Names without a dash are not checked; the verb list is fixed and cannot follow the host.
  PSAvoidGlobalVars: rule no-global-vars | Variables inside strings, and `Get-Variable -Scope Global`, are not looked at.
  PSAvoidTrailingWhitespace: formatter
  PSMisleadingBacktick: rule no-misleading-backtick
  PSPossibleIncorrectComparisonWithNull: rule null-comparison-side | The module does not report a left operand it knows to be a scalar (a parameter or variable of a non-array type); Sudsy has no types, so `[string]$a` ... `$a -eq $null` is reported. A comparison whose expression also holds `-and`, `-or` or `-xor` at the same level is skipped (the expression is not split). No fix that swaps the operands.
  PSAvoidAssignmentToAutomaticVariable: rule no-automatic-variable-assignment | The report is at the start of the parameter (its attributes included), the module's at the variable, so a parameter with attributes on earlier lines differs in the line.
  PSAvoidLongLines: rule max-line-length
deferred:
  - gap: "Needs the parameter metadata of the called command (PowerShell's command tables), which Sudsy does not have."
    ids: [PSAvoidUsingPositionalParameters, PSUseCmdletCorrectly, PSShouldProcess, PSAvoidOverwritingBuiltInCmdlets]
  - gap: "Needs the compatibility profiles of PowerShell versions and platforms (command, type and syntax tables)."
    ids: [PSUseCompatibleCmdlets, PSUseCompatibleCommands, PSUseCompatibleTypes, PSUseCompatibleSyntax]
  - gap: "Needs type inference of the output of the commands in the function."
    ids: [PSUseOutputTypeCorrectly]
  - gap: "Needs the semantics of a module manifest (Test-ModuleManifest, the module's exports) or the bytes and layout of the files of a module."
    ids: [PSMissingModuleManifestField, PSUseToExportFieldsInManifest, PSAvoidUsingDeprecatedManifestFields, PSUseBOMForUnicodeEncodedFile, PSUseUTF8EncodingForHelpFile, PSDSCDscExamplesPresent, PSDSCDscTestsPresent]
  - gap: "Needs the DSC resource model (resource classes and the standard Get/Set/Test functions across a module)."
    ids: [PSDSCReturnCorrectTypesForDSCFunctions, PSDSCStandardDSCFunctionsInResource, PSDSCUseIdenticalMandatoryParametersForDSC, PSDSCUseIdenticalParametersForDSC, PSDSCUseVerboseMessageInDSCResource]
  - gap: "Needs a scope pass over variables (assignments, reads, nested script blocks, dot-sourcing)."
    ids: [PSUseDeclaredVarsMoreThanAssignments, PSReviewUnusedParameter, PSUseUsingScopeModifierInNewRunspaces]
  - gap: "Needs the language mode analysis of the constrained language mode (the allowed types and commands)."
    ids: [PSUseConstrainedLanguageMode]
  - gap: "Syntax only; not built yet."
    ids: [PSAvoidUsingDoubleQuotesForConstantString, PSAvoidSemicolonsAsLineTerminators, PSAvoidExclaimOperator, PSAvoidMultipleTypeAttributes, PSAvoidNullOrEmptyHelpMessageAttribute, PSAvoidReservedWordsAsFunctionNames, PSUseSingleValueFromPipelineParameter, PSAvoidGlobalAliases, PSAvoidGlobalFunctions, PSAvoidInvokingEmptyMembers, PSAvoidShouldContinueWithoutForce, PSAvoidUsingUsernameAndPasswordParams, PSAvoidUsingComputerNameHardcoded, PSAvoidUsingBrokenHashAlgorithms, PSAvoidUsingAllowUnencryptedAuthentication, PSAvoidDefaultValueForMandatoryParameter, PSPossibleIncorrectUsageOfAssignmentOperator, PSPossibleIncorrectUsageOfRedirectionOperator, PSReservedCmdletChar, PSReservedParams, PSUseLiteralInitializerForHashtable, PSUseConsistentParametersKind, PSUseConsistentParameterSetName, PSProvideCommentHelp, PSUsePSCredentialType, PSUseShouldProcessForStateChangingFunctions, PSUseSupportsShouldProcess, PSUseProcessBlockForPipelineCommand]
  - gap: "Needs English noun pluralization tables."
    ids: [PSUseSingularNouns]
