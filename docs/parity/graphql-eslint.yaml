tool: "graphql-eslint"
version: "4.4.2 (@graphql-eslint/eslint-plugin, commit 0f57486 of graphql-hive/graphql-eslint)"
languages: ["graphql"]
sources:
  - "https://github.com/graphql-hive/graphql-eslint/tree/0f57486cad62cc2026e2c0f0224b3dec955c4a66/packages/plugin/src/rules (the rule folders)"
  - "https://the-guild.dev/graphql/eslint/rules"
scope: "The 34 rules of the plugin's own set, as listed by the rule folders. The rules it takes from graphql-js's validation (`graphql-js-validation.ts`: known-*, unique-*, no-unused-*, scalar-leafs, ...) are one entry below. Only rules that need neither a schema nor other files are built; no differential run (needs the schema-aware ESLint parser), the fixtures under tests/rules/graphql are written from the rules' documentation."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "naming-convention"
    name: "naming-convention"
    default: "error in recommended (operations PascalCase, fields camelCase, types PascalCase, enum values UPPER_CASE)"
    kind: "lint"
    sudsy: "rule: naming-convention"
    coverage: "partial"
    notes: "One option per kind of name with the style as a string. Leading underscores are ignored."
    gap: "No forbiddenPrefixes, forbiddenSuffixes, requiredPrefixes, requiredSuffixes or ignorePattern; no per-kind styles for the root types, interfaces versus objects, or inputs versus objects; `PascalCase` and `camelCase` accept runs of capitals (`HTTPServer`) that change-case rewrites."
    priority: "p1"
    usage: "high"
  - id: "no-anonymous-operations"
    name: "no-anonymous-operations"
    default: "error in recommended"
    kind: "lint"
    sudsy: "rule: no-anonymous-operations"
    coverage: "covered"
    notes: "An operation with no name, shorthand `{ a }` included."
    priority: "p1"
    usage: "high"
  - id: "no-duplicate-fields"
    name: "no-duplicate-fields"
    default: "error in recommended"
    kind: "lint"
    sudsy: "rule: no-duplicate-keys"
    coverage: "covered"
    notes: "The shared duplicate-key rule: a response name (field or alias) twice in a selection set, an argument twice, an object field twice, a variable twice. Also covers the graphql-js unique-argument-names, unique-input-field-names, unique-variable-names and unique-field-definition-names rules."
    priority: "p1"
    usage: "medium"
  - id: "unique-enum-value-names"
    name: "unique-enum-value-names"
    default: "error in schema-recommended"
    kind: "lint"
    sudsy: "rule: no-duplicate-keys"
    coverage: "covered"
    notes: "A value twice in one enum definition (the shared duplicate-key rule)."
    priority: "p1"
    usage: "low"
  - id: "no-typename-prefix"
    name: "no-typename-prefix"
    default: "error in schema-recommended"
    kind: "lint"
    sudsy: "rule: no-typename-prefix"
    coverage: "covered"
    notes: "A field of an object or interface type whose name starts with the type's name, case ignored."
    priority: "p1"
    usage: "medium"
  - id: "unique-operation-name"
    name: "unique-operation-name"
    default: "error in operations-recommended"
    kind: "lint"
    sudsy: "rule: unique-operation-name"
    coverage: "partial"
    notes: "Two operations of one file with the same name."
    gap: "Not checked across files."
    priority: "p1"
    usage: "medium"
  - id: "unique-fragment-name"
    name: "unique-fragment-name"
    default: "error in operations-recommended"
    kind: "lint"
    sudsy: "rule: unique-fragment-name"
    coverage: "partial"
    notes: "Two fragments of one file with the same name."
    gap: "Not checked across files."
    priority: "p1"
    usage: "medium"
  - id: "selection-set-depth"
    name: "selection-set-depth"
    default: "off (maxDepth required)"
    kind: "lint"
    sudsy: "rule: selection-set-depth"
    coverage: "partial"
    notes: "Option `max_depth` (default 7)."
    gap: "Fragment spreads are not followed (upstream adds the depth of the spread fragments); no ignore option."
    priority: "p3"
    usage: "low"
  - id: "alphabetize"
    name: "alphabetize"
    default: "off"
    kind: "lint"
    sudsy: "rule: sorted-keys"
    coverage: "partial"
    notes: "The shared sorted-keys rule orders every list: fields, arguments, enum values, input fields, variables and selections, with its `order`, `direction` and `report` options. Fix is unsafe."
    gap: "Upstream picks the kinds to sort (fields, values, selections, variables, arguments, definitions) and a `groups` order; sorted-keys has no per-kind switch and does not sort definitions."
    priority: "p3"
    usage: "low"
  - id: "graphql-js-validation"
    name: "graphql-js validation rules"
    default: "error in recommended (all that apply)"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "partial"
    notes: "The parser reports syntax errors; the duplicate-name rules above stand for graphql-js's unique-* rules."
    gap: "known-argument-names, known-directives, known-fragment-names, known-type-names, fields-on-correct-type, fragments-on-composite-types, no-fragment-cycles, no-undefined-variables, no-unused-fragments, no-unused-variables, overlapping-fields-can-be-merged, possible-fragment-spread, possible-type-extension, provided-required-arguments, scalar-leafs, variables-are-input-types, variables-in-allowed-position, values-of-correct-type and the other rules that need a schema or the other files of the project are not built."
    priority: "p1"
    usage: "high"
deferred:
  - gap: "Possible without a schema; not built yet."
    ids: [description-style, input-name, lone-executable-definition, match-document-filename, no-hashtag-description, no-root-type, require-deprecation-date, require-deprecation-reason, require-description, require-nullable-fields-with-oneof, require-type-pattern-with-oneof]
  - gap: "Needs a schema, the other files of the project or operation usage."
    ids: [no-deprecated, no-one-place-fragments, no-scalar-result-type-on-mutation, no-unreachable-types, no-unused-fields, relay-arguments, relay-connection-types, relay-edge-types, relay-page-info, require-field-of-type-query-in-mutation-result, require-import-fragment, require-nullable-result-in-root, require-selections, strict-id-in-types]
