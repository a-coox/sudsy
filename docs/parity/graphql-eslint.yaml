tool: "graphql-eslint"
version: "4.4.2 (@graphql-eslint/eslint-plugin, commit 0f57486 of graphql-hive/graphql-eslint)"
languages: ["graphql"]
sources:
  - "https://github.com/graphql-hive/graphql-eslint/tree/0f57486cad62cc2026e2c0f0224b3dec955c4a66/packages/plugin/src/rules (the rule folders)"
  - "https://the-guild.dev/graphql/eslint/rules"
scope: "The 34 rules of the plugin's own set, as listed by the rule folders. The rules it takes from graphql-js's validation (`graphql-js-validation.ts`: known-*, unique-*, no-unused-*, scalar-leafs, ...) are one entry below. Only rules that need neither a schema nor other files are built; no differential run (needs the schema-aware ESLint parser), the fixtures under tests/rules/graphql are written from the rules' documentation."
entries:
  naming-convention: rule naming-convention | No forbiddenPrefixes, forbiddenSuffixes, requiredPrefixes, requiredSuffixes or ignorePattern; no per-kind styles for the root types, interfaces versus objects, or inputs versus objects; `PascalCase` and `camelCase` accept runs of capitals (`HTTPServer`) that change-case rewrites.
  no-anonymous-operations: rule no-anonymous-operations
  no-duplicate-fields: rule no-duplicate-keys
  unique-enum-value-names: rule no-duplicate-keys
  no-typename-prefix: rule no-typename-prefix
  unique-operation-name: rule unique-operation-name | Not checked across files.
  unique-fragment-name: rule unique-fragment-name | Not checked across files.
  selection-set-depth: rule selection-set-depth | Fragment spreads are not followed (upstream adds the depth of the spread fragments); no ignore option.
  alphabetize: rule sorted-keys | Upstream picks the kinds to sort (fields, values, selections, variables, arguments, definitions) and a `groups` order; sorted-keys has no per-kind switch and does not sort definitions.
  graphql-js-validation: rule syntax-error | known-argument-names, known-directives, known-fragment-names, known-type-names, fields-on-correct-type, fragments-on-composite-types, no-fragment-cycles, no-undefined-variables, no-unused-fragments, no-unused-variables, overlapping-fields-can-be-merged, possible-fragment-spread, possible-type-extension, provided-required-arguments, scalar-leafs, variables-are-input-types, variables-in-allowed-position, values-of-correct-type and the other rules that need a schema or the other files of the project are not built.
deferred:
  - gap: "Possible without a schema; not built yet."
    ids: [description-style, input-name, lone-executable-definition, match-document-filename, no-hashtag-description, no-root-type, require-deprecation-date, require-deprecation-reason, require-description, require-nullable-fields-with-oneof, require-type-pattern-with-oneof]
  - gap: "Needs a schema, the other files of the project or operation usage."
    ids: [no-deprecated, no-one-place-fragments, no-scalar-result-type-on-mutation, no-unreachable-types, no-unused-fields, relay-arguments, relay-connection-types, relay-edge-types, relay-page-info, require-field-of-type-query-in-mutation-result, require-import-fragment, require-nullable-result-in-root, require-selections, strict-id-in-types]
