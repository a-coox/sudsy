tool: "terraform"
version: "1.17.1 (releases.hashicorp.com; the version `scripts/parity.sh format terraform` downloads)"
languages: ["hcl"]
sources:
  - "https://developer.hashicorp.com/terraform/cli/commands/fmt"
  - "tests/parity/terraform (differential numbers, docs/development/parity.md)"
scope: "`terraform fmt`, the de-facto HCL formatter (hclwrite's layout, which `tofu fmt`, `packer fmt` and `nomad fmt` share). It has no style options; Sudsy's defaults reproduce its layout. Differences are measured by `scripts/parity.sh format terraform` on the folder's fixtures and the HCL corpus (`tests/conformance/fetch-hcl-corpus.sh`); the known ones are listed in `tests/parity/terraform/expected-diff.txt`."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "format"
    name: "terraform fmt"
    default: "on"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: "Two-space indentation by bracket depth, one space between tokens as hclwrite spaces them, `=` and trailing comments aligned in runs of consecutive lines, blank lines and line breaks kept."
    gap: "Files with a rewrite of `\"${x}\"` to `x` or of a quoted `variable` type are listed with their reasons in tests/parity/terraform/expected-diff.txt: the formatter never changes tokens; the rule `deprecated-interpolation` does it as a fix."
    priority: "p1"
    usage: "high"
  - id: "check"
    name: "-check, -diff"
    default: "false"
    kind: "format-option"
    sudsy: "config: `sudsy format --check`"
    coverage: "covered"
    notes: "Sudsy reports the files that would change."
    priority: "p2"
    usage: "medium"
