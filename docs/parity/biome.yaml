tool: "biome"
version: "2.6.4 (npm latest; configuration page schema URL)"
languages: ["json"]
sources:
  - "https://registry.npmjs.org/@biomejs/biome/latest"
  - "https://biomejs.dev/reference/configuration/"
  - "https://biomejs.dev/linter/json/rules/"
  - "https://biomejs.dev/linter/rules/no-empty-object-keys/"
  - "https://biomejs.dev/linter/rules/no-top-level-literals/"
  - "https://biomejs.dev/linter/rules/no-json-unsafe-values/"
  - "https://biomejs.dev/linter/rules/use-consistent-object-keys/"
  - "https://biomejs.dev/assist/actions/use-sorted-keys/"
scope: "JSON/JSONC formatter options and JSON lint rules (15 rules on the JSON rules page)"
entries:
  json.formatter.enabled: config overrides / exclude
  json.formatter.indentStyle: option json.format.indent_style
  json.formatter.indentWidth: option json.format.indent_size
  json.formatter.lineWidth: option json.format.line_width
  json.formatter.lineEnding: option json.format.end_of_line
  json.formatter.trailingCommas: option json.format.trailing_commas | Biome `all` = Sudsy `multiline` (adds only to multi-line containers; JSONC only); the names differ and Biome applies it per file type (json vs jsonc)
  json.formatter.bracketSpacing: option json.format.bracket_spacing
  json.formatter.delimiterSpacing: option json.format.array_bracket_spacing
  "json.formatter.expand": "option json.format.collapse | auto = 'objects expanded if the first property has a leading newline' ~ `collapse: opening_break`; whether Biome auto treats arrays the same is unverified; Sudsy default is `preserve` (any break between delimiters)"
  json.formatter.trailingNewline: option json.format.final_newline
  formatter.useEditorconfig: config .editorconfig
  formatter.formatWithErrors: wontfix files with syntax errors are never formatted
  formatter.includes / files.includes / files.ignoreUnknown / files.maxSize: config include, exclude, ignore files
  formatter.attributePosition / bracketSameLine: wontfix not applicable to JSON
  "json.parser.allowComments": "option json.format.dialect | `dialect: jsonc` switches comments AND trailing commas together; no separate toggles"
  json.parser.allowTrailingCommas: option json.format.dialect | see allowComments
  json.linter.enabled / json.assist.enabled: config lint.rules (off)
  suspicious/noDuplicateObjectKeys: rule no-duplicate-keys
  suspicious/noBiomeFirstException: wontfix Biome config file rule
  suspicious/noQuickfixBiome: wontfix Biome config file rule
  suspicious/useBiomeIgnoreFolder: wontfix Biome config file rule
  suspicious/noEmptyObjectKeys: rule no-empty-keys
  suspicious/noDuplicateDependencies: wontfix package.json domain rule
  suspicious/noUntrustedLicenses: wontfix package.json domain rule
  suspicious/useRequiredScripts: wontfix package.json domain rule
  style/noTopLevelLiterals: planned | Top-level string/number/boolean/null (RFC 4627 parsers). Verified Sudsy accepts `"x"` silently. Derived from ESLint json/top-level-interop.
  nursery/noJsonUnsafeValues: rule unsafe-numbers | lone UTF-16 surrogates in strings are not reported
  "nursery/useConsistentObjectKeys": "planned | Keys must use one Unicode normalization form (option `form`: NFC default, NFD, NFKC, NFKD); unsafe fix. Needs a normalization table (unicode-normalization crate)."
  nursery/noRestrictedDependencies: wontfix package.json domain rule
  nursery/useConsistentUnicodeBom: wontfix BOM is preserved as-is
  nursery/usePackageJsonValidCpu: wontfix package.json domain rule
  nursery/usePackageJsonValidEngines: wontfix package.json domain rule
  assist/source/useSortedKeys: rule sorted-keys | no groupByNesting; natural order is not guaranteed identical to Biome's for non-ASCII keys (unverified)
  assist/source/useSortedPackageJson: wontfix package.json domain rule
