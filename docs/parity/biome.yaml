tool: "biome"
version: "2.6.4 (npm latest; configuration page schema URL)"
languages: ["json"]
sources:
  - "https://registry.npmjs.org/@biomejs/biome/latest"
  - "https://biomejs.dev/reference/configuration/"
  - "https://biomejs.dev/linter/json/rules/"
  - "https://biomejs.dev/linter/rules/no-empty-object-keys/"
  - "https://biomejs.dev/linter/rules/no-top-level-literals/"
  - "https://biomejs.dev/linter/rules/no-json-unsafe-values/"
  - "https://biomejs.dev/linter/rules/use-consistent-object-keys/"
  - "https://biomejs.dev/assist/actions/use-sorted-keys/"
scope: "JSON/JSONC formatter options and JSON lint rules (15 rules on the JSON rules page)"
note: "Fix kinds for most JSON rules were not shown by the fetched page; only the pages named above were read individually."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "json.formatter.enabled"
    name: "enabled"
    default: "true"
    kind: "format-option"
    sudsy: "config: overrides / exclude"
    coverage: "covered"
    notes: "Per-language off switch -> `overrides` or `exclude` globs; no per-language `enabled` key."
  - id: "json.formatter.indentStyle"
    name: "indentStyle"
    default: "tab"
    kind: "format-option"
    sudsy: "option: json.format.indent_style"
    coverage: "covered"
    notes: "Biome's default is tab, Sudsy's space; preset `json/biome` sets `indent_style: tab`."
    priority: "p2"
    usage: "high"
  - id: "json.formatter.indentWidth"
    name: "indentWidth"
    default: "2"
    kind: "format-option"
    sudsy: "option: json.format.indent_size"
    coverage: "covered"
    notes: "Biome range 0..24, Sudsy 1..16."
  - id: "json.formatter.lineWidth"
    name: "lineWidth"
    default: "80"
    kind: "format-option"
    sudsy: "option: json.format.line_width"
    coverage: "covered"
    notes: "Biome range 1..320, Sudsy 20..1000."
  - id: "json.formatter.lineEnding"
    name: "lineEnding"
    default: "lf"
    kind: "format-option"
    sudsy: "option: json.format.end_of_line"
    coverage: "covered"
    notes: "Option `end_of_line` (`auto` keeps the file's first line ending, `lf`, `crlf`); preset `json/biome` sets `lf`."
    priority: "p1"
    usage: "high"
  - id: "json.formatter.trailingCommas"
    name: "trailingCommas"
    default: "none"
    kind: "format-option"
    sudsy: "option: json.format.trailing_commas"
    coverage: "partial"
    notes: "Biome's docs advise `all` only for variants that allow trailing commas."
    gap: "Biome `all` = Sudsy `multiline` (adds only to multi-line containers; JSONC only); the names differ and Biome applies it per file type (json vs jsonc)"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "json.formatter.bracketSpacing"
    name: "bracketSpacing"
    default: "true"
    kind: "format-option"
    sudsy: "option: json.format.bracket_spacing"
    coverage: "covered"
    notes: "Shared option `bracket_spacing` (JSON objects and YAML flow mappings), default true."
    priority: "p2"
    usage: "medium"
  - id: "json.formatter.delimiterSpacing"
    name: "delimiterSpacing"
    default: "false"
    kind: "format-option"
    sudsy: "option: json.format.array_bracket_spacing"
    coverage: "covered"
    notes: "Shared option `array_bracket_spacing`, default false."
    priority: "p3"
    usage: "low"
  - id: "json.formatter.expand"
    name: "expand"
    default: "auto"
    kind: "format-option"
    sudsy: "option: json.format.collapse"
    coverage: "partial"
    notes: "always ~ collapse: never, never ~ collapse: always (names inverted). package.json uses `always` unless configured (see Prettier json-stringify note)."
    gap: "auto = 'objects expanded if the first property has a leading newline' ~ `collapse: opening_break`; whether Biome auto treats arrays the same is unverified; Sudsy default is `preserve` (any break between delimiters)"
    priority: "p2"
    batch: "B2 shared-format-options"
    usage: "medium"
  - id: "json.formatter.trailingNewline"
    name: "trailingNewline"
    default: "true"
    kind: "format-option"
    sudsy: "option: json.format.final_newline"
    coverage: "covered"
    notes: ""
  - id: "formatter.useEditorconfig"
    name: "useEditorconfig"
    default: "false"
    kind: "format-option"
    sudsy: "config: .editorconfig"
    coverage: "covered"
    notes: "Sudsy always reads .editorconfig (indent_style, indent_size, max_line_length, insert_final_newline)."
  - id: "formatter.formatWithErrors"
    name: "formatWithErrors"
    default: "false"
    kind: "format-option"
    sudsy: "wontfix: files with syntax errors are never formatted"
    coverage: "wontfix"
    notes: "Same default; Sudsy has no switch (safety check design)."
  - id: "formatter.includes / files.includes / files.ignoreUnknown / files.maxSize"
    name: "file selection"
    default: "n/a"
    kind: "format-option"
    sudsy: "config: include, exclude, ignore files"
    coverage: "covered"
    notes: "maxSize: Sudsy limits config/pattern files (1 MiB) but not formatted JSON size (unverified)."
  - id: "formatter.attributePosition / bracketSameLine"
    name: "JSX options"
    default: "n/a"
    kind: "format-option"
    sudsy: "wontfix: not applicable to JSON"
    coverage: "wontfix"
    notes: ""
  - id: "json.parser.allowComments"
    name: "allowComments"
    default: "false (by file type)"
    kind: "format-option"
    sudsy: "option: json.format.dialect"
    coverage: "partial"
    notes: "biome.jsonc, tsconfig.json etc. allow comments by file type in both tools."
    gap: "`dialect: jsonc` switches comments AND trailing commas together; no separate toggles"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "json.parser.allowTrailingCommas"
    name: "allowTrailingCommas"
    default: "false (by file type)"
    kind: "format-option"
    sudsy: "option: json.format.dialect"
    coverage: "partial"
    notes: ""
    gap: "see allowComments"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "json.linter.enabled / json.assist.enabled"
    name: "enabled"
    default: "true"
    kind: "lint"
    sudsy: "config: lint.rules (off)"
    coverage: "covered"
    notes: "Per rule levels; no per-language switch."
  - id: "suspicious/noDuplicateObjectKeys"
    name: "noDuplicateObjectKeys"
    default: "on (error, recommended)"
    kind: "lint"
    sudsy: "rule: no-duplicate-keys"
    coverage: "covered"
    notes: "Sudsy: error by default; keys are compared after decoding JSON escapes, as eslint-plugin-jsonc does (verified by `scripts/parity.sh eslint-jsonc`). Biome's own comparison of escapes is unverified."
  - id: "suspicious/noBiomeFirstException"
    name: "noBiomeFirstException"
    default: "on (error, recommended)"
    kind: "lint"
    sudsy: "wontfix: Biome config file rule"
    coverage: "wontfix"
    notes: "Checks biome.json."
  - id: "suspicious/noQuickfixBiome"
    name: "noQuickfixBiome"
    default: "on (information, recommended)"
    kind: "lint"
    sudsy: "wontfix: Biome config file rule"
    coverage: "wontfix"
    notes: "Checks VS Code settings for biome quickfix."
  - id: "suspicious/useBiomeIgnoreFolder"
    name: "useBiomeIgnoreFolder"
    default: "on (warning, recommended)"
    kind: "lint"
    sudsy: "wontfix: Biome config file rule"
    coverage: "wontfix"
    notes: ""
  - id: "suspicious/noEmptyObjectKeys"
    name: "noEmptyObjectKeys"
    default: "off (warning, not recommended; since 2.4.7)"
    kind: "lint"
    sudsy: "rule: no-empty-keys"
    coverage: "covered"
    notes: "Reports empty and whitespace-only keys, after decoding escapes (`\"\u0020\"` too). No fix. Off by default."
    priority: "p3"
    usage: "low"
  - id: "suspicious/noDuplicateDependencies"
    name: "noDuplicateDependencies"
    default: "off (not recommended)"
    kind: "lint"
    sudsy: "wontfix: package.json domain rule"
    coverage: "wontfix"
    notes: "Expressible as a pattern or plugin rule if wanted; not generic JSON."
  - id: "suspicious/noUntrustedLicenses"
    name: "noUntrustedLicenses"
    default: "off (not recommended)"
    kind: "lint"
    sudsy: "wontfix: package.json domain rule"
    coverage: "wontfix"
    notes: ""
  - id: "suspicious/useRequiredScripts"
    name: "useRequiredScripts"
    default: "off (not recommended)"
    kind: "lint"
    sudsy: "wontfix: package.json domain rule"
    coverage: "wontfix"
    notes: ""
  - id: "style/noTopLevelLiterals"
    name: "noTopLevelLiterals"
    default: "off (information, not recommended; since 2.4.7)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Top-level string/number/boolean/null (RFC 4627 parsers). Verified Sudsy accepts `\"x\"` silently. Derived from ESLint json/top-level-interop."
    priority: "p3"
    batch: "B4 json-optin-lint"
    usage: "low"
  - id: "nursery/noJsonUnsafeValues"
    name: "noJsonUnsafeValues"
    default: "off (warning, nursery; since 2.5.14)"
    kind: "lint"
    sudsy: "rule: unsafe-numbers"
    coverage: "partial"
    notes: "Reports integers beyond 2^53 - 1, numbers that overflow to infinity, underflow to zero or are subnormal. Off by default, no fix."
    gap: "lone UTF-16 surrogates in strings are not reported"
    priority: "p2"
    usage: "medium"
  - id: "nursery/useConsistentObjectKeys"
    name: "useConsistentObjectKeys"
    default: "off (warning, nursery)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Keys must use one Unicode normalization form (option `form`: NFC default, NFD, NFKC, NFKD); unsafe fix. Needs a normalization table (unicode-normalization crate)."
    priority: "p3"
    batch: "B4 json-optin-lint"
    usage: "low"
  - id: "nursery/noRestrictedDependencies"
    name: "noRestrictedDependencies"
    default: "off (nursery)"
    kind: "lint"
    sudsy: "wontfix: package.json domain rule"
    coverage: "wontfix"
    notes: ""
  - id: "nursery/useConsistentUnicodeBom"
    name: "useConsistentUnicodeBom"
    default: "off (nursery)"
    kind: "lint"
    sudsy: "wontfix: BOM is preserved as-is"
    coverage: "wontfix"
    notes: "Description unverified (not fetched); Sudsy records `had_bom` and keeps it."
  - id: "nursery/usePackageJsonValidCpu"
    name: "usePackageJsonValidCpu"
    default: "off (nursery)"
    kind: "lint"
    sudsy: "wontfix: package.json domain rule"
    coverage: "wontfix"
    notes: ""
  - id: "nursery/usePackageJsonValidEngines"
    name: "usePackageJsonValidEngines"
    default: "off (nursery)"
    kind: "lint"
    sudsy: "wontfix: package.json domain rule"
    coverage: "wontfix"
    notes: ""
  - id: "assist/source/useSortedKeys"
    name: "useSortedKeys (assist action)"
    default: "on as editor source action (sortOrder natural)"
    kind: "lint"
    sudsy: "rule: sorted-keys"
    coverage: "partial"
    notes: "Biome's default order is natural. Sudsy sorted-keys is ordinal by default (off by default, unsafe fix); `compare: natural` gives the natural order (digit runs as numbers, the rest by code point), plus `direction`, `compare: case_insensitive`, `min_keys`, `ignored_keys`, `blank_line_groups` and `order` (leading keys), which Biome lacks."
    gap: "no groupByNesting; natural order is not guaranteed identical to Biome's for non-ASCII keys (unverified)"
    priority: "p2"
    usage: "medium"
  - id: "assist/source/useSortedPackageJson"
    name: "useSortedPackageJson"
    default: "unverified"
    kind: "lint"
    sudsy: "wontfix: package.json domain rule"
    coverage: "wontfix"
    notes: "Mentioned on the useSortedKeys page; existence and behavior not fetched."
