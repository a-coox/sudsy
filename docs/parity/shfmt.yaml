tool: "shfmt"
version: "3.14.1 (GitHub release latest; the version `scripts/parity.sh format shfmt` downloads)"
languages: ["shell"]
sources:
  - "https://github.com/mvdan/sh/blob/master/cmd/shfmt/shfmt.1.scd"
  - "tests/parity/shfmt (differential numbers, docs/development/parity.md)"
scope: "shfmt's formatting flags. Differences in layout are measured by `scripts/parity.sh format shfmt` on the folder's fixtures and the shell corpus (`tests/conformance/fetch-shell-corpus.sh`) with shfmt's defaults (tabs, no flags); the list of known differences is `tests/parity/shfmt/expected-diff.txt`."
entries:
  indent: option shell.format.indent_style
  binary-next-line: deferred | No option that moves binary operators to the next line.
  switch-case-indent: deferred | No option to indent the patterns of a `case`.
  space-redirects: deferred | No option to put a blank after redirect operators.
  keep-padding: wontfix deprecated upstream
  func-next-line: deferred | No option to put the `{` of a function on its own line.
  simplify: wontfix rewrites code
  minify: wontfix not a formatter
  language-dialect: formatter | No dialect selection.
