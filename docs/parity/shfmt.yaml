tool: "shfmt"
version: "3.14.1 (GitHub release latest; the version `scripts/parity.sh format shfmt` downloads)"
languages: ["shell"]
sources:
  - "https://github.com/mvdan/sh/blob/master/cmd/shfmt/shfmt.1.scd"
  - "tests/parity/shfmt (differential numbers, docs/development/parity.md)"
scope: "shfmt's formatting flags. Differences in layout are measured by `scripts/parity.sh format shfmt` on the folder's fixtures and the shell corpus (`tests/conformance/fetch-shell-corpus.sh`) with shfmt's defaults (tabs, no flags); the list of known differences is `tests/parity/shfmt/expected-diff.txt`."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "indent"
    name: "-i, --indent"
    default: "0 (tabs)"
    kind: "format-option"
    sudsy: "option: shell.format.indent_style"
    coverage: "covered"
    notes: "`indent_style: tab` is the default; `-i N` is `indent_style: space` with `indent_size: N`."
    priority: "p1"
    usage: "high"
  - id: "binary-next-line"
    name: "-bn, --binary-next-line"
    default: "false"
    kind: "format-option"
    sudsy: "deferred"
    coverage: "deferred"
    notes: "Sudsy keeps a break after `&&`, `||` and `|` where the source has it, and a break before an operator behind a `\\`; it never moves an operator."
    gap: "No option that moves binary operators to the next line."
    priority: "p2"
    usage: "medium"
  - id: "switch-case-indent"
    name: "-ci, --case-indent"
    default: "false"
    kind: "format-option"
    sudsy: "deferred"
    coverage: "deferred"
    notes: "Case patterns stay at the column of `case`."
    gap: "No option to indent the patterns of a `case`."
    priority: "p2"
    usage: "medium"
  - id: "space-redirects"
    name: "-sr, --space-redirects"
    default: "false"
    kind: "format-option"
    sudsy: "deferred"
    coverage: "deferred"
    notes: "Redirect operators are followed by no blank (`>file`), as shfmt's default."
    gap: "No option to put a blank after redirect operators."
    priority: "p3"
    usage: "low"
  - id: "keep-padding"
    name: "-kp, --keep-padding"
    default: "false"
    kind: "format-option"
    sudsy: "wontfix: deprecated upstream"
    coverage: "wontfix"
    notes: "Deprecated by shfmt."
    priority: "p3"
    usage: "low"
  - id: "func-next-line"
    name: "-fn, --func-next-line"
    default: "false"
    kind: "format-option"
    sudsy: "deferred"
    coverage: "deferred"
    notes: "The `{` of a function stays on the line of its name."
    gap: "No option to put the `{` of a function on its own line."
    priority: "p3"
    usage: "low"
  - id: "simplify"
    name: "-s, --simplify"
    default: "false"
    kind: "format-option"
    sudsy: "wontfix: rewrites code"
    coverage: "wontfix"
    notes: "Rewrites code (`[[ a == b ]]` forms, `${var}`); Sudsy's formatter keeps words as written."
    priority: "p3"
    usage: "low"
  - id: "minify"
    name: "-mn, --minify"
    default: "false"
    kind: "format-option"
    sudsy: "wontfix: not a formatter"
    coverage: "wontfix"
    notes: "Minifies the program."
    priority: "p3"
    usage: "low"
  - id: "language-dialect"
    name: "-ln, --language-dialect"
    default: "auto"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: "Sudsy parses one dialect (Bash by tree-sitter-bash) for `.sh` and `.bash`; POSIX, mksh and bats files that use other syntax fail to parse."
    gap: "No dialect selection."
    priority: "p2"
    usage: "medium"
