tool: "markdownlint"
version: "0.24.0 (markdownlint-cli2; markdownlint 0.42.0)"
languages: ["markdown"]
sources:
  - "https://registry.npmjs.org/markdownlint-cli2/latest"
  - "https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md"
  - "https://github.com/DavidAnson/markdownlint/blob/main/schema/.markdownlint.jsonc"
default_config: "All rules are on with their default options (markdownlint-cli2 without a config). Rule names are those of markdownlint 0.42.0 lib/*.mjs."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "MD001"
    name: "heading-increment"
    default: "on"
    kind: "lint"
    sudsy: "rule: heading-increment"
    coverage: "covered"
    notes: "A heading more than one level below the previous one; going back up is fine."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD003"
    name: "heading-style"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "ATX (`# Title`); setext headings of one line are converted, a multi-line setext heading is kept."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD004"
    name: "ul-style"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "partial"
    notes: "Bullets are `-`."
    gap: "The second of two adjacent lists uses `*` (Prettier's way to keep them apart), which `consistent` reports."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD005"
    name: "list-indent"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Items of a list start in one column; continuation lines are indented by the marker width."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD007"
    name: "ul-indent"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Nested bullets are indented by the width of the marker (2 columns)."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD009"
    name: "no-trailing-spaces"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Trailing blanks are removed; two trailing spaces before a line break (a hard break) stay, as `br_spaces: 2` allows."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD010"
    name: "no-hard-tabs"
    default: "on"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: "The formatter keeps a block that contains a tab as written."
    gap: "Needs a shared line rule for tabs; a pattern cannot report a line."
    priority: "p1"
    batch: "B15 markdown-deferred"
    usage: "medium"
  - id: "MD011"
    name: "no-reversed-links"
    default: "on"
    kind: "lint"
    sudsy: "rule: no-reversed-links"
    coverage: "partial"
    notes: "`(text)[url]` at the start of a paragraph or after a blank."
    gap: "Reported on the paragraph, not the link; a link followed by a reference `[a](b)[c]` is not told apart."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD012"
    name: "no-multiple-blanks"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Blocks are separated by exactly one blank line."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD013"
    name: "line-length"
    default: "on"
    kind: "lint"
    sudsy: "rule: max-line-length"
    coverage: "partial"
    notes: "`max-line-length` with `max: 80`; off by default."
    gap: "No exemptions for code blocks, tables and headings (`code_blocks`, `tables`, `headings`), no `strict`, `stern` or `line_length` per-language defaults."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD014"
    name: "commands-show-output"
    default: "on"
    kind: "lint"
    sudsy: "rule: commands-show-output"
    coverage: "partial"
    notes: "A fenced block whose every line starts with `$ `."
    gap: "Reported once on the block, markdownlint reports every command line (so no parity fixture); indented code blocks are not checked."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD018"
    name: "no-missing-space-atx"
    default: "on"
    kind: "lint"
    sudsy: "rule: no-missing-space-atx"
    coverage: "covered"
    notes: "`#Heading` as a paragraph."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD019"
    name: "no-multiple-space-atx"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "One space after the `#`s."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD020"
    name: "no-missing-space-closed-atx"
    default: "on"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: ""
    gap: "`#Heading#`; the closing sequence of a heading is dropped by the formatter, a missing space is not reported."
    priority: "p2"
    batch: "B15 markdown-deferred"
    usage: "medium"
  - id: "MD021"
    name: "no-multiple-space-closed-atx"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "The closing sequence of an ATX heading is removed."
    gap: ""
    priority: "p2"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD022"
    name: "blanks-around-headings"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "One blank line around every heading."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD023"
    name: "heading-start-left"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Heading indentation is removed."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD024"
    name: "no-duplicate-heading"
    default: "on"
    kind: "lint"
    sudsy: "rule: no-duplicate-heading"
    coverage: "partial"
    notes: "Two headings with the same text anywhere in the file."
    gap: "No `siblings_only` option."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD025"
    name: "single-title"
    default: "on"
    kind: "lint"
    sudsy: "rule: single-title"
    coverage: "partial"
    notes: "The second and later level 1 heading."
    gap: "No `level` option, and a `title:` in the front matter does not count as a title."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD026"
    name: "no-trailing-punctuation"
    default: "on"
    kind: "lint"
    sudsy: "rule: no-trailing-punctuation"
    coverage: "partial"
    notes: "Headings ending in `.,;:!` or the full-width forms."
    gap: "No `punctuation` option; reported on the heading, not at the punctuation."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD027"
    name: "no-multiple-space-blockquote"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Every quote line starts with `> `."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD028"
    name: "no-blanks-blockquote"
    default: "on"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: ""
    gap: "A blank line between two block quotes; needs a rule over adjacent siblings."
    priority: "p2"
    batch: "B15 markdown-deferred"
    usage: "medium"
  - id: "MD029"
    name: "ol-prefix"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Numbers count up from the first (`1. 1. 1.` and `0. 0. 0.` stay)."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD030"
    name: "list-marker-space"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "One space after the marker."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD031"
    name: "blanks-around-fences"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "One blank line around fenced blocks."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD032"
    name: "blanks-around-lists"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "One blank line around lists."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD033"
    name: "no-inline-html"
    default: "on"
    kind: "lint"
    sudsy: "rule: no-inline-html"
    coverage: "partial"
    notes: "Raw HTML other than comments, once per block or inline tag."
    gap: "No `allowed_elements` option; an HTML block is one report, not one per tag."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD034"
    name: "no-bare-urls"
    default: "on"
    kind: "lint"
    sudsy: "rule: no-bare-urls"
    coverage: "partial"
    notes: "A URL after a space or at the start of a paragraph."
    gap: "Reported on the paragraph; a URL right after `(` or `[` is not found."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD035"
    name: "hr-style"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "`---` (`***` at the start of a file or item)."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD036"
    name: "no-emphasis-as-heading"
    default: "on"
    kind: "lint"
    sudsy: "rule: no-emphasis-as-heading"
    coverage: "partial"
    notes: "A one-line paragraph that is only emphasis, without closing punctuation."
    gap: "No `punctuation` option."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD037"
    name: "no-space-in-emphasis"
    default: "on"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: ""
    gap: "`* text *`; the parser reads it as text, so a rule needs a regex over paragraphs."
    priority: "p1"
    batch: "B15 markdown-deferred"
    usage: "medium"
  - id: "MD038"
    name: "no-space-in-code"
    default: "on"
    kind: "lint"
    sudsy: "rule: no-space-in-code"
    coverage: "covered"
    notes: "A code span that starts or ends with a space."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD039"
    name: "no-space-in-links"
    default: "on"
    kind: "lint"
    sudsy: "rule: no-space-in-links"
    coverage: "covered"
    notes: "Link text that starts or ends with a space."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD040"
    name: "fenced-code-language"
    default: "on"
    kind: "lint"
    sudsy: "rule: fenced-code-language"
    coverage: "partial"
    notes: "A fence without an info string."
    gap: "No `allowed_languages` or `language_only` options."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD041"
    name: "first-line-heading"
    default: "on"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: ""
    gap: "The first block must be a heading; needs a predicate on the first block."
    priority: "p1"
    batch: "B15 markdown-deferred"
    usage: "medium"
  - id: "MD042"
    name: "no-empty-links"
    default: "on"
    kind: "lint"
    sudsy: "rule: no-empty-links"
    coverage: "covered"
    notes: "A destination that is empty or only `#`."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD043"
    name: "required-headings"
    default: "on"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: ""
    gap: "Needs a configured heading structure; off by default."
    priority: "p3"
    batch: "B15 markdown-deferred"
    usage: "medium"
  - id: "MD044"
    name: "proper-names"
    default: "on"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: ""
    gap: "Needs a configured list of names; no names by default."
    priority: "p3"
    batch: "B15 markdown-deferred"
    usage: "medium"
  - id: "MD045"
    name: "no-alt-text"
    default: "on"
    kind: "lint"
    sudsy: "rule: no-alt-text"
    coverage: "partial"
    notes: "An image with empty alt text."
    gap: "An HTML `<img alt=\"\">` is not an image here."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD046"
    name: "code-block-style"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "partial"
    notes: "Fenced and indented blocks are kept as written."
    gap: "A document that mixes both is not unified (`consistent`)."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD047"
    name: "single-trailing-newline"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "`final_newline`."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD048"
    name: "code-fence-style"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Backtick fences (longer than any backtick run inside)."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD049"
    name: "emphasis-style"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "partial"
    notes: "`_text_`, where the parse cannot change."
    gap: "Other delimiters stay as written, so `consistent` may still report."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD050"
    name: "strong-style"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "partial"
    notes: "`**text**`, where the parse cannot change."
    gap: "Other delimiters stay as written, so `consistent` may still report."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD051"
    name: "link-fragments"
    default: "on"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: ""
    gap: "Needs the anchors of the headings and the GitHub slug rules."
    priority: "p1"
    batch: "B15 markdown-deferred"
    usage: "medium"
  - id: "MD052"
    name: "reference-links-images"
    default: "on"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: ""
    gap: "Needs the reference definitions of the file."
    priority: "p1"
    batch: "B15 markdown-deferred"
    usage: "medium"
  - id: "MD053"
    name: "link-image-reference-definitions"
    default: "on"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: ""
    gap: "Needs the references of the file."
    priority: "p2"
    batch: "B15 markdown-deferred"
    usage: "medium"
  - id: "MD054"
    name: "link-image-style"
    default: "on"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: ""
    gap: "Allows every style by default; restricting a style is opt-in."
    priority: "p3"
    batch: "B15 markdown-deferred"
    usage: "medium"
  - id: "MD055"
    name: "table-pipe-style"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Leading and trailing pipes on every row."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD056"
    name: "table-column-count"
    default: "on"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: "The formatter keeps rows with a different number of cells as they are."
    gap: "A row-length check needs the cell counts of siblings."
    priority: "p1"
    batch: "B15 markdown-deferred"
    usage: "medium"
  - id: "MD058"
    name: "blanks-around-tables"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "One blank line around tables."
    gap: ""
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD059"
    name: "descriptive-link-text"
    default: "on"
    kind: "lint"
    sudsy: "rule: descriptive-link-text"
    coverage: "partial"
    notes: "Link text `click here`, `here`, `link` or `more`."
    gap: "No `prohibited_texts` option."
    priority: "p1"
    batch: "B14 markdown-defaults"
    usage: "medium"
  - id: "MD060"
    name: "table-column-style"
    default: "on"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Columns are aligned to the widest cell."
    gap: ""
    priority: "p3"
    batch: "B14 markdown-defaults"
    usage: "medium"
