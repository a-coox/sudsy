tool: "markdownlint"
version: "0.24.0 (markdownlint-cli2; markdownlint 0.42.0)"
languages: ["markdown"]
sources:
  - "https://registry.npmjs.org/markdownlint-cli2/latest"
  - "https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md"
  - "https://github.com/DavidAnson/markdownlint/blob/main/schema/.markdownlint.jsonc"
entries:
  MD001: rule heading-increment
  MD003: formatter
  MD004: formatter | The second of two adjacent lists uses `*` (Prettier's way to keep them apart), which `consistent` reports.
  MD005: formatter
  MD007: formatter
  MD009: formatter
  MD010: deferred | Needs a shared line rule for tabs; a pattern cannot report a line.
  MD011: rule no-reversed-links | Reported on the paragraph, not the link; a link followed by a reference `[a](b)[c]` is not told apart.
  MD012: formatter
  MD013: rule max-line-length | No exemptions for code blocks, tables and headings (`code_blocks`, `tables`, `headings`), no `strict`, `stern` or `line_length` per-language defaults.
  MD014: rule commands-show-output | Reported once on the block, markdownlint reports every command line (so no parity fixture); indented code blocks are not checked.
  MD018: rule no-missing-space-atx
  MD019: formatter
  MD020: deferred | `#Heading#`; the closing sequence of a heading is dropped by the formatter, a missing space is not reported.
  MD021: formatter
  MD022: formatter
  MD023: formatter
  MD024: rule no-duplicate-heading | No `siblings_only` option.
  MD025: rule single-title | No `level` option, and a `title:` in the front matter does not count as a title.
  MD026: rule no-trailing-punctuation | No `punctuation` option; reported on the heading, not at the punctuation.
  MD027: formatter
  MD028: deferred | A blank line between two block quotes; needs a rule over adjacent siblings.
  MD029: formatter
  MD030: formatter
  MD031: formatter
  MD032: formatter
  MD033: rule no-inline-html | No `allowed_elements` option; an HTML block is one report, not one per tag.
  MD034: rule no-bare-urls | Reported on the paragraph; a URL right after `(` or `[` is not found.
  MD035: formatter
  MD036: rule no-emphasis-as-heading | No `punctuation` option.
  MD037: deferred | `* text *`; the parser reads it as text, so a rule needs a regex over paragraphs.
  MD038: rule no-space-in-code
  MD039: rule no-space-in-links
  MD040: rule fenced-code-language | No `allowed_languages` or `language_only` options.
  MD041: deferred | The first block must be a heading; needs a predicate on the first block.
  MD042: rule no-empty-links
  MD043: deferred | Needs a configured heading structure; off by default.
  MD044: deferred | Needs a configured list of names; no names by default.
  MD045: rule no-alt-text | An HTML `<img alt="">` is not an image here.
  MD046: formatter | A document that mixes both is not unified (`consistent`).
  MD047: formatter
  MD048: formatter
  MD049: formatter | Other delimiters stay as written, so `consistent` may still report.
  MD050: formatter | Other delimiters stay as written, so `consistent` may still report.
  MD051: deferred | Needs the anchors of the headings and the GitHub slug rules.
  MD052: deferred | Needs the reference definitions of the file.
  MD053: deferred | Needs the references of the file.
  MD054: deferred | Allows every style by default; restricting a style is opt-in.
  MD055: formatter
  MD056: deferred | A row-length check needs the cell counts of siblings.
  MD058: formatter
  MD059: rule descriptive-link-text | No `prohibited_texts` option.
  MD060: formatter
