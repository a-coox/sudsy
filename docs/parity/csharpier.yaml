tool: "csharpier"
version: "1.3.0 (NuGet latest; also the version pinned by the repo's dotnet-tools.json and used for the differential test)"
languages: ["csharp"]
sources:
  - "https://api.nuget.org/v3-flatcontainer/csharpier/index.json"
  - "https://csharpier.com/docs/Configuration"
  - "docs/formatting/csharp.md and docs/formatting/presets.md in this repo (differential numbers)"
scope: "CSharpier options, fixed editorconfig settings, and the known behavior differences. Rationale page returned 404, so layout principles come from the repo docs."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "printWidth"
    name: "printWidth (.editorconfig: max_line_length)"
    default: "100"
    kind: "format-option"
    sudsy: "option: csharp.format.line_width"
    coverage: "covered"
    notes: "Sudsy default is 120 (csharp/microsoft); csharp/csharpier-compat sets 100. Soft limit in both. Sudsy range 20..1000."
  - id: "useTabs"
    name: "useTabs (.editorconfig: indent_style)"
    default: "false"
    kind: "format-option"
    sudsy: "option: csharp.format.indent_style"
    coverage: "covered"
    notes: ""
  - id: "indentSize"
    name: "indentSize (.editorconfig: indent_size)"
    default: "4 (C#), 2 (XML)"
    kind: "format-option"
    sudsy: "option: csharp.format.indent_size"
    coverage: "covered"
    notes: "CSharpier ignores `tab_width`; Sudsy uses indent_size as the tab width."
  - id: "endOfLine"
    name: "endOfLine (.editorconfig: end_of_line)"
    default: "auto"
    kind: "format-option"
    sudsy: "planned"
    coverage: "missing"
    notes: "Sudsy's `LineEnding::detect/of_tree` implements auto. Shared option `end_of_line: auto|lf|crlf` (see yamllint new-lines) and the .editorconfig `end_of_line` mapping."
    gap: "`auto` (keep the file's ending, normalize mixed ones by the first line) is Sudsy's only behavior; `lf` and `crlf` cannot be forced"
    priority: "p1"
    batch: "B2 shared-format-options"
    usage: "high"
  - id: "xmlWhitespaceSensitivity"
    name: "xmlWhitespaceSensitivity"
    default: "strict"
    kind: "format-option"
    sudsy: "wontfix: XML (csproj, props, xaml, config) is not a Sudsy language"
    coverage: "wontfix"
    notes: ""
  - id: "overrides"
    name: "overrides[].files / formatter / options"
    default: "[]"
    kind: "format-option"
    sudsy: "config: overrides"
    coverage: "partial"
    notes: "`csharpier_formatter` in .editorconfig is the same feature. Sudsy matches the `cs` extension only (lang-csharp FileMatcher); CSharpier's default glob is **/*.{cs,csx}, so .csx files are not formatted by Sudsy."
    gap: "`overrides` applies options per glob; there is no `formatter` key to treat other extensions (.csx, .csr, .cst) as C#"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "preprocessorSymbolSets"
    name: "preprocessorSymbolSets (undocumented on the configuration page)"
    default: "unverified"
    kind: "format-option"
    sudsy: "planned"
    coverage: "partial"
    notes: "Known difference in docs/formatting/csharp.md. Formatting inactive `#if` branches is in scope and planned; today Sudsy formats the active branch and keeps the others verbatim (option csharp.format.preprocessor_symbols picks the symbols)."
    gap: "CSharpier formats every `#if` branch; Sudsy formats only the active branch and keeps the others verbatim (formatting inactive branches is planned)"
    priority: "p2"
    batch: "B11 csharpier-gaps"
    usage: "medium"
  - id: "fixed: charset = utf-8"
    name: ".editorconfig charset"
    default: "utf-8, fixed"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: ""
    gap: "Sudsy keeps an existing BOM and never transcodes; non-UTF-8 files are not handled (unverified)"
    priority: "p3"
    batch: "B11 csharpier-gaps"
    usage: "low"
  - id: "fixed: insert_final_newline = true"
    name: ".editorconfig insert_final_newline"
    default: "true, fixed"
    kind: "format-option"
    sudsy: "option: csharp.format.final_newline"
    coverage: "covered"
    notes: "Sudsy default true and configurable."
  - id: "fixed: trim_trailing_whitespace = true"
    name: ".editorconfig trim_trailing_whitespace"
    default: "true, fixed"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "fixed: dotnet_sort_system_directives_first = true"
    name: "using sorting (System first)"
    default: "true, fixed"
    kind: "format-option"
    sudsy: "planned"
    coverage: "partial"
    notes: "Largest known diff source between Sudsy and CSharpier output besides `#if` handling. Sort usings is in scope: Sudsy has the rule `using-order` (off by default, safe fix); sorting as formatter behavior or an enabled fix is planned."
    gap: "CSharpier always sorts usings; Sudsy has the opt-in rule `using-order` (off, fix) and the formatter does not sort (it needs a safety check that treats a run of usings as unordered)"
    priority: "p2"
    batch: "B11 csharpier-gaps"
    usage: "high"
  - id: "fixed: dotnet_separate_import_directive_groups = false"
    name: "no blank lines between using groups"
    default: "false, fixed"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: ""
    gap: "Blank lines between usings are preserved (max one), not removed"
    priority: "p3"
    batch: "B11 csharpier-gaps"
    usage: "low"
  - id: ".csharpierignore, --config-path, --ignore-path, --no-cache etc."
    name: "CLI/ignore files"
    default: "n/a"
    kind: "format-option"
    sudsy: "config: exclude, ignore files"
    coverage: "covered"
    notes: "`sudsy format --check` ~ `csharpier check`. Skipping generated files (<auto-generated>): unverified in Sudsy."
  - id: "behavior: width is a soft limit"
    name: "layout model (Wadler/Prettier-style)"
    default: "n/a"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Same document-printer family; the csharpier-compat preset expresses the remaining choices through named options."
  - id: "behavior: differential result"
    name: "7659-file corpus, CSharpier 1.3.0"
    default: "n/a"
    kind: "format-option"
    sudsy: "config: preset csharp/csharpier-compat"
    coverage: "partial"
    notes: "Known differences listed there: using sort order, formatting every #if branch, interpolated strings as arguments, chains inside lambdas, casts before `new`, parenthesized operands, trailing commas next to comments, indentation and blank lines after #region/comments."
    gap: "4952 of 7659 files (65%) identical (aspnetcore 2192/3122, roslyn 1657/2858, runtime 1103/1679), from docs/formatting/csharp.md (not re-run here)"
    priority: "p2"
    batch: "B11 csharpier-gaps"
    usage: "high"
  - id: "behavior: no config for layout choices"
    name: "opinionated output (braces, wrapping, blank lines, trailing commas)"
    default: "n/a"
    kind: "format-option"
    sudsy: "config: preset csharp/csharpier-compat (18 named options)"
    coverage: "covered"
    notes: "Only 5 CSharpier options exist; everything else is fixed behavior, which Sudsy exposes as named options so other presets can differ."
