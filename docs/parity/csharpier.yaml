tool: "csharpier"
version: "1.3.0 (NuGet latest; also the version pinned by the repo's dotnet-tools.json and used for the differential test)"
languages: ["csharp", "xml"]
sources:
  - "https://api.nuget.org/v3-flatcontainer/csharpier/index.json"
  - "https://csharpier.com/docs/Configuration"
  - "docs/formatting/csharp.md and docs/formatting/presets.md in this repo (differential numbers)"
scope: "CSharpier options, fixed editorconfig settings, and the known behavior differences. Rationale page returned 404, so layout principles come from the repo docs."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "printWidth"
    name: "printWidth (.editorconfig: max_line_length)"
    default: "100"
    kind: "format-option"
    sudsy: "option: csharp.format.line_width"
    coverage: "covered"
    notes: "Sudsy default is 120 (csharp/microsoft); csharp/csharpier-compat sets 100. Soft limit in both. Sudsy range 20..1000."
  - id: "useTabs"
    name: "useTabs (.editorconfig: indent_style)"
    default: "false"
    kind: "format-option"
    sudsy: "option: csharp.format.indent_style"
    coverage: "covered"
    notes: ""
  - id: "indentSize"
    name: "indentSize (.editorconfig: indent_size)"
    default: "4 (C#), 2 (XML)"
    kind: "format-option"
    sudsy: "option: csharp.format.indent_size"
    coverage: "covered"
    notes: "CSharpier ignores `tab_width`; Sudsy uses indent_size as the tab width."
  - id: "endOfLine"
    name: "endOfLine (.editorconfig: end_of_line)"
    default: "auto"
    kind: "format-option"
    sudsy: "option: csharp.format.end_of_line"
    coverage: "covered"
    notes: "Option `end_of_line`: `auto` keeps the file's first line ending, `lf` and `crlf` force it. `.editorconfig` `end_of_line` (`lf`, `crlf`) is mapped."
    priority: "p1"
    usage: "high"
  - id: "xmlWhitespaceSensitivity"
    name: "xmlWhitespaceSensitivity"
    default: "strict"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: "Sudsy's XML formatter (`xml/csharpier-compat`) always keeps whitespace in text (`strict`); there is no `ignore` mode (roadmap). Parity: `scripts/parity.sh format csharpier-xml`, differences in `tests/parity/csharpier-xml/expected-diff.txt`."
    gap: "no `ignore` mode (CSharpier's default for xaml and axaml); CSharpier also wraps text in `ignore` mode"
  - id: "overrides"
    name: "overrides[].files / formatter / options"
    default: "[]"
    kind: "format-option"
    sudsy: "config: overrides"
    coverage: "partial"
    notes: "`csharpier_formatter` in .editorconfig is the same feature. Sudsy matches `.cs` and `.csx` (lang-csharp FileMatcher), CSharpier's default glob **/*.{cs,csx}."
    gap: "`overrides` applies options per glob; there is no `formatter` key to treat other extensions (.csr, .cst) as C#; a `.csx` with `#r` or `#load` fails to parse (the worker parses scripts as ordinary files)"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "preprocessorSymbolSets"
    name: "preprocessorSymbolSets (undocumented on the configuration page)"
    default: "unverified"
    kind: "format-option"
    sudsy: "option: csharp.format.derive_symbol_sets"
    coverage: "covered"
    notes: "CSharpier formats every `#if` branch by parsing once per symbol set. csharp/csharpier-compat sets derive_symbol_sets: true (sets taken from the conditions of the file, at most 16, until every branch was active once); csharp.format.preprocessor_symbol_sets lists sets by hand. Both off by default, inactive branches stay verbatim. Checked against CSharpier 1.3.0 by `scripts/parity.sh format csharpier` (tests/parity/csharpier)."
    gap: "The configured sets are not read (the value format is undocumented): csharp/csharpier-compat derives the sets from the conditions of each file instead; a branch no subset of those symbols activates (`#if false`) stays verbatim"
    priority: "p2"
    batch: "B11 csharpier-gaps"
    usage: "medium"
  - id: "fixed: charset = utf-8"
    name: ".editorconfig charset"
    default: "utf-8, fixed"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: ""
    gap: "Sudsy keeps an existing BOM and never transcodes; non-UTF-8 files are not handled (unverified)"
    priority: "p3"
    batch: "B11 csharpier-gaps"
    usage: "low"
  - id: "fixed: insert_final_newline = true"
    name: ".editorconfig insert_final_newline"
    default: "true, fixed"
    kind: "format-option"
    sudsy: "option: csharp.format.final_newline"
    coverage: "covered"
    notes: "Sudsy default true and configurable."
  - id: "fixed: trim_trailing_whitespace = true"
    name: ".editorconfig trim_trailing_whitespace"
    default: "true, fixed"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "fixed: dotnet_sort_system_directives_first = true"
    name: "using sorting (System first)"
    default: "true, fixed"
    kind: "format-option"
    sudsy: "option: csharp.format.sort_usings"
    coverage: "covered"
    notes: "Checked against CSharpier 1.3.0 on mixed lists (System first, `using static`, aliases, case, underscores, digits, comments above a using, namespaces, `global using` first, `using global::X` behind the System ones, `#if` regions: `scripts/parity.sh format csharpier`): same order. Groups: System, others, `using static` (System first), aliases; names compare as the invariant culture ignoring case, equal names keep their order (`compare: culture_ignore_case`). Comments above a using move with it; blank lines between usings go; `#if` regions stay as written behind the sorted directives. The `csharp/csharpier-compat` preset sets it."
  - id: "fixed: dotnet_separate_import_directive_groups = false"
    name: "no blank lines between using groups"
    default: "false, fixed"
    kind: "format-option"
    sudsy: "option: csharp.format.sort_usings"
    coverage: "partial"
    notes: "With `sort_usings` the blank lines between usings go, as CSharpier does."
    gap: "Without `sort_usings` blank lines between usings are preserved (max one)"
  - id: ".csharpierignore, --config-path, --ignore-path, --no-cache etc."
    name: "CLI/ignore files"
    default: "n/a"
    kind: "format-option"
    sudsy: "config: exclude, ignore files"
    coverage: "covered"
    notes: "`sudsy format --check` ~ `csharpier check`. Skipping generated files (<auto-generated>): unverified in Sudsy."
  - id: "behavior: width is a soft limit"
    name: "layout model (Wadler/Prettier-style)"
    default: "n/a"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Same document-printer family; the csharpier-compat preset expresses the remaining choices through named options."
  - id: "behavior: differential result"
    name: "7659-file corpus, CSharpier 1.3.0"
    default: "n/a"
    kind: "format-option"
    sudsy: "config: preset csharp/csharpier-compat"
    coverage: "partial"
    notes: "Known differences listed there: interpolated strings as arguments, chains inside lambdas, casts before `new`, parenthesized operands, trailing commas next to comments, indentation and blank lines after #region/comments."
    gap: "5191 of 7614 compared files (68%) identical, 45 of 7659 left alone by CSharpier (aspnetcore 2295/3122, roslyn 1770/2858, runtime 1126/1679), differential test with derive_symbol_sets on"
    priority: "p2"
    batch: "B11 csharpier-gaps"
    usage: "high"
  - id: "behavior: no config for layout choices"
    name: "opinionated output (braces, wrapping, blank lines, trailing commas)"
    default: "n/a"
    kind: "format-option"
    sudsy: "config: preset csharp/csharpier-compat (24 named options)"
    coverage: "covered"
    notes: "Only 5 CSharpier options exist; everything else is fixed behavior, which Sudsy exposes as named options so other presets can differ. Empty `for` clauses (CSharpier 1.3.0 on `for (;;)`, `for (int i = 0;;)`, `for (; i < 3;)`: `for (; ; )`, `for (int i = 0; ; )`, `for (; i < 3; )`; dotnet format whitespace: `for (; ; )`, `for (int i = 0; ;)`, `for (; i < 3;)`; StyleCop SA1002/SA1009: `for (; ;)`) agree only on the first form, so the default stays `for (;;)`; `space_between_empty_for_clauses` (set by csharp/stylecop) gives `for (; ;)` and, with `space_after_empty_last_for_clause`, csharp/csharpier-compat gives CSharpier's `for (; ; )`."
