tool: "csharpier"
version: "1.3.0 (NuGet latest; also the version pinned by the repo's dotnet-tools.json and used for the differential test)"
languages: ["csharp", "xml"]
sources:
  - "https://api.nuget.org/v3-flatcontainer/csharpier/index.json"
  - "https://csharpier.com/docs/Configuration"
  - "docs/formatting/csharp.md and docs/formatting/presets.md in this repo (differential numbers)"
scope: "CSharpier options, fixed editorconfig settings, and the known behavior differences. Rationale page returned 404, so layout principles come from the repo docs."
entries:
  printWidth: option csharp.format.line_width
  useTabs: option csharp.format.indent_style
  indentSize: option csharp.format.indent_size
  endOfLine: option csharp.format.end_of_line
  xmlWhitespaceSensitivity: formatter | no `ignore` mode (CSharpier's default for xaml and axaml); CSharpier also wraps text in `ignore` mode
  overrides: config overrides | `overrides` applies options per glob; there is no `formatter` key to treat other extensions (.csr, .cst) as C#; a `.csx` with `#r` or `#load` fails to parse (the worker parses scripts as ordinary files)
  preprocessorSymbolSets: option csharp.format.derive_symbol_sets
  "fixed: charset = utf-8": "formatter | Sudsy keeps an existing BOM and never transcodes; non-UTF-8 files are not handled (unverified)"
  "fixed: insert_final_newline = true": "option csharp.format.final_newline"
  "fixed: trim_trailing_whitespace = true": "formatter"
  "fixed: dotnet_sort_system_directives_first = true": "option csharp.format.sort_usings"
  "fixed: dotnet_separate_import_directive_groups = false": "option csharp.format.sort_usings | Without `sort_usings` blank lines between usings are preserved (max one)"
  .csharpierignore, --config-path, --ignore-path, --no-cache etc.: config exclude, ignore files
  "behavior: width is a soft limit": "formatter"
  "behavior: differential result": "config preset csharp/csharpier-compat | 5222 of 7614 compared files (68.6%) identical, 45 of 7659 left alone by CSharpier (aspnetcore 2316/3122, roslyn 1775/2858, runtime 1131/1679), differential test with derive_symbol_sets on"
  "behavior: no config for layout choices": "config preset csharp/csharpier-compat (24 named options)"
