    priority: "p1"
    usage: "medium"
  - id: "ENUM_ZERO_VALUE_SUFFIX"
    name: "enum-zero-value-suffix"
    default: "on"
    kind: "lint"
    sudsy: "rule: enum-zero-value-suffix"
    coverage: "partial"
    notes: "Reported with the default suffix."
