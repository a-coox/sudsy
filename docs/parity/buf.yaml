tool: "buf"
version: "1.75.0 (GitHub release; the version `scripts/parity.sh format buf` downloads)"
languages: ["protobuf"]
sources:
  - "https://buf.build/docs/reference/cli/buf/format/"
  - "tests/parity/buf (differential numbers, docs/development/parity.md)"
scope: "`buf format`, the de-facto Protobuf formatter, and `buf lint`. It has no style options; Sudsy's defaults reproduce its layout. Differences are measured by `scripts/parity.sh format buf` on the folder's fixtures and the Protobuf corpus (`tests/conformance/fetch-proto-corpus.sh`); the known ones are listed in `tests/parity/buf/expected-diff.txt`. `scripts/parity.sh buf` compares `buf lint` with Sudsy's rules on the rule fixtures; the lint entries are the rules of `buf config ls-lint-rules`."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "format"
    name: "buf format"
    default: "on"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: "Indentation of two spaces, one statement per line, compact options broken over lines, message literals expanded, comments kept."
    gap: "320 of 323 corpus files are identical; the other 3 are listed with their reasons in tests/parity/buf/expected-diff.txt."
    priority: "p1"
    usage: "high"
  - id: "diff"
    name: "-d, --diff"
    default: "false"
    kind: "format-option"
    sudsy: "config: `sudsy format --check`"
    coverage: "covered"
    notes: "Sudsy reports the files that would change."
    priority: "p2"
    usage: "medium"
  - id: "ENUM_FIRST_VALUE_ZERO"
    name: "enum-first-value-zero"
    default: "on"
    kind: "lint"
    sudsy: "rule: enum-first-value-zero"
    coverage: "covered"
    notes: "STANDARD category; off in Sudsy unless the preset `protobuf/buf-standard` is used."
    priority: "p1"
    usage: "medium"
  - id: "ENUM_NO_ALLOW_ALIAS"
    name: "enum-no-allow-alias"
    default: "on"
    kind: "lint"
    sudsy: "rule: enum-no-allow-alias"
    coverage: "covered"
    notes: "STANDARD category; off in Sudsy unless the preset `protobuf/buf-standard` is used."
    priority: "p1"
    usage: "medium"
  - id: "ENUM_PASCAL_CASE"
    name: "enum-pascal-case"
    default: "on"
    kind: "lint"
    sudsy: "rule: enum-pascal-case"
    coverage: "covered"
    notes: "STANDARD category; off in Sudsy unless the preset `protobuf/buf-standard` is used."
    priority: "p1"
    usage: "medium"
  - id: "ENUM_VALUE_UPPER_SNAKE_CASE"
    name: "enum-value-upper-snake-case"
    default: "on"
    kind: "lint"
    sudsy: "rule: enum-value-upper-snake-case"
    coverage: "covered"
    notes: "STANDARD category; off in Sudsy unless the preset `protobuf/buf-standard` is used."
    priority: "p1"
    usage: "medium"
  - id: "FIELD_LOWER_SNAKE_CASE"
    name: "field-lower-snake-case"
    default: "on"
    kind: "lint"
    sudsy: "rule: field-lower-snake-case"
    coverage: "covered"
    notes: "STANDARD category; off in Sudsy unless the preset `protobuf/buf-standard` is used."
    priority: "p1"
    usage: "medium"
  - id: "FIELD_NOT_REQUIRED"
    name: "field-not-required"
    default: "on"
    kind: "lint"
    sudsy: "rule: field-not-required"
    coverage: "covered"
    notes: "STANDARD category; off in Sudsy unless the preset `protobuf/buf-standard` is used."
    priority: "p1"
    usage: "medium"
  - id: "IMPORT_NO_PUBLIC"
    name: "import-no-public"
    default: "on"
    kind: "lint"
    sudsy: "rule: import-no-public"
    coverage: "covered"
