tool: "prettier"
version: "3.9.10 (npm latest; the options page does not print the version)"
languages: ["yaml", "json", "markdown"]
sources:
  - "https://registry.npmjs.org/prettier/latest"
  - "https://prettier.io/docs/options"
  - "https://prettier.io/docs/rationale"
  - "https://raw.githubusercontent.com/prettier/prettier/main/src/language-yaml/options.js (YAML-specific options: bracketSpacing, singleQuote, proseWrap)"
  - "https://prettier.io/blog/2024/01/12/3.2.0"
scope: "YAML, JSON/JSONC and Markdown only; formatter has no lint rules"
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "printWidth"
    name: "Print Width"
    default: "80"
    kind: "format-option"
    sudsy: "option: json.format.line_width"
    coverage: "covered"
    notes: "Defaults match (80). Sudsy range 20..1000; Prettier accepts any integer. Sudsy: json.format.line_width / yaml.format.line_width."
  - id: "tabWidth"
    name: "Tab Width"
    default: "2"
    kind: "format-option"
    sudsy: "option: json.format.indent_size"
    coverage: "covered"
    notes: "Sudsy range 1..16. Sudsy: json.format.indent_size / yaml.format.indent_size."
  - id: "useTabs"
    name: "Tabs"
    default: "false"
    kind: "format-option"
    sudsy: "option: json.format.indent_style"
    coverage: "covered"
    notes: "JSON only; YAML cannot be tab-indented (Prettier ignores it there too). Sudsy has no indent_style for YAML by design."
  - id: "endOfLine"
    name: "End of Line"
    default: "lf"
    kind: "format-option"
    sudsy: "option: json.format.end_of_line"
    coverage: "covered"
    notes: "Option `end_of_line` (`auto`, `lf`, `crlf`) in JSON, YAML and C#; the prettier-compat presets set `lf`."
    priority: "p1"
    usage: "high"
  - id: "bracketSpacing"
    name: "Bracket Spacing"
    default: "true"
    kind: "format-option"
    sudsy: "option: json.format.bracket_spacing"
    coverage: "covered"
    notes: "Shared option `bracket_spacing` for JSON objects and YAML flow mappings, default true."
    priority: "p2"
    usage: "medium"
  - id: "singleQuote (yaml)"
    name: "Quotes"
    default: "false"
    kind: "format-option"
    sudsy: "option: yaml.format.quote_style"
    coverage: "covered"
    notes: "false ~ `prefer_double` (the prettier-compat preset); true ~ `single`. Both fall back to the other quote when it needs fewer escapes. Exact equivalence on edge cases (backslashes, `\\n` in double quotes) unverified."
  - id: "singleQuote (json)"
    name: "Quotes"
    default: "false"
    kind: "format-option"
    sudsy: "wontfix: no json5 dialect"
    coverage: "wontfix"
    notes: "Applies to the json5 parser only."
  - id: "quoteProps"
    name: "Quote Props"
    default: "as-needed"
    kind: "format-option"
    sudsy: "wontfix: no json5 dialect"
    coverage: "wontfix"
    notes: "json5 only; JSON keys are always double-quoted."
  - id: "trailingComma"
    name: "Trailing Commas"
    default: "all"
    kind: "format-option"
    sudsy: "option: json.format.trailing_commas"
    coverage: "partial"
    notes: "Sudsy: never|multiline, JSONC only. Default never ~ Prettier json. Verify with a prettier run before finalizing the preset."
    gap: "Prettier's `json` parser never adds commas; whether the `jsonc` parser adds them under `all` is unverified (issue 15553 and Zed docs suggest the .jsonc extension can add trailing commas)"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "objectWrap"
    name: "Object Wrap"
    default: "preserve"
    kind: "format-option"
    sudsy: "option: json.format.collapse"
    coverage: "covered"
    notes: "preserve ~ `collapse: opening_break`; collapse ~ `collapse: always`. The json/prettier-compat preset uses opening_break. Applies to JSON objects; Sudsy `preserve` (default) is a different rule (any break between delimiters keeps it expanded)."
  - id: "proseWrap"
    name: "Prose Wrap"
    default: "preserve"
    kind: "format-option"
    sudsy: "wontfix: deferred, docs/roadmap.md (YAML re-wrapping)"
    coverage: "wontfix"
    notes: "Default `preserve` equals Sudsy behavior; `always`/`never` need scalar and comment re-wrapping, which the roadmap defers. Treat as covered for default configs."
  - id: "embeddedLanguageFormatting"
    name: "Embedded Language Formatting"
    default: "auto"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "`embedded_language_formatting` of Markdown: `auto` (the default, as in Prettier) formats the code of a fence with the formatter of the language it names, `off` keeps it. The parity run uses `off` (Sudsy formats the languages it has with its own options)."
  - id: "insertPragma / requirePragma / checkIgnorePragma"
    name: "Pragma options"
    default: "false"
    kind: "format-option"
    sudsy: "wontfix: no pragma mode"
    coverage: "wontfix"
    notes: "Gradual adoption is done with include/exclude and overrides."
  - id: "rangeStart / rangeEnd"
    name: "Range"
    default: "0 / Infinity"
    kind: "format-option"
    sudsy: "wontfix: deferred, docs/roadmap.md (range formatting)"
    coverage: "wontfix"
    notes: ""
  - id: "semi, jsxSingleQuote, arrowParens, bracketSameLine, singleAttributePerLine, htmlWhitespaceSensitivity, vueIndentScriptAndStyle, experimentalTernaries, experimentalOperatorPosition"
    name: "JS/CSS/HTML/Vue options"
    default: "n/a"
    kind: "format-option"
    sudsy: "wontfix: not applicable to JSON/YAML"
    coverage: "wontfix"
    notes: ""
  - id: "overrides / .prettierignore / .editorconfig"
    name: "Config features"
    default: "n/a"
    kind: "format-option"
    sudsy: "config: overrides, exclude, ignore files, .editorconfig"
    coverage: "covered"
    notes: "sudsy.yaml `overrides` (globs) and ignore files; .editorconfig indent_style, indent_size, max_line_length, insert_final_newline are read (end_of_line is not)."
  - id: "json: package.json / package-lock.json / composer.json"
    name: "json-stringify parser for machine-generated files"
    default: "automatic"
    kind: "format-option"
    sudsy: "option: json.format.collapse"
    coverage: "covered"
    notes: "Presets `json/prettier-compat` and `json/biome` carry an `overrides` entry for these files with `collapse: never`."
    priority: "p2"
    usage: "high"
  - id: "json: number arrays are filled"
    name: "arrays of numbers use fill layout"
    default: "automatic"
    kind: "format-option"
    sudsy: "planned"
    coverage: "missing"
    notes: "Prettier packs numbers several per line. Verified: Sudsy expands a long number array one per line. Would need a named option (e.g. `number_array_layout: fill`)."
    gap: "docs/formatting/presets.md: 'Number arrays not filled, numbers not normalized'"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "medium"
  - id: "json: tolerant parser"
    name: "`json` parser accepts comments, single quotes, unquoted keys"
    default: "automatic"
    kind: "format-option"
    sudsy: "wontfix: strict parser by design"
    coverage: "wontfix"
    notes: "Sudsy reports these as syntax errors (verified), dialect json rejects comments; jsonc allows comments and trailing commas only."
  - id: "json: blank lines kept (max 1)"
    name: "empty line preservation"
    default: "automatic"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified in a JSONC sample."
  - id: "json: comments kept"
    name: "comment preservation"
    default: "automatic"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "json: file name routing"
    name: ".babelrc, .eslintrc, tsconfig.json, *.jsonc, ..."
    default: "automatic"
    kind: "format-option"
    sudsy: "option: json.format.dialect"
    coverage: "partial"
    notes: "Users extend through `overrides` + `dialect`. Sudsy: json.format.dialect (auto)."
    gap: "Sudsy routes *.json to strict json and a short list (*.jsonc, tsconfig.json, .vscode/*.json) to jsonc; Prettier's list is longer (unverified which names)"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "yaml: comments and blank lines kept"
    name: "comment / blank line preservation"
    default: "automatic"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "yaml: sequences under mappings indented"
    name: "indent sequences"
    default: "automatic"
    kind: "format-option"
    sudsy: "option: yaml.format.sequence_indent"
    coverage: "covered"
    notes: "Sudsy default is preserve; the prettier-compat preset sets indented. Sudsy: yaml.format.sequence_indent=indented."
  - id: "yaml: blank line after key removed"
    name: "key followed by blank line then block value"
    default: "automatic"
    kind: "format-option"
    sudsy: "option: yaml.format.blank_lines_after_key"
    coverage: "covered"
    notes: "Sudsy: yaml.format.blank_lines_after_key=remove."
  - id: "yaml: document marker handling"
    name: "`---` printed only between documents / when needed"
    default: "automatic"
    kind: "format-option"
    sudsy: "option: yaml.format.document_start"
    coverage: "partial"
    notes: ""
    gap: "Prettier's rule for a leading `---` (kept for directives and comments?) is unverified; preset uses preserve"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "yaml: long scalars / flow collections"
    name: "folding of long plain scalars; flow collections broken at printWidth"
    default: "automatic"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: "Prettier with proseWrap=preserve also keeps scalar line structure; differences expected only for long single-line scalars (unverified)."
    gap: "Sudsy does not re-wrap long plain/quoted scalars or comments (known gap); flow collections that do not fit move/break"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "yaml: # prettier-ignore"
    name: "ignore comment"
    default: "automatic"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "`sudsy-ignore` before an entry and `-start`/`-end` pairs in block collections (YAML); JSONC comment markers."
  - id: "markdown: formatting at proseWrap=preserve"
    name: "Markdown"
    default: "automatic"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "`markdown/prettier-compat` against Prettier 3.9 with embeddedLanguageFormatting=off on the repo's docs, a fixture and 23 files of dotnet/runtime docs: 55 of 64 identical (`scripts/parity.sh format prettier`). Setext headings, escapes and code stay as written, as in Prettier 3.9."
    gap: "Code spans with three backticks, blocks with tabs and lists that would parse differently when restyled are kept as written; trailing blanks in code are kept; no front matter formatting; the code of fences is formatted with the formatter of its language (`embedded_language_formatting`, default `auto` as in Prettier; the comparison runs with it off)."
    priority: "p2"
    batch: "B14 markdown-defaults"
    usage: "medium"
