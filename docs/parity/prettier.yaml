tool: "prettier"
version: "3.9.10 (npm latest; the options page does not print the version)"
languages: ["yaml", "json", "markdown", "graphql", "js", "css"]
sources:
  - "https://registry.npmjs.org/prettier/latest"
  - "https://prettier.io/docs/options"
  - "https://prettier.io/docs/rationale"
  - "https://raw.githubusercontent.com/prettier/prettier/main/src/language-yaml/options.js (YAML-specific options: bracketSpacing, singleQuote, proseWrap)"
  - "https://prettier.io/blog/2024/01/12/3.2.0"
scope: "YAML, JSON/JSONC, Markdown, GraphQL, JavaScript/TypeScript (js) and CSS/SCSS/Less (css); formatter has no lint rules"
entries:
  printWidth: option json.format.line_width
  tabWidth: option json.format.indent_size
  useTabs: option json.format.indent_style
  endOfLine: option json.format.end_of_line
  bracketSpacing: option json.format.bracket_spacing
  singleQuote (yaml): option yaml.format.quote_style
  singleQuote (json): wontfix no json5 dialect
  quoteProps (json): wontfix no json5 dialect
  trailingComma: option json.format.trailing_commas | Prettier's `json` parser never adds commas; whether the `jsonc` parser adds them under `all` is unverified (issue 15553 and Zed docs suggest the .jsonc extension can add trailing commas)
  objectWrap: option json.format.collapse
  proseWrap: wontfix deferred, docs/roadmap.md (YAML re-wrapping)
  embeddedLanguageFormatting: formatter
  insertPragma / requirePragma / checkIgnorePragma: wontfix no pragma mode
  rangeStart / rangeEnd: wontfix deferred, docs/roadmap.md (range formatting)
  htmlWhitespaceSensitivity, vueIndentScriptAndStyle: wontfix not applicable to the supported languages
  overrides / .prettierignore / .editorconfig: config overrides, exclude, ignore files, .editorconfig
  "json: package.json / package-lock.json / composer.json": "option json.format.collapse"
  "json: number arrays are filled": "planned | docs/formatting/presets.md: 'Number arrays not filled, numbers not normalized'"
  "json: tolerant parser": "wontfix strict parser by design"
  "json: blank lines kept (max 1)": "formatter"
  "json: comments kept": "formatter"
  "json: file name routing": "option json.format.dialect | Sudsy routes *.json to strict json and a short list (*.jsonc, tsconfig.json, .vscode/*.json) to jsonc; Prettier's list is longer (unverified which names)"
  "yaml: comments and blank lines kept": "formatter"
  "yaml: sequences under mappings indented": "option yaml.format.sequence_indent"
  "yaml: blank line after key removed": "option yaml.format.blank_lines_after_key"
  "yaml: document marker handling": "option yaml.format.document_start | Prettier's rule for a leading `---` (kept for directives and comments?) is unverified; preset uses preserve"
  "yaml: long scalars / flow collections": "formatter | Sudsy does not re-wrap long plain/quoted scalars or comments (known gap); flow collections that do not fit move/break"
  "yaml: # prettier-ignore": "formatter"
  "markdown: formatting at proseWrap=preserve": "formatter"
  "graphql: formatting": "formatter | A file the tree-sitter grammar cannot parse is not formatted (`extend directive`); Unicode escapes in strings are kept, Prettier decodes them."
  printWidth (js): option js.format.line_width
  tabWidth (js): option js.format.indent_size
  useTabs (js): option js.format.indent_style
  endOfLine (js): option js.format.end_of_line
  bracketSpacing (js): option js.format.bracket_spacing
  objectWrap (js): "planned | js.format.collapse (the first-line break of an object is kept)"
  semi: option js.format.semi
  singleQuote (js): option js.format.quote_style
  jsxSingleQuote: option js.format.jsx_single_quote
  quoteProps (js): "option js.format.quote_props | numeric property names are left as written"
  trailingComma (js): "option js.format.trailing_commas | es5 and none are not applied to TypeScript lists"
  arrowParens: option js.format.arrow_parens
  bracketSameLine: option js.format.bracket_same_line
  singleAttributePerLine: "planned | js.format.single_attribute_per_line"
  experimentalTernaries, experimentalOperatorPosition: "wontfix not planned; Prettier marks them experimental"
  "js: formatting": "planned | docs/design/wave-3b-js.md steps 4-10; the parser and a verbatim formatter come first"
  "js: // prettier-ignore": "planned | docs/design/wave-3b-js.md step 9"
  "js: embedded CSS/GraphQL/HTML/Markdown in templates": "deferred | formatted by those languages' own formatters later"
  "js: Flow syntax": "wontfix not supported by the parser; reported as a syntax error"
  printWidth (css): option css.format.line_width
  tabWidth (css): option css.format.indent_size
  useTabs (css): option css.format.indent_style
  endOfLine (css): option css.format.end_of_line
  singleQuote (css): option css.format.single_quote
  "css: formatting (css, scss, less)": "planned | docs/design/wave-3b-css.md steps 3-4; the parser and a verbatim formatter come first"
  "css: /* prettier-ignore */": "planned | docs/design/wave-3b-css.md step 3"
  "css: Sass indented syntax": "wontfix Prettier does not format it either"
