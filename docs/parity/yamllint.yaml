tool: "yamllint"
version: "1.38.0 (released 2026-01-13)"
languages: ["yaml"]
sources:
  - "https://pypi.org/project/yamllint/"
  - "https://yamllint.readthedocs.io/en/stable/rules.html"
  - "https://github.com/adrienverge/yamllint/blob/master/yamllint/conf/default.yaml"
default_config: "default.yaml per fetched summary: error = anchors braces brackets colons commas empty-lines hyphens indentation key-duplicates line-length new-line-at-end-of-file new-lines trailing-spaces; warning = comments comments-indentation document-start truthy; disabled = document-end empty-values float-values key-ordering octal-values quoted-strings. Summarised by a fetch tool, not read verbatim"
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "anchors"
    name: "anchors"
    default: "on (error)"
    kind: "lint"
    sudsy: "rule: no-undefined-alias"
    coverage: "partial"
    notes: "`a: *nope` is an error diagnostic (`no-undefined-alias`) and the file still formats. Proposal for the rest: `no-duplicate-anchors` and `no-unused-anchors` as yaml style rules (off by default, like yamllint)."
    gap: "duplicated and unused anchors are not checked"
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "medium"
  - id: "anchors.forbid-undeclared-aliases"
    name: "forbid-undeclared-aliases"
    default: "true"
    kind: "lint"
    sudsy: "rule: no-undefined-alias"
    coverage: "covered"
    notes: "Error by default; the formatter treats an alias as a plain token."
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "high"
    gap: ""
  - id: "anchors.forbid-duplicated-anchors"
    name: "forbid-duplicated-anchors"
    default: "false"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "anchors.forbid-unused-anchors"
    name: "forbid-unused-anchors"
    default: "false"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p2"
    batch: "B3 yaml-optin-lint"
    usage: "medium"
  - id: "braces"
    name: "braces"
    default: "on (error)"
    kind: "format-option"
    sudsy: "option: yaml.format.bracket_spacing"
    coverage: "covered"
    notes: "Option `bracket_spacing` (default true, `{ a: 1 }`); false gives its default `{a: 1}`. Empty `{}` is fixed."
    priority: "p1"
    usage: "high"
  - id: "braces.forbid"
    name: "forbid"
    default: "false"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Forbid flow mappings (true) or only non-empty ones. Style rule `no-flow-mappings`; no autofix (conversion to block is a larger rewrite)."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "braces.min-spaces-inside / max-spaces-inside"
    name: "min-/max-spaces-inside"
    default: "0 / 0"
    kind: "format-option"
    sudsy: "option: yaml.format.bracket_spacing"
    coverage: "covered"
    notes: "`bracket_spacing` covers 0 and 1 spaces; other ranges are not supported (the formatter never preserves spacing)."
    priority: "p1"
    usage: "high"
  - id: "braces.min-spaces-inside-empty / max-spaces-inside-empty"
    name: "min-/max-spaces-inside-empty"
    default: "-1 / -1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "`{}` always."
  - id: "brackets"
    name: "brackets"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "`[1, 2]` with no inner spaces equals yamllint default (0). Users wanting `[ 1, 2 ]` have no option (see braces; Biome calls it delimiterSpacing)."
  - id: "brackets.forbid"
    name: "forbid"
    default: "false"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Same rule as braces.forbid (`no-flow-sequences`)."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "brackets.min-spaces-inside / max-spaces-inside"
    name: "min-/max-spaces-inside"
    default: "0 / 0"
    kind: "format-option"
    sudsy: "option: yaml.format.array_bracket_spacing"
    coverage: "covered"
    notes: "Option `array_bracket_spacing` (default false) gives 0 or 1 spaces."
    priority: "p3"
    usage: "low"
  - id: "brackets.min-spaces-inside-empty / max-spaces-inside-empty"
    name: "min-/max-spaces-inside-empty"
    default: "-1 / -1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "`[]` always."
  - id: "colons"
    name: "colons"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: `b : 2` -> `b: 2`, `a:   1` -> `a: 1`. Aligned values (max-spaces-after > 1) cannot be preserved; wontfix by design."
  - id: "colons.max-spaces-before"
    name: "max-spaces-before"
    default: "0"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "colons.max-spaces-after"
    name: "max-spaces-after"
    default: "1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "commas"
    name: "commas"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Flow collections only; verified `[ 1,2 ,3 ]` -> `[1, 2, 3]`."
  - id: "commas.max-spaces-before / min-spaces-after / max-spaces-after"
    name: "commas options"
    default: "0 / 1 / 1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "comments"
    name: "comments"
    default: "on (warning)"
    kind: "format-option"
    sudsy: "option: yaml.format.comment_spacing"
    coverage: "covered"
    notes: "Options `comment_spacing` (spaces before an inline comment, default 1) and `space_after_comment_marker` (default off); preset `yaml/yamllint` sets 2 and on, which satisfies the three `comments` options at their defaults. Verified: with both set, `a: 1 #c` -> `a: 1  # c`."
  - id: "comments.require-starting-space"
    name: "require-starting-space"
    default: "true"
    kind: "format-option"
    sudsy: "option: yaml.format.space_after_comment_marker"
    coverage: "covered"
    notes: "`#text` -> `# text`; runs of `#` (`###`) and a bare `#` stay."
  - id: "comments.ignore-shebangs"
    name: "ignore-shebangs"
    default: "true"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "A `#!` comment on the first line is left alone; elsewhere it gets the space like any other."
  - id: "comments.min-spaces-from-content"
    name: "min-spaces-from-content"
    default: "2"
    kind: "format-option"
    sudsy: "option: yaml.format.comment_spacing"
    coverage: "covered"
    notes: "Default 1 (upstream 2); the formatter writes exactly this many spaces, so setting 2 satisfies min-spaces-from-content: 2."
  - id: "comments-indentation"
    name: "comments-indentation"
    default: "on (warning)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified one case: an over-indented comment before a key moves to the key's column. Other shapes unverified."
  - id: "document-end"
    name: "document-end"
    default: "off"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "`present: true` needs a formatter option `document_end` (mirror of `document_start`); `present: false` removes `...`."
    gap: "no `...` marker handling beyond preservation"
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "document-end.present"
    name: "present"
    default: "true"
    kind: "format-option"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "document-start"
    name: "document-start"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: document-start"
    coverage: "covered"
    notes: "Rule `document-start` (off by default, safe fix) plus format option `document_start: always|never|preserve`. yamllint enables it by default at warning; Sudsy keeps it off so zero-config adds no noise (docs/rules/builtin.md)."
  - id: "document-start.present"
    name: "present"
    default: "true"
    kind: "format-option"
    sudsy: "option: yaml.format.document_start"
    coverage: "covered"
    notes: "`present: false` == `document_start: never` (formatter, not a diagnostic)."
  - id: "empty-lines"
    name: "empty-lines"
    default: "on (error)"
    kind: "format-option"
    sudsy: "option: yaml.format.max_blank_lines"
    coverage: "covered"
    notes: "Verified: blank lines at start/end removed, runs collapsed. Default 1 vs yamllint 2 (formatter output always satisfies yamllint)."
  - id: "empty-lines.max"
    name: "max"
    default: "2"
    kind: "format-option"
    sudsy: "option: yaml.format.max_blank_lines"
    coverage: "covered"
    notes: ""
  - id: "empty-lines.max-start"
    name: "max-start"
    default: "0"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Leading blank lines always removed (verified)."
  - id: "empty-lines.max-end"
    name: "max-end"
    default: "0"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "empty-values"
    name: "empty-values"
    default: "off"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Rule `no-empty-values`; `key:` with null value. Style, off by default."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "medium"
  - id: "empty-values.forbid-in-block-mappings / flow-mappings / block-sequences"
    name: "forbid-in-*"
    default: "true / true / true"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Three booleans -> options of one rule."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "medium"
  - id: "float-values"
    name: "float-values"
    default: "off"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "float-values.forbid-inf / forbid-nan / forbid-scientific-notation / require-numeral-before-decimal"
    name: "float options"
    default: "false x4"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "hyphens"
    name: "hyphens"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified `-   2` -> `- 2`."
  - id: "hyphens.max-spaces-after"
    name: "max-spaces-after"
    default: "1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "indentation"
    name: "indentation"
    default: "on (error)"
    kind: "format-option"
    sudsy: "option: yaml.format.indent_size"
    coverage: "partial"
    notes: "Formatter output satisfies `spaces: 2` and `indent-sequences: true|false` when `sequence_indent` is `indented|flush`. Multi-line scalars: continuation lines re-indented (check-multi-line-strings true behavior)."
    gap: "`spaces: consistent` (detect the file's width) and `indent-sequences: consistent` have no equivalent; Sudsy always re-indents to indent_size and keeps each sequence as written under `preserve`"
    priority: "p1"
    batch: "B2 shared-format-options"
    usage: "high"
  - id: "indentation.spaces"
    name: "spaces"
    default: "consistent"
    kind: "format-option"
    sudsy: "option: yaml.format.indent_size"
    coverage: "covered"
    notes: "Fixed number only; Sudsy never infers width from the file."
  - id: "indentation.indent-sequences"
    name: "indent-sequences"
    default: "true"
    kind: "format-option"
    sudsy: "option: yaml.format.sequence_indent"
    coverage: "partial"
    notes: "true=indented, false=flush, whatever=preserve."
    gap: "`consistent` (all sequences like the first) and `whatever` map only loosely to `preserve`"
    priority: "p3"
    batch: "B1 yaml-defaults"
    usage: "low"
  - id: "indentation.check-multi-line-strings"
    name: "check-multi-line-strings"
    default: "false"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Continuation lines of multi-line plain/quoted scalars and block scalars are always re-indented."
  - id: "key-duplicates"
    name: "key-duplicates"
    default: "on (error)"
    kind: "lint"
    sudsy: "rule: no-duplicate-keys"
    coverage: "covered"
    notes: "Scalars compared after unquoting, `<<` skipped (yaml). Not checked: keys equal only after tag/anchor resolution, complex keys."
  - id: "key-duplicates.forbid-duplicated-merge-keys"
    name: "forbid-duplicated-merge-keys"
    default: "false"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Sudsy skips `<<` entirely. Proposal: option `merge_keys: allow|forbid` on no-duplicate-keys."
    priority: "p2"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "key-ordering"
    name: "key-ordering"
    default: "off"
    kind: "lint"
    sudsy: "rule: sorted-keys"
    coverage: "partial"
    notes: "Sudsy fix is unsafe (anchor order); yamllint has no fix. Reports every key below a greater one, at that key, like yamllint (verified by `scripts/parity.sh yamllint` on ASCII keys); yamllint's comparison of non-ASCII and mixed-case keys is unverified."
    gap: "no `ignored-keys` and no ordering variants; Sudsy compares ordinal (code point), block mappings only"
    priority: "p2"
    batch: "B4 sorted-keys-options"
    usage: "medium"
  - id: "key-ordering.ignored-keys"
    name: "ignored-keys"
    default: "[]"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "List of regexes; keys matching are skipped. Proposal: option `ignored_keys` shared with JSON sorted-keys."
    priority: "p2"
    batch: "B4 sorted-keys-options"
    usage: "medium"
  - id: "line-length"
    name: "line-length"
    default: "on (error, max 80)"
    kind: "lint"
    sudsy: "rule: max-line-length"
    coverage: "partial"
    notes: "Counting is by characters in both. The YAML formatter does not re-wrap long scalars or comments (known gap, roadmap), so format + lint cannot satisfy line-length on long prose. Preset `yaml/yamllint` sets max 80 at error."
    gap: "Sudsy rule is off by default with max 120; `allow-non-breakable-inline-mappings` is missing"
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "high"
  - id: "line-length.max"
    name: "max"
    default: "80"
    kind: "lint"
    sudsy: "rule: max-line-length"
    coverage: "covered"
    notes: "option `max` (default 120); yaml/prettier-compat uses line_width 80 for the formatter only."
  - id: "line-length.allow-non-breakable-words"
    name: "allow-non-breakable-words"
    default: "true"
    kind: "lint"
    sudsy: "rule: max-line-length"
    coverage: "covered"
    notes: "Option `allow_non_breakable_words` (default true) of the shared rule: no space after the indentation, a leading `#` run or `- `. Verified by `scripts/parity.sh yamllint`."
  - id: "line-length.allow-non-breakable-inline-mappings"
    name: "allow-non-breakable-inline-mappings"
    default: "false"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "`key: url` where the value is unbreakable."
    priority: "p3"
    batch: "B1 yaml-defaults"
    usage: "low"
  - id: "new-line-at-end-of-file"
    name: "new-line-at-end-of-file"
    default: "on (error)"
    kind: "format-option"
    sudsy: "option: yaml.format.final_newline"
    coverage: "covered"
    notes: "Formatter adds it (verified); there is no lint diagnostic, only `format --check`."
  - id: "new-lines"
    name: "new-lines"
    default: "on (error, type unix)"
    kind: "format-option"
    sudsy: "option: yaml.format.end_of_line"
    coverage: "covered"
    notes: "Option `end_of_line`; `.editorconfig` `end_of_line` is mapped."
    priority: "p1"
    usage: "high"
  - id: "new-lines.type"
    name: "type"
    default: "unix"
    kind: "format-option"
    sudsy: "option: yaml.format.end_of_line"
    coverage: "covered"
    notes: "`unix` is `lf`, `dos` is `crlf`; `platform` is not supported on purpose (output must not depend on the machine)."
    priority: "p1"
    usage: "high"
  - id: "octal-values"
    name: "octal-values"
    default: "off"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "`0755` (implicit; YAML 1.1 octal, YAML 1.2 decimal) and `0o755` (explicit). Fits next to ambiguous-booleans."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "octal-values.forbid-implicit-octal / forbid-explicit-octal"
    name: "forbid-*-octal"
    default: "true / true"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "quoted-strings"
    name: "quoted-strings"
    default: "off"
    kind: "format-option"
    sudsy: "option: yaml.format.quote_style"
    coverage: "partial"
    notes: "yamllint is lint-only; Sudsy expresses quote-type single/double/any through quote_style (single|double|prefer_double|preserve), `consistent` has no equivalent. Proposal: formatter option `quote_required: preserve|only_when_needed` (safe: the data-model check guards it) plus a lint rule `quoted-strings` for the `extra-required`/`extra-allowed` regex options."
    gap: "`required: only-when-needed` (strip needless quotes) and `required: true` (quote every string) are not possible: the formatter never adds or removes quotes"
    priority: "p2"
    batch: "B3 yaml-optin-lint"
    usage: "high"
  - id: "quoted-strings.quote-type"
    name: "quote-type"
    default: "any"
    kind: "format-option"
    sudsy: "option: yaml.format.quote_style"
    coverage: "partial"
    notes: "any=preserve, single=single, double=double."
    gap: "no `consistent` mode"
    priority: "p2"
    batch: "B3 yaml-optin-lint"
    usage: "medium"
  - id: "quoted-strings.required"
    name: "required"
    default: "true"
    kind: "format-option"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p2"
    batch: "B3 yaml-optin-lint"
    usage: "high"
  - id: "quoted-strings.extra-required / extra-allowed"
    name: "extra-required / extra-allowed"
    default: "[] / []"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "quoted-strings.allow-quoted-quotes"
    name: "allow-quoted-quotes"
    default: "false"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "quote_style never flips quotes when the other style needs more escapes."
  - id: "quoted-strings.check-keys"
    name: "check-keys"
    default: "false"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: "Unverified."
    gap: "unverified whether quote_style rewrites quoted keys"
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "trailing-spaces"
    name: "trailing-spaces"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified."
  - id: "truthy"
    name: "truthy"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: ambiguous-booleans"
    coverage: "covered"
    notes: "Options `check_keys` (default true) and `allowed` (spellings not reported); flags yes/no/on/off in three casings and True/TRUE/False/FALSE, lowercase `true`/`false` never. Off by default (GitHub workflow `on:` is a key: use `check_keys: false`); preset `yaml/yamllint` turns it on at warn. Has an unsafe quote fix, yamllint has none. Verified by `scripts/parity.sh yamllint`."
  - id: "truthy.allowed-values"
    name: "allowed-values"
    default: "['true', 'false']"
    kind: "lint"
    sudsy: "rule: ambiguous-booleans"
    coverage: "partial"
    notes: "Option `allowed`: spellings that are not reported."
    priority: "p1"
    usage: "high"
    gap: "`true` and `false` are never reported, so yamllint's `allowed-values: []` (flag them too) has no equivalent"
  - id: "truthy.check-keys"
    name: "check-keys"
    default: "true"
    kind: "lint"
    sudsy: "rule: ambiguous-booleans"
    coverage: "covered"
    notes: "Option `check_keys` (default true)."
  - id: "syntax-error"
    name: "(syntax errors)"
    default: "on (error)"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "Reported as error diagnostics; a file with errors gets no other rules."
  - id: "disable-directives"
    name: "# yamllint disable / disable-line / disable-file"
    default: "n/a"
    kind: "lint"
    sudsy: "config: suppression comments (sudsy-disable-next-line)"
    coverage: "partial"
    notes: "Config-level `overrides` with \"off\" cover file/glob scope."
    gap: "Sudsy has next-line suppression only (and sudsy-ignore for formatting); no block or file disable"
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
