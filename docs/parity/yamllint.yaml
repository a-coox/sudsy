tool: "yamllint"
version: "1.38.0 (released 2026-01-13)"
languages: ["yaml"]
sources:
  - "https://pypi.org/project/yamllint/"
  - "https://yamllint.readthedocs.io/en/stable/rules.html"
  - "https://github.com/adrienverge/yamllint/blob/master/yamllint/conf/default.yaml"
entries:
  anchors: rule no-undefined-alias
  anchors.forbid-undeclared-aliases: rule no-undefined-alias
  anchors.forbid-duplicated-anchors: rule no-duplicate-anchors
  anchors.forbid-unused-anchors: rule no-unused-anchors
  braces: option yaml.format.bracket_spacing
  braces.forbid: rule no-flow-mappings
  braces.min-spaces-inside / max-spaces-inside: option yaml.format.bracket_spacing
  braces.min-spaces-inside-empty / max-spaces-inside-empty: formatter
  brackets: formatter
  brackets.forbid: rule no-flow-sequences
  brackets.min-spaces-inside / max-spaces-inside: option yaml.format.array_bracket_spacing
  brackets.min-spaces-inside-empty / max-spaces-inside-empty: formatter
  colons: formatter
  colons.max-spaces-before: formatter
  colons.max-spaces-after: formatter
  commas: formatter
  commas.max-spaces-before / min-spaces-after / max-spaces-after: formatter
  comments: option yaml.format.comment_spacing
  comments.require-starting-space: rule comment-space
  comments.ignore-shebangs: formatter
  comments.min-spaces-from-content: option yaml.format.comment_spacing
  comments-indentation: formatter
  document-end: rule document-end
  document-end.present: option yaml.format.document_end
  document-start: rule document-start
  document-start.present: option yaml.format.document_start
  empty-lines: option yaml.format.max_blank_lines
  empty-lines.max: option yaml.format.max_blank_lines
  empty-lines.max-start: formatter
  empty-lines.max-end: formatter
  empty-values: rule no-empty-values
  empty-values.forbid-in-block-mappings / flow-mappings / block-sequences: rule no-empty-values
  float-values: rule float-style
  float-values.forbid-inf / forbid-nan / forbid-scientific-notation / require-numeral-before-decimal: rule float-style
  hyphens: formatter
  hyphens.max-spaces-after: formatter
  "indentation": "option yaml.format.indent_size | `spaces: consistent` (detect the file's width) and `indent-sequences: consistent` have no equivalent: the formatter re-indents to the configured `indent_size`, which is a deliberate choice (output must not depend on the input's accidental width); `sequence_indent: preserve` keeps each sequence as written"
  indentation.spaces: option yaml.format.indent_size
  indentation.indent-sequences: option yaml.format.sequence_indent | `consistent` (all sequences like the first) and `whatever` map only loosely to `preserve`
  indentation.check-multi-line-strings: formatter
  key-duplicates: rule no-duplicate-keys
  key-duplicates.forbid-duplicated-merge-keys: rule no-duplicate-keys
  "key-ordering": "rule sorted-keys | no locale collation: yamllint's global `locale` uses the C library's collation; Sudsy offers `compare: ordinal | case_insensitive | natural` instead"
  key-ordering.ignored-keys: rule sorted-keys
  line-length: rule max-line-length
  line-length.max: rule max-line-length
  line-length.allow-non-breakable-words: rule max-line-length
  line-length.allow-non-breakable-inline-mappings: rule max-line-length
  new-line-at-end-of-file: option yaml.format.final_newline
  new-lines: option yaml.format.end_of_line
  new-lines.type: option yaml.format.end_of_line
  octal-values: rule no-octal-values
  octal-values.forbid-implicit-octal / forbid-explicit-octal: rule no-octal-values
  quoted-strings: rule quoted-strings
  quoted-strings.quote-type: rule quoted-strings
  quoted-strings.required: rule quoted-strings
  quoted-strings.extra-required / extra-allowed: rule quoted-strings
  quoted-strings.allow-quoted-quotes: rule quoted-strings
  quoted-strings.check-keys: rule quoted-strings
  trailing-spaces: formatter
  truthy: rule ambiguous-booleans
  truthy.allowed-values: rule ambiguous-booleans
  truthy.check-keys: rule ambiguous-booleans
  syntax-error: rule syntax-error
  disable-directives: config suppression comments (sudsy-disable, sudsy-enable, sudsy-disable-line, sudsy-disable-next-line, sudsy-disable-file)
