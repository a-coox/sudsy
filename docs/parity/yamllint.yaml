tool: "yamllint"
version: "1.38.0 (released 2026-01-13)"
languages: ["yaml"]
sources:
  - "https://pypi.org/project/yamllint/"
  - "https://yamllint.readthedocs.io/en/stable/rules.html"
  - "https://github.com/adrienverge/yamllint/blob/master/yamllint/conf/default.yaml"
default_config: "default.yaml per fetched summary: error = anchors braces brackets colons commas empty-lines hyphens indentation key-duplicates line-length new-line-at-end-of-file new-lines trailing-spaces; warning = comments comments-indentation document-start truthy; disabled = document-end empty-values float-values key-ordering octal-values quoted-strings. Summarised by a fetch tool, not read verbatim"
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "anchors"
    name: "anchors"
    default: "on (error)"
    kind: "lint"
    sudsy: "rule: no-undefined-alias"
    coverage: "covered"
    notes: "`no-undefined-alias` (error), `no-duplicate-anchors` and `no-unused-anchors` (off). Anchors do not cross document markers; an alias counts for the latest anchor of its name above it. The unused-anchor fix removes the anchor."
    gap: ""
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "medium"
  - id: "anchors.forbid-undeclared-aliases"
    name: "forbid-undeclared-aliases"
    default: "true"
    kind: "lint"
    sudsy: "rule: no-undefined-alias"
    coverage: "covered"
    notes: "Error by default; the formatter treats an alias as a plain token."
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "high"
    gap: ""
  - id: "anchors.forbid-duplicated-anchors"
    name: "forbid-duplicated-anchors"
    default: "false"
    kind: "lint"
    sudsy: "rule: no-duplicate-anchors"
    coverage: "covered"
    notes: ""
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "anchors.forbid-unused-anchors"
    name: "forbid-unused-anchors"
    default: "false"
    kind: "lint"
    sudsy: "rule: no-unused-anchors"
    coverage: "covered"
    notes: ""
    priority: "p2"
    batch: "B3 yaml-optin-lint"
    usage: "medium"
  - id: "braces"
    name: "braces"
    default: "on (error)"
    kind: "format-option"
    sudsy: "option: yaml.format.bracket_spacing"
    coverage: "covered"
    notes: "Option `bracket_spacing` (default true, `{ a: 1 }`); false gives its default `{a: 1}`. Empty `{}` is fixed."
    priority: "p1"
    usage: "high"
  - id: "braces.forbid"
    name: "forbid"
    default: "false"
    kind: "lint"
    sudsy: "rule: no-flow-mappings"
    coverage: "covered"
    notes: "Rule `no-flow-mappings` (off by default, like yamllint), reported at the `{`. `forbid: true` is the rule; `forbid: non-empty` is the rule with `allow_empty: true`. No autofix. Verified by `scripts/parity.sh yamllint`."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "braces.min-spaces-inside / max-spaces-inside"
    name: "min-/max-spaces-inside"
    default: "0 / 0"
    kind: "format-option"
    sudsy: "option: yaml.format.bracket_spacing"
    coverage: "covered"
    notes: "`bracket_spacing` covers 0 and 1 spaces; other ranges are not supported (the formatter never preserves spacing)."
    priority: "p1"
    usage: "high"
  - id: "braces.min-spaces-inside-empty / max-spaces-inside-empty"
    name: "min-/max-spaces-inside-empty"
    default: "-1 / -1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "`{}` always."
  - id: "brackets"
    name: "brackets"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "`[1, 2]` with no inner spaces equals yamllint default (0). Users wanting `[ 1, 2 ]` have no option (see braces; Biome calls it delimiterSpacing)."
  - id: "brackets.forbid"
    name: "forbid"
    default: "false"
    kind: "lint"
    sudsy: "rule: no-flow-sequences"
    coverage: "covered"
    notes: "Rule `no-flow-sequences`, same options as `no-flow-mappings`. Verified by `scripts/parity.sh yamllint`."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "brackets.min-spaces-inside / max-spaces-inside"
    name: "min-/max-spaces-inside"
    default: "0 / 0"
    kind: "format-option"
    sudsy: "option: yaml.format.array_bracket_spacing"
    coverage: "covered"
    notes: "Option `array_bracket_spacing` (default false) gives 0 or 1 spaces."
    priority: "p3"
    usage: "low"
  - id: "brackets.min-spaces-inside-empty / max-spaces-inside-empty"
    name: "min-/max-spaces-inside-empty"
    default: "-1 / -1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "`[]` always."
  - id: "colons"
    name: "colons"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: `b : 2` -> `b: 2`, `a:   1` -> `a: 1`. Aligned values (max-spaces-after > 1) cannot be preserved; wontfix by design."
  - id: "colons.max-spaces-before"
    name: "max-spaces-before"
    default: "0"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "colons.max-spaces-after"
    name: "max-spaces-after"
    default: "1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "commas"
    name: "commas"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Flow collections only; verified `[ 1,2 ,3 ]` -> `[1, 2, 3]`."
  - id: "commas.max-spaces-before / min-spaces-after / max-spaces-after"
    name: "commas options"
    default: "0 / 1 / 1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "comments"
    name: "comments"
    default: "on (warning)"
    kind: "format-option"
    sudsy: "option: yaml.format.comment_spacing"
    coverage: "covered"
    notes: "Options `comment_spacing` (spaces before an inline comment, default 1) sets the gap; preset `yaml/yamllint` sets 2 and turns on the `comment-space` rule, which together cover the three `comments` options at their defaults."
  - id: "comments.require-starting-space"
    name: "require-starting-space"
    default: "true"
    kind: "format-option"
    sudsy: "rule: comment-space"
    coverage: "covered"
    notes: "Lint rule with a safe fix: `#text` -> `# text`; runs of `#` (`###`) and a bare `#` stay."
  - id: "comments.ignore-shebangs"
    name: "ignore-shebangs"
    default: "true"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "A `#!` comment on the first line is left alone; elsewhere it gets the space like any other."
  - id: "comments.min-spaces-from-content"
    name: "min-spaces-from-content"
    default: "2"
    kind: "format-option"
    sudsy: "option: yaml.format.comment_spacing"
    coverage: "covered"
    notes: "Default 1 (upstream 2); the formatter writes exactly this many spaces, so setting 2 satisfies min-spaces-from-content: 2."
  - id: "comments-indentation"
    name: "comments-indentation"
    default: "on (warning)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified one case: an over-indented comment before a key moves to the key's column. Other shapes unverified."
  - id: "document-end"
    name: "document-end"
    default: "off"
    kind: "lint"
    sudsy: "rule: document-end"
    coverage: "covered"
    notes: "Rule `document-end` (off by default) with option `present` (default true: `...` required after every document, safe fix adds it; false: reports it). The formatter option `document_end` (`preserve`, `always`, `never`) writes the marker. Verified by `scripts/parity.sh yamllint`."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "document-end.present"
    name: "present"
    default: "true"
    kind: "format-option"
    sudsy: "option: yaml.format.document_end"
    coverage: "covered"
    notes: "`present: true` is `document_end: always`, `false` is `never` (kept before a document with a directive)."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "document-start"
    name: "document-start"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: document-start"
    coverage: "covered"
    notes: "Rule `document-start` (off by default, safe fix) plus format option `document_start: always|never|preserve`. yamllint enables it by default at warning; Sudsy keeps it off so zero-config adds no noise (docs/rules/builtin.md)."
  - id: "document-start.present"
    name: "present"
    default: "true"
    kind: "format-option"
    sudsy: "option: yaml.format.document_start"
    coverage: "covered"
    notes: "`present: false` == `document_start: never` (formatter, not a diagnostic)."
  - id: "empty-lines"
    name: "empty-lines"
    default: "on (error)"
    kind: "format-option"
    sudsy: "option: yaml.format.max_blank_lines"
    coverage: "covered"
    notes: "Verified: blank lines at start/end removed, runs collapsed. Default 1 vs yamllint 2 (formatter output always satisfies yamllint)."
  - id: "empty-lines.max"
    name: "max"
    default: "2"
    kind: "format-option"
    sudsy: "option: yaml.format.max_blank_lines"
    coverage: "covered"
    notes: ""
  - id: "empty-lines.max-start"
    name: "max-start"
    default: "0"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Leading blank lines always removed (verified)."
  - id: "empty-lines.max-end"
    name: "max-end"
    default: "0"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "empty-values"
    name: "empty-values"
    default: "off"
    kind: "lint"
    sudsy: "rule: no-empty-values"
    coverage: "covered"
    notes: "Rule `no-empty-values`, reported at the `:` or `-`. An anchor or tag on the missing value counts as a value."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "medium"
    gap: ""
  - id: "empty-values.forbid-in-block-mappings / flow-mappings / block-sequences"
    name: "forbid-in-*"
    default: "true / true / true"
    kind: "lint"
    sudsy: "rule: no-empty-values"
    coverage: "covered"
    notes: "Options `block_mappings`, `flow_mappings`, `block_sequences` (all true)."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "medium"
    gap: ""
  - id: "float-values"
    name: "float-values"
    default: "off"
    kind: "lint"
    sudsy: "rule: float-style"
    coverage: "covered"
    notes: "Rule `float-style`; every check is an option and off by default. Fix for a missing leading 0 only."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
    gap: ""
  - id: "float-values.forbid-inf / forbid-nan / forbid-scientific-notation / require-numeral-before-decimal"
    name: "float options"
    default: "false x4"
    kind: "lint"
    sudsy: "rule: float-style"
    coverage: "covered"
    notes: "Options `forbid_inf`, `forbid_nan`, `forbid_scientific_notation`, `require_numeral_before_decimal`."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
    gap: ""
  - id: "hyphens"
    name: "hyphens"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified `-   2` -> `- 2`."
  - id: "hyphens.max-spaces-after"
    name: "max-spaces-after"
    default: "1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "indentation"
    name: "indentation"
    default: "on (error)"
    kind: "format-option"
    sudsy: "option: yaml.format.indent_size"
    coverage: "partial"
    notes: "Formatter output satisfies `spaces: 2` and `indent-sequences: true|false` when `sequence_indent` is `indented|flush`. Multi-line scalars: continuation lines re-indented (check-multi-line-strings true behavior)."
    gap: "`spaces: consistent` (detect the file's width) and `indent-sequences: consistent` have no equivalent: the formatter re-indents to the configured `indent_size`, which is a deliberate choice (output must not depend on the input's accidental width); `sequence_indent: preserve` keeps each sequence as written"
    priority: "p1"
    batch: "B2 shared-format-options"
    usage: "high"
  - id: "indentation.spaces"
    name: "spaces"
    default: "consistent"
    kind: "format-option"
    sudsy: "option: yaml.format.indent_size"
    coverage: "covered"
    notes: "Fixed number only; Sudsy never infers width from the file."
  - id: "indentation.indent-sequences"
    name: "indent-sequences"
    default: "true"
    kind: "format-option"
    sudsy: "option: yaml.format.sequence_indent"
    coverage: "partial"
    notes: "true=indented, false=flush, whatever=preserve."
    gap: "`consistent` (all sequences like the first) and `whatever` map only loosely to `preserve`"
    priority: "p3"
    batch: "B1 yaml-defaults"
    usage: "low"
  - id: "indentation.check-multi-line-strings"
    name: "check-multi-line-strings"
    default: "false"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Continuation lines of multi-line plain/quoted scalars and block scalars are always re-indented."
  - id: "key-duplicates"
    name: "key-duplicates"
    default: "on (error)"
    kind: "lint"
    sudsy: "rule: no-duplicate-keys"
    coverage: "covered"
    notes: "Scalars compared after unquoting, `<<` skipped (yaml). Not checked: keys equal only after tag/anchor resolution, complex keys."
  - id: "key-duplicates.forbid-duplicated-merge-keys"
    name: "forbid-duplicated-merge-keys"
    default: "false"
    kind: "lint"
    sudsy: "rule: no-duplicate-keys"
    coverage: "covered"
    notes: "Option `merge_keys: allow|forbid` (default allow, which skips `<<`); `forbid` reports a second `<<` in a mapping. Verified by `scripts/parity.sh yamllint`."
  - id: "key-ordering"
    name: "key-ordering"
    default: "off"
    kind: "lint"
    sudsy: "rule: sorted-keys"
    coverage: "partial"
    notes: "Sudsy fix is unsafe (anchor order); yamllint has no fix. Option `report: misplaced` (the `yaml/yamllint` preset and `init` set it; the default `moved` reports the fewest keys that would have to move) reports every key that sorts below any earlier key of its mapping, at that key, like yamllint (verified by `scripts/parity.sh yamllint`, also in sequences of mappings). Block and flow mappings are checked. Sudsy adds `direction`, `compare` (ordinal, case_insensitive, natural), `min_keys` and `blank_line_groups`, shared with JSON; yamllint compares ordinally unless its global `locale` is set."
    gap: "no locale collation: yamllint's global `locale` uses the C library's collation; Sudsy offers `compare: ordinal | case_insensitive | natural` instead"
    priority: "p2"
    usage: "medium"
  - id: "key-ordering.ignored-keys"
    name: "ignored-keys"
    default: "[]"
    kind: "lint"
    sudsy: "rule: sorted-keys"
    coverage: "covered"
    notes: "Option `ignored_keys` (regexes, searched in the key, shared with JSON): matching keys are not compared and stay where they are when the fix sorts. Verified by `scripts/parity.sh yamllint`."
    priority: "p2"
    usage: "medium"
  - id: "line-length"
    name: "line-length"
    default: "on (error, max 80)"
    kind: "lint"
    sudsy: "rule: max-line-length"
    coverage: "covered"
    notes: "Counting is by characters in both. The YAML formatter does not re-wrap long scalars or comments (known gap, roadmap), so format + lint cannot satisfy line-length on long prose. Preset `yaml/yamllint` sets max 80 at error. The rule is off by default with max 120 (the preset and `init` set yamllint's values)."
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "high"
  - id: "line-length.max"
    name: "max"
    default: "80"
    kind: "lint"
    sudsy: "rule: max-line-length"
    coverage: "covered"
    notes: "option `max` (default 120); yaml/prettier-compat uses line_width 80 for the formatter only."
  - id: "line-length.allow-non-breakable-words"
    name: "allow-non-breakable-words"
    default: "true"
    kind: "lint"
    sudsy: "rule: max-line-length"
    coverage: "covered"
    notes: "Option `allow_non_breakable_words` (default true) of the shared rule: no space after the indentation, a leading `#` run or `- `. Verified by `scripts/parity.sh yamllint`."
  - id: "line-length.allow-non-breakable-inline-mappings"
    name: "allow-non-breakable-inline-mappings"
    default: "false"
    kind: "lint"
    sudsy: "rule: max-line-length"
    coverage: "covered"
    notes: "Option `allow_non_breakable_inline_mappings` (default false) of the shared rule, answered by the language's `inline_mapping_line` hook (YAML: a `key: value` line, after any `- `, whose value has no space). Verified by `scripts/parity.sh yamllint`."
    priority: "p3"
    batch: "B1 yaml-defaults"
    usage: "low"
  - id: "new-line-at-end-of-file"
    name: "new-line-at-end-of-file"
    default: "on (error)"
    kind: "format-option"
    sudsy: "option: yaml.format.final_newline"
    coverage: "covered"
    notes: "Formatter adds it (verified); there is no lint diagnostic, only `format --check`."
  - id: "new-lines"
    name: "new-lines"
    default: "on (error, type unix)"
    kind: "format-option"
    sudsy: "option: yaml.format.end_of_line"
    coverage: "covered"
    notes: "Option `end_of_line`; `.editorconfig` `end_of_line` is mapped."
    priority: "p1"
    usage: "high"
  - id: "new-lines.type"
    name: "type"
    default: "unix"
    kind: "format-option"
    sudsy: "option: yaml.format.end_of_line"
    coverage: "covered"
    notes: "`unix` is `lf`, `dos` is `crlf`; `platform` is not supported on purpose (output must not depend on the machine)."
    priority: "p1"
    usage: "high"
  - id: "octal-values"
    name: "octal-values"
    default: "off"
    kind: "lint"
    sudsy: "rule: no-octal-values"
    coverage: "covered"
    notes: "Rule `no-octal-values`; quoted and tagged scalars are skipped. No fix."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
    gap: ""
  - id: "octal-values.forbid-implicit-octal / forbid-explicit-octal"
    name: "forbid-*-octal"
    default: "true / true"
    kind: "lint"
    sudsy: "rule: no-octal-values"
    coverage: "covered"
    notes: "Options `implicit` and `explicit` (both true)."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
    gap: ""
  - id: "quoted-strings"
    name: "quoted-strings"
    default: "off"
    kind: "lint"
    sudsy: "rule: quoted-strings"
    coverage: "covered"
    notes: "Lint rule `quoted-strings`; the formatter option `yaml.format.quote_style` restyles quotes independently. Fixes: quoting a plain string and changing the quote type are safe, removing quotes is unsafe (YAML 1.2 readers)."
    gap: ""
    priority: "p2"
    batch: "B3 yaml-optin-lint"
    usage: "high"
  - id: "quoted-strings.quote-type"
    name: "quote-type"
    default: "any"
    kind: "lint"
    sudsy: "rule: quoted-strings"
    coverage: "covered"
    notes: "Option `quote_type` (any, single, double, consistent)."
    gap: ""
    priority: "p2"
    batch: "B3 yaml-optin-lint"
    usage: "medium"
  - id: "quoted-strings.required"
    name: "required"
    default: "true"
    kind: "lint"
    sudsy: "rule: quoted-strings"
    coverage: "covered"
    notes: "Option `required`: `always` (true), `optional` (false), `only_when_needed`."
    priority: "p2"
    batch: "B3 yaml-optin-lint"
    usage: "high"
    gap: ""
  - id: "quoted-strings.extra-required / extra-allowed"
    name: "extra-required / extra-allowed"
    default: "[] / []"
    kind: "lint"
    sudsy: "rule: quoted-strings"
    coverage: "covered"
    notes: "Options `extra_required` and `extra_allowed`; invalid regexes are config errors."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
    gap: ""
  - id: "quoted-strings.allow-quoted-quotes"
    name: "allow-quoted-quotes"
    default: "false"
    kind: "lint"
    sudsy: "rule: quoted-strings"
    coverage: "covered"
    notes: "Option `allow_quoted_quotes`."
    gap: ""
  - id: "quoted-strings.check-keys"
    name: "check-keys"
    default: "false"
    kind: "lint"
    sudsy: "rule: quoted-strings"
    coverage: "covered"
    notes: "Option `check_keys`."
    gap: ""
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "trailing-spaces"
    name: "trailing-spaces"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified."
  - id: "truthy"
    name: "truthy"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: ambiguous-booleans"
    coverage: "covered"
    notes: "Options `check_keys` (default true) and `allowed` (spellings not reported); flags yes/no/on/off in three casings and True/TRUE/False/FALSE, lowercase `true`/`false` never. Off by default (GitHub workflow `on:` is a key: use `check_keys: false`); preset `yaml/yamllint` turns it on at warn. Has an unsafe quote fix, yamllint has none. Verified by `scripts/parity.sh yamllint`."
  - id: "truthy.allowed-values"
    name: "allowed-values"
    default: "['true', 'false']"
    kind: "lint"
    sudsy: "rule: ambiguous-booleans"
    coverage: "covered"
    notes: "Option `allowed` (spellings not reported) and `report_true_false` (default false: `true` and `false` are also checked, unless listed in `allowed`); `allowed-values: []` is `report_true_false: true`. `init` sets both."
    priority: "p1"
    usage: "high"
  - id: "truthy.check-keys"
    name: "check-keys"
    default: "true"
    kind: "lint"
    sudsy: "rule: ambiguous-booleans"
    coverage: "covered"
    notes: "Option `check_keys` (default true)."
  - id: "syntax-error"
    name: "(syntax errors)"
    default: "on (error)"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "Reported as error diagnostics; a file with errors gets no other rules."
  - id: "disable-directives"
    name: "# yamllint disable / disable-line / disable-file"
    default: "n/a"
    kind: "lint"
    sudsy: "config: suppression comments (sudsy-disable, sudsy-enable, sudsy-disable-line, sudsy-disable-next-line, sudsy-disable-file)"
    coverage: "covered"
    notes: "`# yamllint disable` / `enable` map to `# sudsy-disable` / `# sudsy-enable`, `disable-line` to `sudsy-disable-line` (plus `sudsy-disable-next-line`), `disable-file` to `sudsy-disable-file`; each takes a rule list. Config-level `overrides` with \"off\" cover glob scope."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
