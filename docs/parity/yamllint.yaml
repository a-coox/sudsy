tool: "yamllint"
version: "1.38.0 (released 2026-01-13)"
languages: ["yaml"]
sources:
  - "https://pypi.org/project/yamllint/"
  - "https://yamllint.readthedocs.io/en/stable/rules.html"
  - "https://github.com/adrienverge/yamllint/blob/master/yamllint/conf/default.yaml"
default_config: "default.yaml per fetched summary: error = anchors braces brackets colons commas empty-lines hyphens indentation key-duplicates line-length new-line-at-end-of-file new-lines trailing-spaces; warning = comments comments-indentation document-start truthy; disabled = document-end empty-values float-values key-ordering octal-values quoted-strings. Summarised by a fetch tool, not read verbatim"
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "anchors"
    name: "anchors"
    default: "on (error)"
    kind: "lint"
    sudsy: "rule: no-undefined-alias"
    coverage: "partial"
    notes: "`a: *nope` is an error diagnostic (`no-undefined-alias`) and the file still formats. Proposal for the rest: `no-duplicate-anchors` and `no-unused-anchors` as yaml style rules (off by default, like yamllint)."
    gap: "duplicated and unused anchors are not checked"
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "medium"
  - id: "anchors.forbid-undeclared-aliases"
    name: "forbid-undeclared-aliases"
    default: "true"
    kind: "lint"
    sudsy: "rule: no-undefined-alias"
    coverage: "covered"
    notes: "Error by default; the formatter treats an alias as a plain token."
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "high"
    gap: ""
  - id: "anchors.forbid-duplicated-anchors"
    name: "forbid-duplicated-anchors"
    default: "false"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "anchors.forbid-unused-anchors"
    name: "forbid-unused-anchors"
    default: "false"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p2"
    batch: "B3 yaml-optin-lint"
    usage: "medium"
  - id: "braces"
    name: "braces"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: "Prettier prints `{ a: 1 }` too, so Prettier and yamllint defaults already conflict. Proposal: option `bracket_spacing` (bool) for YAML flow mappings and JSON objects; preset yaml/yamllint-compat sets false. Empty `{}` is fixed (matches min/max-spaces-inside-empty -1 and 0)."
    gap: "Sudsy prints `{ a: 1 }` (one space inside) and no option exists; yamllint default max-spaces-inside is 0, so Sudsy output violates the yamllint default for every flow mapping"
    priority: "p1"
    batch: "B2 shared-format-options"
    usage: "high"
  - id: "braces.forbid"
    name: "forbid"
    default: "false"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Forbid flow mappings (true) or only non-empty ones. Style rule `no-flow-mappings`; no autofix (conversion to block is a larger rewrite)."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "braces.min-spaces-inside / max-spaces-inside"
    name: "min-/max-spaces-inside"
    default: "0 / 0"
    kind: "format-option"
    sudsy: "planned"
    coverage: "missing"
    notes: "Covered by the `bracket_spacing` proposal for 0 and 1; arbitrary ranges are wontfix (formatter never preserves spacing)."
    priority: "p1"
    batch: "B2 shared-format-options"
    usage: "high"
  - id: "braces.min-spaces-inside-empty / max-spaces-inside-empty"
    name: "min-/max-spaces-inside-empty"
    default: "-1 / -1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "`{}` always."
  - id: "brackets"
    name: "brackets"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "`[1, 2]` with no inner spaces equals yamllint default (0). Users wanting `[ 1, 2 ]` have no option (see braces; Biome calls it delimiterSpacing)."
  - id: "brackets.forbid"
    name: "forbid"
    default: "false"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Same rule as braces.forbid (`no-flow-sequences`)."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "brackets.min-spaces-inside / max-spaces-inside"
    name: "min-/max-spaces-inside"
    default: "0 / 0"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: "Option name proposal: `array_bracket_spacing` (JSON arrays share it, Biome `delimiterSpacing`)."
    gap: "only 0 supported; `[ 1, 2 ]` not expressible"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "brackets.min-spaces-inside-empty / max-spaces-inside-empty"
    name: "min-/max-spaces-inside-empty"
    default: "-1 / -1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "`[]` always."
  - id: "colons"
    name: "colons"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: `b : 2` -> `b: 2`, `a:   1` -> `a: 1`. Aligned values (max-spaces-after > 1) cannot be preserved; wontfix by design."
  - id: "colons.max-spaces-before"
    name: "max-spaces-before"
    default: "0"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "colons.max-spaces-after"
    name: "max-spaces-after"
    default: "1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "commas"
    name: "commas"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Flow collections only; verified `[ 1,2 ,3 ]` -> `[1, 2, 3]`."
  - id: "commas.max-spaces-before / min-spaces-after / max-spaces-after"
    name: "commas options"
    default: "0 / 1 / 1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "comments"
    name: "comments"
    default: "on (warning)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: "Verified: `a: 1     # c` -> `a: 1 # c`; `#nospace` untouched. Every inline comment Sudsy writes violates the yamllint default. Proposal: option `comment_spacing` (spaces before inline `#`, default 1; preset yaml/yamllint-compat 2) and formatter normalization of `#text` -> `# text` (shebang `#!` exempt, runs of `#` exempt)."
    gap: "`#nospace` is kept; inline comments are normalized to ONE space before `#` while yamllint default requires at least 2 (min-spaces-from-content)"
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "high"
  - id: "comments.require-starting-space"
    name: "require-starting-space"
    default: "true"
    kind: "format-option"
    sudsy: "planned"
    coverage: "missing"
    notes: "yamllint exempts `#!` on line 1 (ignore-shebangs) and runs of `#` (`###`)."
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "high"
  - id: "comments.ignore-shebangs"
    name: "ignore-shebangs"
    default: "true"
    kind: "format-option"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "medium"
  - id: "comments.min-spaces-from-content"
    name: "min-spaces-from-content"
    default: "2"
    kind: "format-option"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "high"
  - id: "comments-indentation"
    name: "comments-indentation"
    default: "on (warning)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified one case: an over-indented comment before a key moves to the key's column. Other shapes unverified."
  - id: "document-end"
    name: "document-end"
    default: "off"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "`present: true` needs a formatter option `document_end` (mirror of `document_start`); `present: false` removes `...`."
    gap: "no `...` marker handling beyond preservation"
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "document-end.present"
    name: "present"
    default: "true"
    kind: "format-option"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "document-start"
    name: "document-start"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: document-start"
    coverage: "covered"
    notes: "Rule `document-start` (off by default, safe fix) plus format option `document_start: always|never|preserve`. yamllint enables it by default at warning; Sudsy keeps it off so zero-config adds no noise (docs/rules/builtin.md)."
  - id: "document-start.present"
    name: "present"
    default: "true"
    kind: "format-option"
    sudsy: "option: yaml.format.document_start"
    coverage: "covered"
    notes: "`present: false` == `document_start: never` (formatter, not a diagnostic)."
  - id: "empty-lines"
    name: "empty-lines"
    default: "on (error)"
    kind: "format-option"
    sudsy: "option: yaml.format.max_blank_lines"
    coverage: "covered"
    notes: "Verified: blank lines at start/end removed, runs collapsed. Default 1 vs yamllint 2 (formatter output always satisfies yamllint)."
  - id: "empty-lines.max"
    name: "max"
    default: "2"
    kind: "format-option"
    sudsy: "option: yaml.format.max_blank_lines"
    coverage: "covered"
    notes: ""
  - id: "empty-lines.max-start"
    name: "max-start"
    default: "0"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Leading blank lines always removed (verified)."
  - id: "empty-lines.max-end"
    name: "max-end"
    default: "0"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "empty-values"
    name: "empty-values"
    default: "off"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Rule `no-empty-values`; `key:` with null value. Style, off by default."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "medium"
  - id: "empty-values.forbid-in-block-mappings / flow-mappings / block-sequences"
    name: "forbid-in-*"
    default: "true / true / true"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Three booleans -> options of one rule."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "medium"
  - id: "float-values"
    name: "float-values"
    default: "off"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "float-values.forbid-inf / forbid-nan / forbid-scientific-notation / require-numeral-before-decimal"
    name: "float options"
    default: "false x4"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "hyphens"
    name: "hyphens"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified `-   2` -> `- 2`."
  - id: "hyphens.max-spaces-after"
    name: "max-spaces-after"
    default: "1"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: ""
  - id: "indentation"
    name: "indentation"
    default: "on (error)"
    kind: "format-option"
    sudsy: "option: yaml.format.indent_size"
    coverage: "partial"
    notes: "Formatter output satisfies `spaces: 2` and `indent-sequences: true|false` when `sequence_indent` is `indented|flush`. Multi-line scalars: continuation lines re-indented (check-multi-line-strings true behavior)."
    gap: "`spaces: consistent` (detect the file's width) and `indent-sequences: consistent` have no equivalent; Sudsy always re-indents to indent_size and keeps each sequence as written under `preserve`"
    priority: "p1"
    batch: "B2 shared-format-options"
    usage: "high"
  - id: "indentation.spaces"
    name: "spaces"
    default: "consistent"
    kind: "format-option"
    sudsy: "option: yaml.format.indent_size"
    coverage: "covered"
    notes: "Fixed number only; Sudsy never infers width from the file."
  - id: "indentation.indent-sequences"
    name: "indent-sequences"
    default: "true"
    kind: "format-option"
    sudsy: "option: yaml.format.sequence_indent"
    coverage: "partial"
    notes: "true=indented, false=flush, whatever=preserve."
    gap: "`consistent` (all sequences like the first) and `whatever` map only loosely to `preserve`"
    priority: "p3"
    batch: "B1 yaml-defaults"
    usage: "low"
  - id: "indentation.check-multi-line-strings"
    name: "check-multi-line-strings"
    default: "false"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Continuation lines of multi-line plain/quoted scalars and block scalars are always re-indented."
  - id: "key-duplicates"
    name: "key-duplicates"
    default: "on (error)"
    kind: "lint"
    sudsy: "rule: no-duplicate-keys"
    coverage: "covered"
    notes: "Scalars compared after unquoting, `<<` skipped (yaml). Not checked: keys equal only after tag/anchor resolution, complex keys."
  - id: "key-duplicates.forbid-duplicated-merge-keys"
    name: "forbid-duplicated-merge-keys"
    default: "false"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Sudsy skips `<<` entirely. Proposal: option `merge_keys: allow|forbid` on no-duplicate-keys."
    priority: "p2"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "key-ordering"
    name: "key-ordering"
    default: "off"
    kind: "lint"
    sudsy: "rule: sorted-keys"
    coverage: "partial"
    notes: "Sudsy fix is unsafe (anchor order); yamllint has no fix. yamllint's own comparison is locale/case behavior unverified. Merged proposal in summary.md (cross-tool)."
    gap: "no `ignored-keys` and no ordering variants; Sudsy compares ordinal (code point), block mappings only"
    priority: "p2"
    batch: "B4 sorted-keys-options"
    usage: "medium"
  - id: "key-ordering.ignored-keys"
    name: "ignored-keys"
    default: "[]"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "List of regexes; keys matching are skipped. Proposal: option `ignored_keys` shared with JSON sorted-keys."
    priority: "p2"
    batch: "B4 sorted-keys-options"
    usage: "medium"
  - id: "line-length"
    name: "line-length"
    default: "on (error, max 80)"
    kind: "lint"
    sudsy: "rule: max-line-length"
    coverage: "partial"
    notes: "Counting is by characters in both. The YAML formatter does not re-wrap long scalars or comments (known gap, roadmap), so format + lint cannot satisfy line-length on long prose."
    gap: "no allow-non-breakable-words (yamllint default true: a line with no spaces after the indent, e.g. a long URL, is allowed); Sudsy rule is off by default with max 120"
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "high"
  - id: "line-length.max"
    name: "max"
    default: "80"
    kind: "lint"
    sudsy: "rule: max-line-length"
    coverage: "covered"
    notes: "option `max` (default 120); yaml/prettier-compat uses line_width 80 for the formatter only."
  - id: "line-length.allow-non-breakable-words"
    name: "allow-non-breakable-words"
    default: "true"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Proposal: shared option `allow_non_breakable_words` (default true) on max-line-length: skip a line with no whitespace after leading indent (and `# ` / `- ` prefixes, as yamllint does)."
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "high"
  - id: "line-length.allow-non-breakable-inline-mappings"
    name: "allow-non-breakable-inline-mappings"
    default: "false"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "`key: url` where the value is unbreakable."
    priority: "p3"
    batch: "B1 yaml-defaults"
    usage: "low"
  - id: "new-line-at-end-of-file"
    name: "new-line-at-end-of-file"
    default: "on (error)"
    kind: "format-option"
    sudsy: "option: yaml.format.final_newline"
    coverage: "covered"
    notes: "Formatter adds it (verified); there is no lint diagnostic, only `format --check`."
  - id: "new-lines"
    name: "new-lines"
    default: "on (error, type unix)"
    kind: "format-option"
    sudsy: "planned"
    coverage: "missing"
    notes: "Shared across all languages and tools (Prettier endOfLine=lf, Biome lineEnding, CSharpier endOfLine, .editorconfig end_of_line). Proposal: shared format option `end_of_line: auto|lf|crlf` (default auto = today's behavior) and `.editorconfig` `end_of_line` mapping."
    gap: "no `end_of_line` option: line endings are preserved from the first line break of the file (verified: CRLF YAML stays CRLF)"
    priority: "p1"
    batch: "B2 shared-format-options"
    usage: "high"
  - id: "new-lines.type"
    name: "type"
    default: "unix"
    kind: "format-option"
    sudsy: "planned"
    coverage: "missing"
    notes: "unix=lf, dos=crlf, platform=OS default (platform: wontfix, output must not depend on the machine)."
    priority: "p1"
    batch: "B2 shared-format-options"
    usage: "high"
  - id: "octal-values"
    name: "octal-values"
    default: "off"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "`0755` (implicit; YAML 1.1 octal, YAML 1.2 decimal) and `0o755` (explicit). Fits next to ambiguous-booleans."
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "octal-values.forbid-implicit-octal / forbid-explicit-octal"
    name: "forbid-*-octal"
    default: "true / true"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "quoted-strings"
    name: "quoted-strings"
    default: "off"
    kind: "format-option"
    sudsy: "option: yaml.format.quote_style"
    coverage: "partial"
    notes: "yamllint is lint-only; Sudsy expresses quote-type single/double/any through quote_style (single|double|prefer_double|preserve), `consistent` has no equivalent. Proposal: formatter option `quote_required: preserve|only_when_needed` (safe: the data-model check guards it) plus a lint rule `quoted-strings` for the `extra-required`/`extra-allowed` regex options."
    gap: "`required: only-when-needed` (strip needless quotes) and `required: true` (quote every string) are not possible: the formatter never adds or removes quotes"
    priority: "p2"
    batch: "B3 yaml-optin-lint"
    usage: "high"
  - id: "quoted-strings.quote-type"
    name: "quote-type"
    default: "any"
    kind: "format-option"
    sudsy: "option: yaml.format.quote_style"
    coverage: "partial"
    notes: "any=preserve, single=single, double=double."
    gap: "no `consistent` mode"
    priority: "p2"
    batch: "B3 yaml-optin-lint"
    usage: "medium"
  - id: "quoted-strings.required"
    name: "required"
    default: "true"
    kind: "format-option"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p2"
    batch: "B3 yaml-optin-lint"
    usage: "high"
  - id: "quoted-strings.extra-required / extra-allowed"
    name: "extra-required / extra-allowed"
    default: "[] / []"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "quoted-strings.allow-quoted-quotes"
    name: "allow-quoted-quotes"
    default: "false"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "quote_style never flips quotes when the other style needs more escapes."
  - id: "quoted-strings.check-keys"
    name: "check-keys"
    default: "false"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: "Unverified."
    gap: "unverified whether quote_style rewrites quoted keys"
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
  - id: "trailing-spaces"
    name: "trailing-spaces"
    default: "on (error)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified."
  - id: "truthy"
    name: "truthy"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: ambiguous-booleans"
    coverage: "partial"
    notes: "`check-keys: true` makes GitHub workflow `on:` a violation, which is why Sudsy keeps it off. Merged proposal: keep the rule, add options `check_keys` (default true) and `allowed` (default []; [true, false] extends the rule to flag any other spelling of true/false as yamllint does)."
    gap: "Sudsy flags only plain yes/no/on/off in 3 casings (keys and values, no way to skip keys); yamllint also flags True/TRUE/False/FALSE and has allowed-values + check-keys; Sudsy rule is off by default and has a quote fix, yamllint has none"
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "high"
  - id: "truthy.allowed-values"
    name: "allowed-values"
    default: "['true', 'false']"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: ""
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "high"
  - id: "truthy.check-keys"
    name: "check-keys"
    default: "true"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Needed to allow `on:` keys in GitHub workflows without turning the rule off."
    priority: "p1"
    batch: "B1 yaml-defaults"
    usage: "high"
  - id: "syntax-error"
    name: "(syntax errors)"
    default: "on (error)"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "Reported as error diagnostics; a file with errors gets no other rules."
  - id: "disable-directives"
    name: "# yamllint disable / disable-line / disable-file"
    default: "n/a"
    kind: "lint"
    sudsy: "config: suppression comments (sudsy-disable-next-line)"
    coverage: "partial"
    notes: "Config-level `overrides` with \"off\" cover file/glob scope."
    gap: "Sudsy has next-line suppression only (and sudsy-ignore for formatting); no block or file disable"
    priority: "p3"
    batch: "B3 yaml-optin-lint"
    usage: "low"
