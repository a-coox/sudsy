tool: "tflint"
version: "0.17.0 (tflint-ruleset-terraform)"
languages: ["hcl"]
sources:
  - "https://github.com/terraform-linters/tflint-ruleset-terraform/tree/v0.17.0/docs/rules"
scope: "The rules of tflint-ruleset-terraform, which need no provider schema (the provider rulesets, such as tflint-ruleset-aws, check resource arguments against the provider and are out of scope). Sudsy sees one file at a time, so a rule that compares the declarations of a module's files is listed as deferred and the others check the file they run on."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "terraform_comment_syntax"
    name: "terraform_comment_syntax"
    default: "off"
    kind: "lint"
    sudsy: "rule: comment-syntax"
    coverage: "covered"
    notes: "A `//` comment; the fix writes `#`. Off in Sudsy unless the rule is enabled."
    priority: "p2"
    usage: "medium"
  - id: "terraform_deprecated_index"
    name: "terraform_deprecated_index"
    default: "on"
    kind: "lint"
    sudsy: "rule: deprecated-index"
    coverage: "covered"
    notes: "`a.0` is reported and fixed to `a[0]`."
    priority: "p1"
    usage: "medium"
  - id: "terraform_deprecated_interpolation"
    name: "terraform_deprecated_interpolation"
    default: "on"
    kind: "lint"
    sudsy: "rule: deprecated-interpolation"
    coverage: "covered"
    notes: "A string that is one interpolation, `\"${var.a}\"`, is reported and fixed to the expression."
    priority: "p1"
    usage: "high"
  - id: "terraform_documented_outputs"
    name: "terraform_documented_outputs"
    default: "off"
    kind: "lint"
    sudsy: "rule: documented-outputs"
    coverage: "covered"
    notes: "An `output` block with no `description`."
    priority: "p2"
    usage: "medium"
  - id: "terraform_documented_variables"
    name: "terraform_documented_variables"
    default: "off"
    kind: "lint"
    sudsy: "rule: documented-variables"
    coverage: "covered"
    notes: "A `variable` block with no `description`."
    priority: "p2"
    usage: "medium"
  - id: "terraform_empty_list_equality"
    name: "terraform_empty_list_equality"
    default: "on"
    kind: "lint"
    sudsy: "rule: empty-list-equality"
    coverage: "covered"
    notes: "`x == []` and `x != []`."
    priority: "p1"
    usage: "medium"
  - id: "terraform_map_duplicate_keys"
    name: "terraform_map_duplicate_keys"
    default: "on"
    kind: "lint"
    sudsy: "rule: no-duplicate-keys"
    coverage: "covered"
    notes: "The shared rule: a key repeated in an object, and an argument repeated in a block."
    priority: "p1"
    usage: "medium"
  - id: "terraform_naming_convention"
    name: "terraform_naming_convention"
    default: "off"
    kind: "lint"
    sudsy: "rule: naming-convention"
    coverage: "partial"
    notes: "Variables, outputs, modules, resources, data sources and locals, in `snake_case` or `mixed_snake_case`."
    gap: "One format for every kind of block (tflint sets one per kind) and no custom regular expression."
    priority: "p2"
    usage: "medium"
  - id: "terraform_required_providers"
    name: "terraform_required_providers"
    default: "on"
    kind: "lint"
    sudsy: "rule: required-providers"
    coverage: "partial"
    notes: "A `terraform` block with no `required_providers` block."
    gap: "Does not check each provider used for a `source` and a `version`, which needs the resources of the other files of the module."
    priority: "p1"
    usage: "medium"
  - id: "terraform_required_version"
    name: "terraform_required_version"
    default: "on"
    kind: "lint"
    sudsy: "rule: required-version"
    coverage: "partial"
    notes: "A `terraform` block with no `required_version`."
    gap: "A module with no `terraform` block at all is not reported (it needs the other files of the module)."
    priority: "p1"
    usage: "medium"
  - id: "terraform_typed_variables"
    name: "terraform_typed_variables"
    default: "on"
    kind: "lint"
    sudsy: "rule: typed-variables"
    coverage: "covered"
    notes: "A `variable` block with no `type`."
    priority: "p1"
    usage: "medium"
  - id: "terraform_unused_declarations"
    name: "terraform_unused_declarations"
    default: "on"
    kind: "lint"
    sudsy: "rule: unused-declarations"
    coverage: "partial"
    notes: "Variables, locals and data sources that nothing in the same file refers to."
    gap: "Reads one file: a declaration used only by another file of the module is reported."
    priority: "p1"
    usage: "medium"
deferred:
  - gap: "Needs the arguments of a call counted (`lookup` with two arguments)."
    ids: [terraform_deprecated_lookup]
  - gap: "Reads module sources and versions; not built."
    ids: [terraform_module_pinned_source, terraform_module_shallow_clone, terraform_module_version]
  - gap: "The rule is about `.tf.json` files, which are JSON."
    ids: [terraform_json_syntax]
  - gap: "Needs the other files of the module or the providers it uses."
    ids: [terraform_standard_module_structure, terraform_unused_required_providers, terraform_workspace_remote]
