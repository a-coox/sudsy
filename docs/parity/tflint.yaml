tool: "tflint"
version: "0.17.0 (tflint-ruleset-terraform)"
languages: ["hcl"]
sources:
  - "https://github.com/terraform-linters/tflint-ruleset-terraform/tree/v0.17.0/docs/rules"
scope: "The rules of tflint-ruleset-terraform, which need no provider schema (the provider rulesets, such as tflint-ruleset-aws, check resource arguments against the provider and are out of scope). Sudsy sees one file at a time, so a rule that compares the declarations of a module's files is listed as deferred and the others check the file they run on."
entries:
  terraform_comment_syntax: rule comment-syntax
  terraform_deprecated_index: rule deprecated-index
  terraform_deprecated_interpolation: rule deprecated-interpolation
  terraform_documented_outputs: rule documented-outputs
  terraform_documented_variables: rule documented-variables
  terraform_empty_list_equality: rule empty-list-equality
  terraform_map_duplicate_keys: rule no-duplicate-keys
  terraform_naming_convention: rule naming-convention | One format for every kind of block (tflint sets one per kind) and no custom regular expression.
  terraform_required_providers: rule required-providers | Does not check each provider used for a `source` and a `version`, which needs the resources of the other files of the module.
  terraform_required_version: rule required-version | A module with no `terraform` block at all is not reported (it needs the other files of the module).
  terraform_typed_variables: rule typed-variables
  "terraform_unused_declarations": "rule unused-declarations | Reads one file: a declaration used only by another file of the module is reported."
deferred:
  - gap: "Needs the arguments of a call counted (`lookup` with two arguments)."
    ids: [terraform_deprecated_lookup]
  - gap: "Reads module sources and versions; not built."
    ids: [terraform_module_pinned_source, terraform_module_shallow_clone, terraform_module_version]
  - gap: "The rule is about `.tf.json` files, which are JSON."
    ids: [terraform_json_syntax]
  - gap: "Needs the other files of the module or the providers it uses."
    ids: [terraform_standard_module_structure, terraform_unused_required_providers, terraform_workspace_remote]
