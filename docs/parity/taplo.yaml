tool: "taplo"
version: "0.10.0 (GitHub release latest; the version `scripts/parity.sh format taplo` downloads)"
languages: ["toml"]
sources:
  - "https://taplo.tamasfe.dev/configuration/formatter-options.html"
  - "https://taplo.tamasfe.dev/configuration/file.html"
  - "tests/parity/taplo (differential numbers, docs/development/parity.md)"
scope: "taplo's formatter options and the lint and configuration features around them. Differences in layout are measured by `scripts/parity.sh format taplo` on tests/fixtures/toml and the toml-test valid files; the preset `toml/taplo-compat` sets the options below to taplo's defaults."
entries:
  align_entries: deferred | No `align_entries` option.
  align_comments: option toml.format.align_comments | Comments after array items and after table headers are not aligned.
  array_trailing_comma: option toml.format.trailing_commas
  array_auto_expand: option toml.format.collapse
  array_auto_collapse: option toml.format.collapse
  compact_arrays: option toml.format.array_bracket_spacing
  compact_inline_tables: option toml.format.bracket_spacing
  inline_table_expand: formatter | Taplo also expands an array inside an inline table that would fit after a line break elsewhere in the table (see tests/parity/taplo/expected-diff.txt).
  compact_entries: deferred | No option for `key=value`.
  column_width: option toml.format.line_width
  indent_tables: deferred | No option to indent sub-tables.
  indent_entries: deferred | No option to indent entries.
  indent_string: option toml.format.indent_style | Taplo accepts any string; Sudsy only tabs or 1..16 spaces.
  trailing_newline: option toml.format.final_newline
  reorder_keys: rule sorted-keys | Taplo sorts only keys not separated by blank lines; the rule sorts the whole table.
  reorder_arrays: rule sorted-array-values | Taplo sorts only values not separated by blank lines; the rule sorts the whole array.
  reorder_inline_tables: rule sorted-keys | A lint rule, not a formatter option.
  allowed_blank_lines: option toml.format.max_blank_lines | Blank lines between a comment line and the entry below it are reduced to one whatever the option says.
  crlf: option toml.format.end_of_line
  lint.syntax: rule syntax-error
  include_exclude: config exclude globs
  rule_overrides: config overrides
  lint.schema: deferred | No JSON Schema validation of TOML documents.
