tool: "taplo"
version: "0.10.0 (GitHub release latest; the version `scripts/parity.sh format taplo` downloads)"
languages: ["toml"]
sources:
  - "https://taplo.tamasfe.dev/configuration/formatter-options.html"
  - "https://taplo.tamasfe.dev/configuration/file.html"
  - "tests/parity/taplo (differential numbers, docs/development/parity.md)"
scope: "taplo's formatter options and the lint and configuration features around them. Differences in layout are measured by `scripts/parity.sh format taplo` on tests/fixtures/toml and the toml-test valid files; the preset `toml/taplo-compat` sets the options below to taplo's defaults."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "align_entries"
    name: "align_entries"
    default: "false"
    kind: "format-option"
    sudsy: "deferred"
    coverage: "deferred"
    notes: "Taplo aligns the `=` of consecutive entries (not across headers, comments or blank lines). Off by default in both; the shared key-value shape already aligns separators for the `align` layout directive, so an option is a small step."
    gap: "No `align_entries` option."
    priority: "p2"
    usage: "medium"
  - id: "align_comments"
    name: "align_comments"
    default: "true"
    kind: "format-option"
    sudsy: "option: toml.format.align_comments"
    coverage: "partial"
    notes: "Default off in Sudsy; `toml/taplo-compat` turns it on. A run is the entries of one table with no blank line or comment line between them; the comment column is one past the widest entry of the run (entries without a comment count), and a run with an entry on several lines is not aligned. Verified against taplo 0.10.0 on the parity fixtures."
    gap: "Comments after array items and after table headers are not aligned."
    priority: "p1"
    usage: "high"
  - id: "array_trailing_comma"
    name: "array_trailing_comma"
    default: "true"
    kind: "format-option"
    sudsy: "option: toml.format.trailing_commas"
    coverage: "covered"
    notes: "Sudsy's `trailing_commas: multiline` (the default) puts a comma after the last item of a multi-line array."
    priority: "p1"
    usage: "high"
  - id: "array_auto_expand"
    name: "array_auto_expand"
    default: "true"
    kind: "format-option"
    sudsy: "option: toml.format.collapse"
    coverage: "covered"
    notes: "An array that does not fit in `line_width` is printed one item per line; `collapse: never` also expands arrays that fit."
    priority: "p1"
    usage: "high"
  - id: "array_auto_collapse"
    name: "array_auto_collapse"
    default: "true"
    kind: "format-option"
    sudsy: "option: toml.format.collapse"
    coverage: "covered"
    notes: "`collapse: always` puts every array that fits on one line, as taplo does; the Sudsy default `preserve` keeps an array expanded when the source has a line break between its brackets. `toml/taplo-compat` sets `always`."
    priority: "p1"
    usage: "high"
  - id: "compact_arrays"
    name: "compact_arrays"
    default: "true"
    kind: "format-option"
    sudsy: "option: toml.format.array_bracket_spacing"
    coverage: "covered"
    notes: "`array_bracket_spacing: false` (the default) writes `[1, 2]`."
    priority: "p1"
    usage: "medium"
  - id: "compact_inline_tables"
    name: "compact_inline_tables"
    default: "false"
    kind: "format-option"
    sudsy: "option: toml.format.bracket_spacing"
    coverage: "covered"
    notes: "`bracket_spacing: true` (the default) writes `{ a = 1 }`; `false` is taplo's compact form."
    priority: "p2"
    usage: "medium"
  - id: "inline_table_expand"
    name: "inline_table_expand"
    default: "true"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: "An inline table never breaks (TOML 1.0 forbids line breaks in it); an array inside one is broken when the line is too long, with the items indented one level from the line and the closing bracket in front of the closing brace (`] }`), like taplo."
    gap: "Taplo also expands an array inside an inline table that would fit after a line break elsewhere in the table (see tests/parity/taplo/expected-diff.txt)."
    priority: "p3"
    usage: "low"
  - id: "compact_entries"
    name: "compact_entries"
    default: "false"
    kind: "format-option"
    sudsy: "deferred"
    coverage: "deferred"
    notes: "Omit the spaces around `=`. Sudsy always writes `key = value`."
    gap: "No option for `key=value`."
    priority: "p3"
    usage: "low"
  - id: "column_width"
    name: "column_width"
    default: "80"
    kind: "format-option"
    sudsy: "option: toml.format.line_width"
    coverage: "covered"
    notes: "Sudsy range 20..1000."
    priority: "p1"
    usage: "high"
  - id: "indent_tables"
    name: "indent_tables"
    default: "false"
    kind: "format-option"
    sudsy: "deferred"
    coverage: "deferred"
    notes: "Indent sub-tables that follow their parent. Sudsy never indents a table, which is taplo's default."
    gap: "No option to indent sub-tables."
    priority: "p3"
    usage: "low"
  - id: "indent_entries"
    name: "indent_entries"
    default: "false"
    kind: "format-option"
    sudsy: "deferred"
    coverage: "deferred"
    notes: "Indent the entries under a table header. Sudsy never indents them, which is taplo's default."
    gap: "No option to indent entries."
    priority: "p2"
    usage: "low"
  - id: "indent_string"
    name: "indent_string"
    default: "two spaces"
    kind: "format-option"
    sudsy: "option: toml.format.indent_style"
    coverage: "partial"
    notes: "`indent_style` (`space` or `tab`) and `indent_size` (default 2) set the indentation of array items; the same default as taplo."
    gap: "Taplo accepts any string; Sudsy only tabs or 1..16 spaces."
    priority: "p1"
    usage: "medium"
  - id: "trailing_newline"
    name: "trailing_newline"
    default: "true"
    kind: "format-option"
    sudsy: "option: toml.format.final_newline"
    coverage: "covered"
    notes: "An empty file stays empty in Sudsy; taplo writes a newline."
    priority: "p1"
    usage: "medium"
  - id: "reorder_keys"
    name: "reorder_keys"
    default: "false"
    kind: "format-option"
    sudsy: "rule: sorted-keys"
    coverage: "partial"
    notes: "A lint rule with a fix, off by default, not a formatter option. It sorts the entries of a table or inline table; tables themselves are not reordered."
    gap: "Taplo sorts only keys not separated by blank lines; the rule sorts the whole table."
    priority: "p2"
    usage: "medium"
  - id: "reorder_arrays"
    name: "reorder_arrays"
    default: "false"
    kind: "format-option"
    sudsy: "rule: sorted-array-values"
    coverage: "partial"
    notes: "A lint rule with a fix, off by default. Arrays of strings, integers and floats are sorted."
    gap: "Taplo sorts only values not separated by blank lines; the rule sorts the whole array."
    priority: "p3"
    usage: "low"
  - id: "reorder_inline_tables"
    name: "reorder_inline_tables"
    default: "false"
    kind: "format-option"
    sudsy: "rule: sorted-keys"
    coverage: "partial"
    notes: "`sorted-keys` also sorts the keys of inline tables."
    gap: "A lint rule, not a formatter option."
    priority: "p3"
    usage: "low"
  - id: "allowed_blank_lines"
    name: "allowed_blank_lines"
    default: "2"
    kind: "format-option"
    sudsy: "option: toml.format.max_blank_lines"
    coverage: "partial"
    notes: "Sudsy default is 1; `toml/taplo-compat` sets 2."
    gap: "Blank lines between a comment line and the entry below it are reduced to one whatever the option says."
    priority: "p1"
    usage: "medium"
  - id: "crlf"
    name: "crlf"
    default: "false"
    kind: "format-option"
    sudsy: "option: toml.format.end_of_line"
    coverage: "covered"
    notes: "Sudsy default `auto` keeps the file's first line break; `lf` (set by `toml/taplo-compat`) and `crlf` fix it. Line breaks inside multi-line strings follow the option (taplo keeps them)."
    priority: "p1"
    usage: "medium"
  - id: "lint.syntax"
    name: "taplo lint (syntax)"
    default: "on"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "Syntax errors and the TOML 1.0 semantic errors (duplicate keys, redefined tables, bad dates and escapes): all 361 invalid toml-test files are rejected."
    priority: "p1"
    usage: "high"
  - id: "include_exclude"
    name: "include / exclude"
    default: "all TOML files"
    kind: "format-option"
    sudsy: "config: exclude globs"
    coverage: "covered"
    notes: "Which files are formatted: `exclude` globs and ignore files."
    priority: "p1"
    usage: "high"
  - id: "rule_overrides"
    name: "[[rule]] (per-file options)"
    default: "none"
    kind: "format-option"
    sudsy: "config: overrides"
    coverage: "covered"
    notes: "`overrides` with `files` globs and a `toml.format` mapping."
    priority: "p2"
    usage: "medium"
  - id: "lint.schema"
    name: "schema validation (`#:schema`, `[[rule]] schema`)"
    default: "on when a schema is given"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: "Taplo validates a document against a JSON Schema."
    gap: "No JSON Schema validation of TOML documents."
    priority: "p3"
    usage: "medium"
