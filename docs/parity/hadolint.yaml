tool: "hadolint"
version: "2.15.1"
languages: ["dockerfile"]
sources:
  - "https://github.com/hadolint/hadolint/releases/tag/v2.15.1"
  - "https://github.com/hadolint/hadolint#rules"
entries:
  DL1001: wontfix Sudsy has its own suppression comments; a rule against inline pragmas is not planned.
  DL3000: rule workdir-absolute
  DL3001: rule no-interactive-commands
  DL3002: rule last-user-not-root
  DL3003: rule use-workdir-not-cd
  DL3004: rule no-sudo
  DL3006: rule untagged-base-image
  DL3007: rule no-latest-tag
  DL3008: rule apt-get-pin-versions
  DL3011: rule expose-port-range
  DL3012: rule single-healthcheck
  DL3013: rule pip-pin-versions | `python -m pip install` and the wrappers (`pipx`, `pipenv`) are not told apart as hadolint does.
  DL3014: rule apt-get-yes
  DL3015: rule apt-get-no-recommends
  DL3016: rule npm-pin-versions | A package is judged by its text (`@`, `#`, tarball, path); git and scoped forms follow hadolint's cases only.
  DL3018: rule apk-pin-versions
  DL3019: rule apk-no-cache
  DL3020: rule copy-instead-of-add | Reports an ADD with no URL and no archive among its arguments; hadolint reports one source that is neither.
  DL3021: rule copy-many-needs-directory | The shell form only; the JSON form is not checked.
  DL3022: rule copy-from-unknown-stage
  DL3023: rule copy-from-own-stage
  DL3024: rule duplicate-stage-name
  DL3025: rule json-cmd-entrypoint
  DL3027: rule no-apt
  "DL3028": "rule gem-pin-versions | hadolint drops the word after every flag; Sudsy does the same (`skip-flag-args: *`), so cases it parses differently with options can differ."
  DL3029: rule no-from-platform
  DL3030: rule yum-yes
  DL3032: rule yum-clean
  DL3033: rule rpm-pin-versions | A variable in a package counts as pinned; hadolint checks that an ENV or ARG defines it.
  DL3034: rule zypper-yes
  DL3035: rule zypper-no-dist-upgrade
  DL3036: rule zypper-clean
  DL3037: rule zypper-pin-versions
  DL3038: rule dnf-yes
  DL3040: rule dnf-clean
  DL3041: rule rpm-pin-versions | A variable in a package counts as pinned; hadolint checks that an ENV or ARG defines it.
  DL3043: rule no-nested-onbuild
  DL3047: rule wget-progress
  DL3061: rule from-first
  DL3062: rule go-pin-versions | `go install` and `go get`; `go run` is not checked.
  DL3063: rule no-reserved-stage-name
  DL3064: rule no-secret-in-env | Names are matched in the text of the instruction, so a later pair of a multi-pair ENV with quoted values may be missed.
  DL3065: rule no-redundant-target-platform
  DL3066: rule numeric-user-id | A variable is accepted whether or not an ARG defines it.
  DL3067: rule no-copy-whole-stage
  DL4000: rule no-maintainer
  DL4003: rule single-cmd
  DL4004: rule single-entrypoint
  DL4005: rule no-shell-symlink
deferred:
  - gap: "Needs the stage analysis of which RUN leaves the lists in an image that is kept."
    ids: [DL3009]
  - gap: "Needs to match a COPY'd archive against the extraction in a later RUN."
    ids: [DL3010]
  - gap: "Needs a configured list of trusted registries."
    ids: [DL3026]
  - gap: "Needs PIP_NO_CACHE_DIR tracked across ENV, ARG and stages."
    ids: [DL3042]
  - gap: "Needs the variables an ENV defines compared with those it reads."
    ids: [DL3044]
  - gap: "Needs WORKDIR tracked per stage."
    ids: [DL3045]
  - gap: "Needs the length of the -u argument."
    ids: [DL3046]
  - gap: "Label rules come together with the label schema configuration."
    ids: [DL3048]
  - gap: "Needs the configured label schema."
    ids: [DL3049, DL3050, DL3051, DL3052, DL3053, DL3055, DL3056, DL3058]
  - gap: "Needs the configured label schema and the SPDX list."
    ids: [DL3054]
  - gap: "Off in hadolint by default; a file-level check that is not built."
    ids: [DL3057]
  - gap: "Needs the commands of each RUN counted."
    ids: [DL3059]
  - gap: "Needs the yarn commands of a RUN ordered."
    ids: [DL3060]
  - gap: "Needs the commands of all RUNs of a stage compared."
    ids: [DL4001]
  - gap: "Needs pipes in RUN found by a real shell parser and the SHELL option tracked."
    ids: [DL4006]
