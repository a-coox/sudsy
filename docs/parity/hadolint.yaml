tool: "hadolint"
version: "2.15.1"
languages: ["dockerfile"]
sources:
  - "https://github.com/hadolint/hadolint/releases/tag/v2.15.1"
  - "https://github.com/hadolint/hadolint#rules"
default_config: "All DL rules except the ones ignored by default (DL3057) run at their own severity; failure threshold info. The ShellCheck rules (SC) hadolint runs on RUN are out of scope until Sudsy has a shell language. DL3068 (pecl) is in the README but not in the v2.15.1 rule set."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "DL1001"
    name: "ignore-pragma"
    default: "ignore"
    kind: "lint"
    sudsy: "wontfix: Sudsy has its own suppression comments; a rule against inline pragmas is not planned."
    coverage: "wontfix"
    notes: ""
    gap: "Sudsy has its own suppression comments; a rule against inline pragmas is not planned."
    priority: "p3"
    batch: "B16 dockerfile-hadolint"
    usage: "medium"
  - id: "DL3000"
    name: "absolute-workdir"
    default: "error"
    kind: "lint"
    sudsy: "rule: workdir-absolute"
    coverage: "covered"
    notes: ""
    gap: ""
    priority: "p1"
    batch: "B16 dockerfile-hadolint"
    usage: "medium"
  - id: "DL3001"
    name: "no-interactive-commands"
    default: "info"
    kind: "lint"
    sudsy: "rule: no-interactive-commands"
    coverage: "covered"
    notes: "Command names in RUN found by a small shell reader."
    gap: ""
    priority: "p2"
    batch: "B16 dockerfile-hadolint"
    usage: "medium"
  - id: "DL3002"
    name: "last-user-root"
    default: "warning"
    kind: "lint"
    sudsy: "rule: last-user-not-root"
    coverage: "covered"
    notes: "Reported for the last USER of every stage, like hadolint."
    gap: ""
    priority: "p1"
    batch: "B16 dockerfile-hadolint"
    usage: "medium"
  - id: "DL3003"
    name: "use-workdir"
    default: "warning"
    kind: "lint"
    sudsy: "rule: use-workdir-not-cd"
    coverage: "covered"
    notes: ""
    gap: ""
    priority: "p1"
    batch: "B16 dockerfile-hadolint"
    usage: "medium"
  - id: "DL3004"
    name: "no-sudo"
    default: "error"
    kind: "lint"
    sudsy: "rule: no-sudo"
    coverage: "covered"
    notes: ""
    gap: ""
    priority: "p1"
    batch: "B16 dockerfile-hadolint"
    usage: "medium"
  - id: "DL3006"
    name: "tag-base-image"
    default: "warning"
    kind: "lint"
    sudsy: "rule: untagged-base-image"
    coverage: "covered"
    notes: ""
    gap: ""
    priority: "p1"
    batch: "B16 dockerfile-hadolint"
    usage: "medium"
  - id: "DL3007"
    name: "no-latest"
    default: "warning"
    kind: "lint"
    sudsy: "rule: no-latest-tag"
    coverage: "covered"
    notes: ""
    gap: ""
    priority: "p1"
    batch: "B16 dockerfile-hadolint"
    usage: "medium"
  - id: "DL3008"
    name: "pin-apt-get"
    default: "warning"
    kind: "lint"
    sudsy: "rule: apt-get-pin-versions"
    coverage: "covered"
    notes: ""
    gap: ""
    priority: "p1"
    batch: "B16 dockerfile-hadolint"
    usage: "medium"
  - id: "DL3009"
    name: "delete-apt-lists"
    default: "info"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: ""
    gap: "Needs the stage analysis of which RUN leaves the lists in an image that is kept."
    priority: "p2"
    batch: "B16 dockerfile-hadolint"
    usage: "medium"
  - id: "DL3010"
    name: "extract-with-add"
    default: "info"
    kind: "lint"
    sudsy: "deferred"
    coverage: "deferred"
    notes: ""
    gap: "Needs to match a COPY'd archive against the extraction in a later RUN."
    priority: "p2"
    batch: "B16 dockerfile-hadolint"
    usage: "medium"
  - id: "DL3011"
