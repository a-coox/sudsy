  - id: "csharp_space_* non-default values"
    name: "csharp_space_* (22 keys) set to a non-default value"
    default: "n/a"
    kind: "format-option"
    sudsy: "wontfix: fixed to the default value; no preset needs the other values"
    coverage: "wontfix"
    notes: "Examples: csharp_space_after_cast = true, csharp_space_between_parentheses = control_flow_statements|expressions|type_casts, csharp_space_around_binary_operators = none|ignore. `ignore`-style values (keep whatever is written) contradict a formatter that normalizes."
  - id: "csharp_preserve_single_line_statements"
    name: "csharp_preserve_single_line_statements"
    default: "true"
    kind: "format-option"
    sudsy: "option: csharp.format.preserve_single_line_statements"
    coverage: "covered"
    notes: "Mapped when the key is set (Sudsy's default splits `int x = 1; int y = 2;`, SA1107 requires that; dotnet format's default is true). Statements on one source line stay together, as do `case 1: break;` and a whole one-line `if`/`while`/`for`/`foreach`/`try`/... statement. Verified against dotnet format whitespace (tests/parity/dotnet-format/single-line*.cs)."
  - id: "csharp_preserve_single_line_blocks"
    name: "csharp_preserve_single_line_blocks"
    default: "true"
    kind: "format-option"
    sudsy: "option: csharp.format.preserve_single_line_blocks"
    coverage: "covered"
    notes: "Mapped when the key is set (Sudsy's default expands one-line blocks; dotnet format's default is true). A block written on one line stays on one line: bodies of methods, accessors, lambdas and control-flow statements (their brace on its own line, as dotnet format does), and type, namespace, enum and `switch` bodies. Empty bodies follow csharp.format.empty_braces. Verified against dotnet format whitespace (tests/parity/dotnet-format/single-line*.cs)."
    priority: "p3"
    batch: "B12 editorconfig-mapping"
    usage: "low"
  - id: "IDE0055"
    name: "Fix formatting (all csharp_*/dotnet_* options above)"
    default: "suggestion by default; error on build only if configured"
    kind: "lint"
    sudsy: "formatter"
    coverage: "partial"
    notes: "`dotnet format` and Sudsy agree on the mapped keys (scripts/parity.sh format dotnet-format; the expected differences are in tests/parity/dotnet-format/expected-diff.txt). A formatting key without an option that a section sets to a value other than the behavior Sudsy has is reported once as ignored (stderr warning, `sudsy config print`); code-style keys are the SDK's and silent."
    gap: "Sudsy formats; it does not report \"would change\" as IDE0055 diagnostics (`format --check` instead); the csharp_space_* values and `false` of the two initializer newline keys are not followed"
    priority: "p1"
    batch: "B12 editorconfig-mapping"
    usage: "high"
  - id: "IDE2000"
    name: "IDE2000 Avoid multiple blank lines (dotnet_style_allow_multiple_blank_lines_experimental)"
    default: "true"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Blank lines are collapsed to at most one (SA1507). Sudsy: csharp.format.* / formatter."
  - id: "IDE2001"
    name: "IDE2001 Embedded statements must be on their own line (csharp_style_allow_embedded_statements_on_same_line_experimental)"
    default: "true"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: `if (x) return;` -> body on its own line."
  - id: "IDE2002"
    name: "IDE2002 Consecutive braces must not have blank line between them"
    default: "true"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Blank lines before `}` are removed (SA1508 verified)."
  - id: "IDE2003"
    name: "IDE2003 Blank line required between block and subsequent statement (dotnet_style_allow_statement_immediately_after_block_experimental)"
    default: "true"
    kind: "lint"
    sudsy: "formatter"
    coverage: "partial"
    notes: "Experimental upstream."
    gap: "not enforced; same as SA1513"
    priority: "p3"
    batch: "B8 stylecop-layout-formatter"
    usage: "medium"
  - id: "IDE2004"
    name: "IDE2004 Blank line not allowed after constructor initializer colon"
    default: "true"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified indirectly: `: base(...)` lines are re-flowed."
  - id: "IDE2005"
    name: "IDE2005 Blank line not allowed after conditional expression token"
    default: "true"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: conditionals are re-flowed."
  - id: "IDE2006"
    name: "IDE2006 Blank line not allowed after arrow expression clause token"
    default: "true"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Expression bodies stay on the header line."
  - id: "IDE0161"
    name: "csharp_style_namespace_declarations"
    default: "block_scoped"
    kind: "format-option"
    sudsy: "sdk: IDE0161"
    coverage: "sdk"
    notes: "Block-scoped or file-scoped namespace declarations. Sudsy never converts between them; the formatter prints either form."
