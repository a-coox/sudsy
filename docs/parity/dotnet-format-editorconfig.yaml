tool: "dotnet-format-editorconfig"
version: ".NET SDK 10 docs (formatting options pages; IDE index page updated 2026-07)"
languages: ["csharp"]
sources:
  - "https://learn.microsoft.com/en-us/dotnet/fundamentals/code-analysis/style-rules/csharp-formatting-options"
  - "https://learn.microsoft.com/en-us/dotnet/fundamentals/code-analysis/style-rules/ide0055"
  - "https://learn.microsoft.com/en-us/dotnet/fundamentals/code-analysis/style-rules/"
  - "docs/config/editorconfig.md in this repo (what the reader maps)"
scope: "`dotnet format` whitespace / IDE0055 options from .editorconfig and IDE2000-IDE2006"
dotnet_formatting_options_page_note: "dotnet_sort_system_directives_first and dotnet_separate_import_directive_groups are the only two options in the 'dotnet_' formatting family; the page was not fetched separately (names and defaults from the IDE docs and CSharpier's fixed settings)."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "indent_style"
    name: "indent_style"
    default: "space"
    kind: "format-option"
    sudsy: "option: csharp.format.indent_style"
    coverage: "covered"
    notes: "Mapped by .editorconfig reader."
  - id: "indent_size / tab_width"
    name: "indent_size, tab_width"
    default: "4"
    kind: "format-option"
    sudsy: "option: csharp.format.indent_size"
    coverage: "covered"
    notes: "tab_width is used only when indent_style=tab without indent_size (docs/config/editorconfig.md)."
  - id: "max_line_length"
    name: "max_line_length"
    default: "none (IDE0055 ignores it)"
    kind: "format-option"
    sudsy: "option: csharp.format.line_width"
    coverage: "covered"
    notes: "Sudsy default 120; `off` is ignored."
  - id: "insert_final_newline"
    name: "insert_final_newline"
    default: "true (VS)"
    kind: "format-option"
    sudsy: "option: csharp.format.final_newline"
    coverage: "covered"
    notes: ""
  - id: "end_of_line"
    name: "end_of_line"
    default: "platform / file"
    kind: "format-option"
    sudsy: "option: csharp.format.end_of_line"
    coverage: "covered"
    notes: "`lf` and `crlf` are mapped to `end_of_line`; `cr` is ignored."
    priority: "p1"
    usage: "high"
  - id: "charset"
    name: "charset"
    default: "utf-8 (VS) / unset"
    kind: "format-option"
    sudsy: "wontfix: BOM preserved, no transcoding"
    coverage: "wontfix"
    notes: ""
  - id: "trim_trailing_whitespace"
    name: "trim_trailing_whitespace"
    default: "true"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Always trimmed."
  - id: "dotnet_sort_system_directives_first"
    name: "dotnet_sort_system_directives_first"
    default: "true"
    kind: "format-option"
    sudsy: "rule: using-order"
    coverage: "partial"
    notes: "Applies to `dotnet format` whitespace/style runs and the VS 'sort usings' command. Proposal: map the key to using-order's system_first and enable... (decide whether sorting belongs in the formatter, see CSharpier gap)."
    gap: "only a lint rule (off by default, option system_first) not formatter behavior; the editorconfig key is not read"
    priority: "p2"
    batch: "B7 stylecop-ordering"
    usage: "high"
  - id: "dotnet_separate_import_directive_groups"
    name: "dotnet_separate_import_directive_groups"
    default: "false"
    kind: "format-option"
    sudsy: "wontfix: blank lines between usings are preserved, not normalized"
    coverage: "wontfix"
    notes: "Would be needed with SA1516/SA1210 style `blankLinesBetweenUsingGroups`; revisit with the using-order extension."
  - id: "csharp_new_line_before_open_brace"
    name: "csharp_new_line_before_open_brace"
    default: "all"
    kind: "format-option"
    sudsy: "option: csharp.format.brace_newline"
    coverage: "covered"
    notes: "`all`, `none`, or a list of elements: brace_newline plus brace_same_line (the elements not listed) and wrapped_brace_line (docs/config/editorconfig.md). Verified against `dotnet format whitespace` (scripts/parity.sh format dotnet-format, cases all, none, mixed, blocks, other). dotnet format applies `methods` to local functions and `properties` to indexers and events, and leaves initializer braces where they are; Sudsy follows the first two."
    priority: "p2"
    usage: "medium"
  - id: "csharp_new_line_before_else"
    name: "csharp_new_line_before_else"
    default: "true"
    kind: "format-option"
    sudsy: "option: csharp.format.else_line"
    coverage: "covered"
    notes: "`true` is new_line, `false` same_line; clause_keyword_line sets the three together. Verified against `dotnet format whitespace`."
    priority: "p2"
    usage: "medium"
  - id: "csharp_new_line_before_catch"
    name: "csharp_new_line_before_catch"
    default: "true"
    kind: "format-option"
    sudsy: "option: csharp.format.catch_line"
    coverage: "covered"
    notes: "`true` is new_line, `false` same_line; clause_keyword_line sets the three together. Verified against `dotnet format whitespace`."
    priority: "p3"
    usage: "low"
  - id: "csharp_new_line_before_finally"
    name: "csharp_new_line_before_finally"
    default: "true"
    kind: "format-option"
    sudsy: "option: csharp.format.finally_line"
    coverage: "covered"
    notes: "`true` is new_line, `false` same_line; clause_keyword_line sets the three together. Verified against `dotnet format whitespace`."
    priority: "p3"
    usage: "low"
  - id: "csharp_new_line_before_members_in_object_initializers"
    name: "csharp_new_line_before_members_in_object_initializers"
    default: "true"
    kind: "format-option"
    sudsy: "option: csharp.format.initializer_collapse"
    coverage: "partial"
    notes: "Default behavior when an initializer does not fit is one member per line."
    gap: "IDE0055 forces one member per line; Sudsy `preserve` keeps what is written when it fits; `always` collapses (opposite of true); the key is reported as ignored when set to false"
    priority: "p3"
    batch: "B12 editorconfig-mapping"
    usage: "low"
  - id: "csharp_new_line_before_members_in_anonymous_types"
    name: "csharp_new_line_before_members_in_anonymous_types"
    default: "true"
    kind: "format-option"
    sudsy: "option: csharp.format.initializer_collapse"
    coverage: "partial"
    notes: ""
    gap: "see object initializers; `new { A = 1, B = 2 }` stays on one line when it fits (verified); the key is reported as ignored when set to false"
    priority: "p3"
    batch: "B12 editorconfig-mapping"
    usage: "low"
  - id: "csharp_new_line_between_query_expression_clauses"
    name: "csharp_new_line_between_query_expression_clauses"
    default: "true"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "partial"
    notes: "No option; `false` (all on one line) is what a fitting query gets."
    gap: "query clauses stay on one line when they fit (verified); `true` would put each clause on its own line; the key is reported as ignored when set to false"
    priority: "p3"
    batch: "B12 editorconfig-mapping"
    usage: "low"
  - id: "csharp_indent_case_contents"
    name: "csharp_indent_case_contents"
    default: "true"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Fixed true (verified: statements indented under `case`). `false` unsupported."
  - id: "csharp_indent_switch_labels"
    name: "csharp_indent_switch_labels"
    default: "true"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Fixed true. `false` (labels flush with switch) is unsupported; used by some teams."
  - id: "csharp_indent_labels"
    name: "csharp_indent_labels"
    default: "one_less_than_current"
    kind: "format-option"
    sudsy: "option: csharp.format.label_indent"
    coverage: "covered"
    notes: "`flush_left`, `one_less_than_current` (one_less), `no_change`. Sudsy defaults to no_change, the Visual Studio default is one_less_than_current. Verified against `dotnet format whitespace`."
    priority: "p3"
    usage: "low"
  - id: "csharp_indent_block_contents"
    name: "csharp_indent_block_contents"
    default: "true"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Fixed true."
  - id: "csharp_indent_braces"
    name: "csharp_indent_braces"
    default: "false"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Fixed false (no GNU/Whitesmiths braces)."
  - id: "csharp_indent_case_contents_when_block"
    name: "csharp_indent_case_contents_when_block"
    default: "true"
    kind: "format-option"
    sudsy: "option: csharp.format.indent_switch_section_block"
    coverage: "covered"
    notes: "Verified: `case 2: { break; }` indents the block by default."
  - id: "csharp_space_after_cast"
    name: "csharp_space_after_cast"
    default: "false"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Default value only (verified for the common keys by formatting mis-spaced input). Sudsy spacing is a single fixed table (spacing.rs) equal to the Visual Studio default for this key. Only the default value is reproducible."
