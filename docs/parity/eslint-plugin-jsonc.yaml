tool: "eslint-plugin-jsonc"
version: "3.4.2 (npm latest)"
languages: ["json"]
sources:
  - "https://registry.npmjs.org/eslint-plugin-jsonc/latest"
  - "https://ota-meshi.github.io/eslint-plugin-jsonc/rules/"
  - "https://registry.npmjs.org/eslint-plugin-jsonc/-/eslint-plugin-jsonc-3.4.2.tgz (dist/index.mjs: flat/recommended-with-json|jsonc|json5 rule lists read from the package)"
scope: "all 44 rules (23 JSONC rules + 21 extension rules)"
entries:
  jsonc/auto: wontfix mirrors ESLint core rules
  jsonc/key-name-casing: rule key-name-casing
  jsonc/no-bigint-literals: rule syntax-error
  jsonc/no-binary-expression: rule syntax-error
  jsonc/no-binary-numeric-literals: rule syntax-error
  jsonc/no-comments: rule syntax-error
  jsonc/no-escape-sequence-in-identifier: rule syntax-error
  jsonc/no-hexadecimal-numeric-literals: rule syntax-error
  jsonc/no-infinity: rule syntax-error
  jsonc/no-nan: rule syntax-error
  jsonc/no-number-props: rule syntax-error
  jsonc/no-numeric-separators: rule syntax-error
  jsonc/no-octal-numeric-literals: rule syntax-error
  jsonc/no-parenthesized: rule syntax-error
  jsonc/no-plus-sign: rule syntax-error
  jsonc/no-regexp-literals: rule syntax-error
  jsonc/no-template-literals: rule syntax-error
  jsonc/no-undefined-value: rule syntax-error
  jsonc/no-unicode-codepoint-escapes: rule syntax-error
  jsonc/sort-array-values: rule sorted-array-values | one ordering per rule configuration (ESLint takes a list of {pathPattern, order} entries with different orders per path; use `overrides` per file instead); no `key` (sort objects by a property), no explicit value lists or `valuePattern`, mixed or non-scalar arrays are skipped, report positions when several equally short moves exist
  "jsonc/sort-keys": "rule sorted-keys | one ordering per rule configuration (ESLint's list of entries with different orders per path: use `overrides` per file); no per-key `keyPattern` orders and no `ignore` order type (`ignored_keys` is the closest); report positions when several equally short moves exist"
  jsonc/valid-json-number: rule syntax-error
  jsonc/vue-custom-block/no-parsing-error: wontfix Vue SFC custom blocks
  "jsonc/array-bracket-newline": "option json.format.collapse | no `minItems`/`multiline` threshold: `collapse` follows source line breaks and fit, not element count"
  jsonc/array-bracket-spacing: option json.format.array_bracket_spacing
  jsonc/array-element-newline: option json.format.collapse | no `minItems` threshold (elements go one per line only when the array breaks)
  jsonc/comma-dangle: option json.format.trailing_commas
  jsonc/comma-style: formatter
  jsonc/indent: option json.format.indent_size
  jsonc/key-spacing: formatter
  jsonc/no-dupe-keys: rule no-duplicate-keys
  jsonc/no-floating-decimal: rule syntax-error
  jsonc/no-irregular-whitespace: rule syntax-error
  jsonc/no-multi-str: rule syntax-error
  jsonc/no-octal-escape: rule syntax-error
  jsonc/no-octal: rule syntax-error
  jsonc/no-sparse-arrays: rule syntax-error
  jsonc/no-useless-escape: rule syntax-error
  "jsonc/object-curly-newline": "option json.format.collapse | no `minProperties`/`multiline` threshold: `collapse` follows source line breaks and fit, not property count"
  jsonc/object-curly-spacing: option json.format.bracket_spacing
  "jsonc/object-property-newline": "option json.format.collapse | no exact equivalent for the 'forbid same-line properties' mode (that is collapse: never)"
  jsonc/quote-props: rule syntax-error
  jsonc/quotes: rule syntax-error
  jsonc/space-unary-ops: rule syntax-error
