tool: "eslint-plugin-jsonc"
version: "3.4.2 (npm latest)"
languages: ["json"]
sources:
  - "https://registry.npmjs.org/eslint-plugin-jsonc/latest"
  - "https://ota-meshi.github.io/eslint-plugin-jsonc/rules/"
  - "https://registry.npmjs.org/eslint-plugin-jsonc/-/eslint-plugin-jsonc-3.4.2.tgz (dist/index.mjs: flat/recommended-with-json|jsonc|json5 rule lists read from the package)"
scope: "all 44 rules (23 JSONC rules + 21 extension rules)"
recommended_configs: "flat/recommended-with-json, flat/recommended-with-jsonc, flat/recommended-with-json5 (lists from the package source). json5 config omits no-comments, comma-dangle, quote-props, quotes, valid-json-number, no-floating-decimal, no-hexadecimal-numeric-literals, no-infinity, no-nan, no-plus-sign, no-multi-str. 'jsonc' config omits no-comments and comma-dangle."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "jsonc/auto"
    name: "auto"
    default: "off (in no recommended config)"
    kind: "lint"
    sudsy: "wontfix: mirrors ESLint core rules"
    coverage: "wontfix"
    notes: "Applies core ESLint rules to JSON; no equivalent concept."
  - id: "jsonc/key-name-casing"
    name: "key-name-casing"
    default: "off (in no recommended config)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Options: camelCase (default true), PascalCase, SCREAMING_SNAKE_CASE, kebab-case, snake_case (default false), ignores (regex list). Proposal: rule `key-name-casing` (json, yaml), option `allowed: [camel, pascal, ...]`, `ignore: [regex]`; no autofix."
    priority: "p2"
    batch: "B4 json-optin-lint"
    usage: "medium"
  - id: "jsonc/no-bigint-literals"
    name: "no-bigint-literals"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`123n` -> invalid-number. Verified: the construct is a `syntax-error` in both dialects (json and jsonc). Differences: the message is generic (e.g. 'invalid number', 'unexpected character') and each error site yields one diagnostic; no per-construct rule id, so it cannot be turned off, and the file is neither linted further nor formatted."
  - id: "jsonc/no-binary-expression"
    name: "no-binary-expression"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`1 + 2` -> unexpected-character `+`."
  - id: "jsonc/no-binary-numeric-literals"
    name: "no-binary-numeric-literals"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`0b101` -> invalid-number."
  - id: "jsonc/no-comments"
    name: "no-comments"
    default: "error in recommended-with-json"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "dialect json: `comment-in-json` error with a hint to use jsonc; dialect jsonc allows comments (as the recommended-with-jsonc config does). Picks the dialect by file name (tsconfig.json, *.jsonc, .vscode/*.json are jsonc)."
  - id: "jsonc/no-escape-sequence-in-identifier"
    name: "no-escape-sequence-in-identifier"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "Identifiers do not exist in JSON; unquoted keys are errors."
  - id: "jsonc/no-hexadecimal-numeric-literals"
    name: "no-hexadecimal-numeric-literals"
    default: "error in recommended-with-json, recommended-with-jsonc"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`0xFF` -> invalid-number."
  - id: "jsonc/no-infinity"
    name: "no-infinity"
    default: "error in recommended-with-json, recommended-with-jsonc"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`Infinity` -> unexpected-word plus 3 follow-up errors."
  - id: "jsonc/no-nan"
    name: "no-nan"
    default: "error in recommended-with-json, recommended-with-jsonc"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`NaN` same."
  - id: "jsonc/no-number-props"
    name: "no-number-props"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`{1: 2}` -> expected-key."
  - id: "jsonc/no-numeric-separators"
    name: "no-numeric-separators"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`1_000` -> invalid-number."
  - id: "jsonc/no-octal-numeric-literals"
    name: "no-octal-numeric-literals"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`0o17`/`017` -> invalid-number (`01` verified)."
  - id: "jsonc/no-parenthesized"
    name: "no-parenthesized"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`(1)` -> unexpected-character."
  - id: "jsonc/no-plus-sign"
    name: "no-plus-sign"
    default: "error in recommended-with-json, recommended-with-jsonc"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`+1` -> unexpected-character."
  - id: "jsonc/no-regexp-literals"
    name: "no-regexp-literals"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`/re/` -> unexpected-character."
  - id: "jsonc/no-template-literals"
    name: "no-template-literals"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "Backtick strings -> unexpected-character."
  - id: "jsonc/no-undefined-value"
    name: "no-undefined-value"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`undefined` -> unexpected-word."
  - id: "jsonc/no-unicode-codepoint-escapes"
    name: "no-unicode-codepoint-escapes"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`\\u{1F600}` -> invalid-string."
  - id: "jsonc/sort-array-values"
    name: "sort-array-values"
    default: "off (in no recommended config)"
    kind: "lint"
    sudsy: "planned"
    coverage: "missing"
    notes: "Sorts array elements (pathPattern/hasProperties/order/minValues/allowLineSeparatedGroups...). Opt-in; changes data order, so unsafe. Proposal: rule `sorted-array-values` (json, yaml) only if requested; low priority."
    priority: "p3"
    batch: "B4 json-optin-lint"
    usage: "low"
  - id: "jsonc/sort-keys"
    name: "sort-keys"
    default: "off (in no recommended config)"
    kind: "lint"
    sudsy: "rule: sorted-keys"
    coverage: "partial"
    notes: "Options (array of {pathPattern, hasProperties, order: asc|desc|[keys]|{type, caseSensitive, natural}, minKeys, allowLineSeparatedGroups}); default asc, case-sensitive, not natural. Sudsy: ordinal asc, option `order` (leading keys), unsafe fix, off by default."
    gap: "no direction, case-insensitive or natural order, minKeys, line-separated groups, path/hasProperties scoping"
    priority: "p2"
    batch: "B4 sorted-keys-options"
    usage: "medium"
  - id: "jsonc/valid-json-number"
    name: "valid-json-number"
    default: "error in recommended-with-json, recommended-with-jsonc"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`.5`, `1.`, `01` etc. -> invalid-number / unexpected-character. Valid forms (`-0`, `1e5`, `1E+2`) are accepted (verified)."
  - id: "jsonc/vue-custom-block/no-parsing-error"
    name: "vue-custom-block/no-parsing-error"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "wontfix: Vue SFC custom blocks"
    coverage: "wontfix"
    notes: ""
  - id: "jsonc/array-bracket-newline"
    name: "array-bracket-newline"
    default: "off (in no recommended config)"
    kind: "format-option"
    sudsy: "option: json.format.collapse"
    coverage: "partial"
    notes: "Formatter decides line breaks by fit (`collapse`: preserve|always|never|opening_break); no per-count rule like ESLint's {minItems, multiline}."
    gap: "no minItems/multiline thresholds"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "jsonc/array-bracket-spacing"
    name: "array-bracket-spacing"
    default: "off (in no recommended config)"
    kind: "format-option"
    sudsy: "planned"
    coverage: "missing"
    notes: "Fixed `[1, 2]` (ESLint 'never'). Option `always` unsupported; see Biome delimiterSpacing."
    gap: "`[ 1, 2 ]` not expressible"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "jsonc/array-element-newline"
    name: "array-element-newline"
    default: "off (in no recommended config)"
    kind: "format-option"
    sudsy: "option: json.format.collapse"
    coverage: "partial"
    notes: "Elements one per line when the array breaks; 'consistent'-style semantics match. No minItems threshold."
    gap: "no threshold form"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "jsonc/comma-dangle"
    name: "comma-dangle"
    default: "error in recommended-with-json"
    kind: "format-option"
    sudsy: "option: json.format.trailing_commas"
    coverage: "covered"
    notes: "recommended-with-json (error, default 'never'). Sudsy never|multiline (jsonc only). 'always'/'always-multiline' of ESLint map to multiline."
  - id: "jsonc/comma-style"
    name: "comma-style"
    default: "off (in no recommended config)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Commas always trail ('last')."
  - id: "jsonc/indent"
    name: "indent"
    default: "off (in no recommended config)"
    kind: "format-option"
    sudsy: "option: json.format.indent_size"
    coverage: "covered"
    notes: "Tabs and 1..16 spaces; formatter always re-indents. ESLint-only knobs (SwitchCase, etc.) do not apply. Sudsy: json.format.indent_size / indent_style."
  - id: "jsonc/key-spacing"
    name: "key-spacing"
    default: "off (in no recommended config)"
    kind: "format-option"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Fixed `\"a\": 1`; alignment options of ESLint (align, multiLine, mode) are wontfix by design (formatter never aligns)."
  - id: "jsonc/no-dupe-keys"
    name: "no-dupe-keys"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: no-duplicate-keys"
    coverage: "covered"
    notes: "Error by default in Sudsy. ESLint compares evaluated key values (escape forms equal); Sudsy compares keys as written between quotes (`\"a\"` vs `\"\\u0061\"` differ). Merged proposal: decode JSON escapes before comparing."
  - id: "jsonc/no-floating-decimal"
    name: "no-floating-decimal"
    default: "error in recommended-with-json, recommended-with-jsonc"
    kind: "format-option"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`.5`, `1.` are errors."
  - id: "jsonc/no-irregular-whitespace"
    name: "no-irregular-whitespace"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "Verified: NBSP outside strings -> unexpected-character. Inside strings and comments allowed (ESLint skipStrings default true, skipComments false)."
  - id: "jsonc/no-multi-str"
    name: "no-multi-str"
    default: "error in recommended-with-json, recommended-with-jsonc"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "Line continuation in string -> unterminated-string."
  - id: "jsonc/no-octal-escape"
    name: "no-octal-escape"
    default: "off (in no recommended config)"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`\"\\1\"` -> invalid escape (verified). Not in any recommended config."
  - id: "jsonc/no-octal"
    name: "no-octal"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`01` verified."
  - id: "jsonc/no-sparse-arrays"
    name: "no-sparse-arrays"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "`[1,,2]` -> unexpected-comma (verified)."
  - id: "jsonc/no-useless-escape"
    name: "no-useless-escape"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "lint"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "Invalid escapes (`\\a`) are syntax errors (verified). Valid but unnecessary escapes such as `\\/` or `\\u0041` are kept; whether ESLint flags them is unverified."
  - id: "jsonc/object-curly-newline"
    name: "object-curly-newline"
    default: "off (in no recommended config)"
    kind: "format-option"
    sudsy: "option: json.format.collapse"
    coverage: "partial"
    notes: "Layout by fit and `collapse`; no minProperties/multiline thresholds."
    gap: "no threshold form"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "jsonc/object-curly-spacing"
    name: "object-curly-spacing"
    default: "off (in no recommended config)"
    kind: "format-option"
    sudsy: "planned"
    coverage: "missing"
    notes: "Fixed `{ \"a\": 1 }` (ESLint 'always'). 'never' unsupported."
    gap: "`{\"a\": 1}` not expressible"
    priority: "p2"
    batch: "B2 shared-format-options"
    usage: "medium"
  - id: "jsonc/object-property-newline"
    name: "object-property-newline"
    default: "off (in no recommended config)"
    kind: "format-option"
    sudsy: "option: json.format.collapse"
    coverage: "partial"
    notes: "Properties one per line when expanded; `allowAllPropertiesOnSameLine` semantics = collapse preserve/always."
    gap: "no exact equivalent for the 'forbid same-line properties' mode (that is collapse: never)"
    priority: "p3"
    batch: "B2 shared-format-options"
    usage: "low"
  - id: "jsonc/quote-props"
    name: "quote-props"
    default: "error in recommended-with-json, recommended-with-jsonc"
    kind: "format-option"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "JSON requires double-quoted keys; others are errors."
  - id: "jsonc/quotes"
    name: "quotes"
    default: "error in recommended-with-json, recommended-with-jsonc"
    kind: "format-option"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "Single quotes are errors (`{'a': 1}` verified)."
  - id: "jsonc/space-unary-ops"
    name: "space-unary-ops"
    default: "error in recommended-with-json, recommended-with-jsonc, recommended-with-json5"
    kind: "format-option"
    sudsy: "rule: syntax-error"
    coverage: "covered"
    notes: "Only the minus sign of numbers exists in JSON; `- 1` is an error."
