tool: "actionlint"
version: "1.7.12"
languages: ["github-actions"]
sources:
  - "https://github.com/rhysd/actionlint/releases/tag/v1.7.12"
  - "https://github.com/rhysd/actionlint/blob/v1.7.12/docs/checks.md"
entries:
  "expression/syntax": "rule invalid-expression | The grammar is not parsed: a misplaced operator or a missing operand is not reported."
  expression/untrusted: rule script-injection | The contexts are a fixed list.
  deprecated-commands: rule deprecated-commands
  id/job: rule invalid-job-id
  id/duplicate: rule duplicate-ids
  job-needs/cycle: rule cyclic-needs
  job-needs/unknown: rule unknown-needs
  runner-label/unknown: rule invalid-runs-on | Sudsy's list is patterns for the hosted images, not the list of one actionlint release; labels with an expression are not checked.
  syntax-check/duplicate-job: rule duplicate-ids | partial
deferred:
  - gap: "GitHub's keys are case-insensitive: `no-duplicate-keys` does not see `FOO` and `foo` as repeats. `needs` lists that repeat a job (`bar, BAR`) are not reported."
    ids: ["syntax-check/duplicate-key", "job-needs/duplicate"]
  - gap: "Needs the metadata of the action a step uses (inputs, outputs, runner version), a repository file (a local action, a reusable workflow) or the network."
    ids: ["action", "syntax-check/workflow-call", "syntax-check/local-action"]
  - gap: "Offline, not built: the types of expressions, the contexts and functions available per key, `if:` conditions that are always true, event and activity names, filters and globs, matrix keys, permission scopes, step id characters, service credentials, runner label conflicts, and the structure checks (a required key missing, a section of the wrong kind or empty)."
    ids: ["expression/types", "if-cond", "events", "glob", "matrix", "permissions", "credentials", "id/step", "runner-label/conflict", "syntax-check"]
  - gap: "The checks of the shell and Python of `run:` are Sudsy's Shell and PowerShell rules, run on the embedded script; there is no pyflakes."
    ids: ["shellcheck", "pyflakes"]
