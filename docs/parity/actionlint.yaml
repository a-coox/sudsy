tool: "actionlint"
version: "1.7.12"
languages: ["github-actions"]
sources:
  - "https://github.com/rhysd/actionlint/releases/tag/v1.7.12"
  - "https://github.com/rhysd/actionlint/blob/v1.7.12/docs/checks.md"
default_config: "Every check runs, with its shellcheck and pyflakes integrations switched off by the parity run (the scripts are checked by Sudsy's Shell and PowerShell rules through the embedded-language mechanism). Ids are the upstream error `kind`, split by message where one kind holds several checks (`scripts/parity_compare.py`, `actionlint_check`); `deferred` ids are checks Sudsy does not do yet. Sudsy's `missing-permissions` has no actionlint equivalent."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
entries:
  - id: "expression/syntax"
    name: "expression syntax"
    sudsy: "rule: invalid-expression"
    coverage: "partial"
    notes: "Unclosed and empty `${{ }}`, unbalanced brackets, strings, characters, unknown contexts and functions."
    gap: "The grammar is not parsed: a misplaced operator or a missing operand is not reported."
  - id: "expression/untrusted"
    name: "untrusted input in scripts"
    sudsy: "rule: script-injection"
    coverage: "partial"
    notes: "The contexts of GitHub's security hardening guide in `run:` scripts and the `script` of `actions/github-script`."
    gap: "The contexts are a fixed list."
  - id: "deprecated-commands"
    name: "deprecated workflow commands"
    sudsy: "rule: deprecated-commands"
    coverage: "covered"
    notes: ""
    gap: ""
  - id: "id/job"
    name: "job id characters"
    sudsy: "rule: invalid-job-id"
    coverage: "covered"
    notes: ""
    gap: ""
  - id: "id/duplicate"
    name: "duplicate step ids"
    sudsy: "rule: duplicate-ids"
    coverage: "covered"
    notes: ""
    gap: ""
  - id: "job-needs/cycle"
    name: "cyclic needs"
    sudsy: "rule: cyclic-needs"
    coverage: "covered"
    notes: ""
    gap: ""
  - id: "job-needs/unknown"
    name: "needs an unknown job"
    sudsy: "rule: unknown-needs"
    coverage: "covered"
    notes: ""
    gap: ""
  - id: "runner-label/unknown"
    name: "unknown runner label"
    sudsy: "rule: invalid-runs-on"
    coverage: "partial"
    notes: "The known labels are the rule's `labels` option (regular expressions), so a repository's own runners are one config line."
    gap: "Sudsy's list is patterns for the hosted images, not the list of one actionlint release; labels with an expression are not checked."
  - id: "syntax-check/duplicate-job"
    name: "duplicate job ids"
    sudsy: "rule: duplicate-ids"
    coverage: "partial"
    notes: "Job ids that differ in case; exact repeats are the shared `no-duplicate-keys`."
    gap: ""
deferred:
  - gap: "GitHub's keys are case-insensitive: `no-duplicate-keys` does not see `FOO` and `foo` as repeats. `needs` lists that repeat a job (`bar, BAR`) are not reported."
    ids: ["syntax-check/duplicate-key", "job-needs/duplicate"]
  - gap: "Needs the metadata of the action a step uses (inputs, outputs, runner version), a repository file (a local action, a reusable workflow) or the network."
    ids: ["action", "syntax-check/workflow-call", "syntax-check/local-action"]
  - gap: "Offline, not built: the types of expressions, the contexts and functions available per key, `if:` conditions that are always true, event and activity names, filters and globs, matrix keys, permission scopes, step id characters, service credentials, runner label conflicts, and the structure checks (a required key missing, a section of the wrong kind or empty)."
    ids: ["expression/types", "if-cond", "events", "glob", "matrix", "permissions", "credentials", "id/step", "runner-label/conflict", "syntax-check"]
  - gap: "The checks of the shell and Python of `run:` are Sudsy's Shell and PowerShell rules, run on the embedded script; there is no pyflakes."
    ids: ["shellcheck", "pyflakes"]
