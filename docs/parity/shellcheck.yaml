    name: "useless-cat"
    default: "style"
    kind: "lint"
    sudsy: "rule: useless-cat"
    coverage: "covered"
    notes: ""
    gap: ""
    priority: "p2"
    batch: "B17 shell-shellcheck"
    usage: "medium"
