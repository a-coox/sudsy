tool: "shellcheck"
version: "0.11.0"
languages: ["shell"]
sources:
  - "https://github.com/koalaman/shellcheck/releases/tag/v0.11.0"
  - "https://github.com/koalaman/shellcheck/wiki/Checks"
default_config: "Every SC check runs at its own severity (error, warning, info, style); the optional checks (`--enable`) are off. Sudsy turns error and warning on by default and info and style off; the `shell/shellcheck` preset turns every covered rule on (error stays error, the rest are warn). Severities come from the v0.11.0 source; codes the source reports with a computed severity carry the usual one."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
