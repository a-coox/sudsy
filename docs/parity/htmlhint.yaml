tool: "htmlhint"
version: "1.9.2"
languages: ["html"]
sources:
  - "https://github.com/htmlhint/HTMLHint/tree/v1.9.2/src/core/rules"
  - "https://htmlhint.com/rules/"
scope: "HTMLHint's core rules"
entries:
  alt-require: planned
  attr-lowercase: rule attr-case
  attr-no-duplication: rule no-duplicate-keys
  attr-no-unnecessary-whitespace: planned
  attr-sorted: planned
  attr-unsafe-chars: planned
  attr-value-double-quotes: rule attr-quotes | a single-quoted value that holds a double quote is allowed
  attr-value-no-duplication: planned
  attr-value-not-empty: planned
  attr-value-single-quotes: planned
  attr-whitespace: planned
  button-type-require: rule no-implicit-button-type
  doctype-first: rule missing-doctype | the doctype is not required to be the first thing in the file
  doctype-html5: rule doctype-html
  empty-tag-not-self-closed: rule void-style
  form-method-require: planned
  frame-title-require: rule element-required-attributes | reports `<iframe>` and `<embed>` as well as frames
  h1-require: planned
  head-script-disabled: planned
  href-abs-or-rel: planned
  html-lang-require: rule element-required-attributes | also requires the attributes of other elements that html-validate requires (`src` of `<img>`)
  id-class-ad-disabled: planned
  id-class-value: planned
  id-unique: rule no-duplicate-id
  inline-script-disabled: planned
  inline-style-disabled: rule no-inline-style | a style that sets only display is allowed
  input-requires-label: planned
  link-rel-canonical-require: planned
  main-require: planned
  meta-charset-require: planned
  meta-description-require: planned
  meta-viewport-require: planned
  script-disabled: planned
  space-tab-mixed-disabled: planned
  src-not-empty: planned
  style-disabled: rule no-style-tag
  tag-no-obsolete: rule deprecated
  tag-pair: rule no-implicit-close | an end tag that closes nothing is the parser's `syntax-error`; an unclosed element is `no-implicit-close`
  tag-self-close: planned
  tagname-lowercase: rule element-case
  tags-check: planned
  title-require: planned
