tool: "html-eslint"
version: "0.68.0"
languages: ["html"]
sources:
  - "https://github.com/yeonjuan/html-eslint/tree/v0.68.0/docs/rules"
  - "https://html-eslint.org/docs/rules"
scope: "@html-eslint/eslint-plugin's rules for HTML files"
entries:
  attrs-newline: planned
  class-spacing: planned
  css-no-empty-blocks: planned
  element-newline: planned
  head-order: planned
  id-naming-convention: rule id-pattern | the convention is the pattern option (a regex), not named styles
  indent: planned
  lowercase: rule element-case | the case of attribute names is `attr-case`
  max-element-depth: planned
  no-abstract-roles: rule no-abstract-role
  no-accesskey-attrs: planned
  no-aria-hidden-body: rule aria-hidden-body
  no-aria-hidden-on-focusable: planned
  no-duplicate-attrs: rule no-duplicate-keys
  no-duplicate-class: rule no-duplicate-class
  no-duplicate-id: rule no-duplicate-id
  no-duplicate-in-head: planned
  no-empty-headings: rule empty-heading
  no-extra-spacing-attrs: planned
  no-extra-spacing-tags: planned
  no-extra-spacing-text: planned
  no-heading-inside-button: planned
  no-ineffective-attrs: planned
  no-inline-styles: rule no-inline-style | a style that sets only display is allowed
  no-invalid-attr-value: rule attribute-allowed-values | the values html-validate lists for an attribute; `id` and other pattern values are not checked
  no-invalid-entity: rule unrecognized-char-ref | named references in text only
  no-invalid-role: planned
  no-multiple-empty-lines: planned
  no-multiple-h1: rule heading-level | also reports the other heading rules of `heading-level`
  no-nested-interactive: planned
  no-non-scalable-viewport: planned
  no-obsolete-attrs: rule no-deprecated-attr
  no-obsolete-tags: rule deprecated
  no-positive-tabindex: planned
  no-redundant-role: rule no-redundant-role
  no-restricted-attr-values: planned
  no-restricted-attrs: planned
  no-restricted-tags: planned
  no-script-style-type: planned
  no-skip-heading-levels: rule heading-level | also reports a first heading that is not an h1 and a second h1
  no-target-blank: planned
  no-trailing-spaces: rule no-trailing-whitespace
  no-whitespace-only-children: planned
  prefer-https: planned
  quotes: rule attr-quotes | a single-quoted value that holds a double quote is allowed; unquoted values are reported
  require-attrs: planned
  require-button-type: rule no-implicit-button-type
  require-closing-tags: rule no-implicit-close | implied end tags only; the self-closing options are `void-style` and `no-self-closing`
  require-content: planned
  require-details-summary: planned
  require-doctype: rule missing-doctype
  require-explicit-size: planned
  require-form-method: planned
  require-frame-title: rule element-required-attributes | reports `<embed>` as well as frames
  require-img-alt: planned
  require-input-label: rule input-missing-label
  require-lang: rule element-required-attributes | also requires the attributes of other elements that html-validate requires (`src` of `<img>`)
  require-li-container: planned
  require-meta-charset: planned
  require-meta-description: planned
  require-meta-viewport: planned
  require-open-graph-protocol: planned
  require-title: planned
  sort-attrs: planned
  svg-require-viewbox: planned
  use-baseline: planned
