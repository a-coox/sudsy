tool: "checkmake"
version: "0.3.2"
languages: ["makefile"]
sources:
  - "https://github.com/checkmake/checkmake/releases/tag/v0.3.2"
  - "https://github.com/checkmake/checkmake#rules"
entries:
  minphony: rule min-phony
  phonydeclared: rule phony-declared
  timestampexpanded: rule timestamp-expanded
  maxbodylength: rule max-body-length | checkmake ends a recipe at a blank line, a comment line without a tab or a conditional; Sudsy follows make, where they belong to the recipe.
  uniquetargets: rule unique-targets
