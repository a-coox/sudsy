tool: "checkmake"
version: "0.3.2"
languages: ["makefile"]
sources:
  - "https://github.com/checkmake/checkmake/releases/tag/v0.3.2"
  - "https://github.com/checkmake/checkmake#rules"
default_config: "Every rule runs: maxbodylength 5 lines, minphony requiring all, clean and test. Rules are configured in checkmake.ini; Sudsy turns them on with the preset makefile/checkmake."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "minphony"
    name: "minphony"
    default: "on"
    kind: "lint"
    sudsy: "rule: min-phony"
    coverage: "covered"
    notes: "The `required` option is checkmake's `required` setting. Reported on the `.PHONY` line, as checkmake does (checkmake counts the line after it)."
    gap: ""
    priority: "p1"
    usage: "medium"
  - id: "phonydeclared"
    name: "phonydeclared"
    default: "on"
    kind: "lint"
    sudsy: "rule: phony-declared"
    coverage: "covered"
    notes: "Each target of a rule with several targets is checked on its own; checkmake reads `a b:` as one target named `a b`."
    gap: ""
    priority: "p1"
    usage: "medium"
  - id: "timestampexpanded"
    name: "timestampexpanded"
    default: "on"
    kind: "lint"
    sudsy: "rule: timestamp-expanded"
    coverage: "covered"
    notes: "Reported on the variable's line; checkmake counts the line after it."
    gap: ""
    priority: "p1"
    usage: "low"
  - id: "maxbodylength"
    name: "maxbodylength"
    default: "on"
    kind: "lint"
    sudsy: "rule: max-body-length"
    coverage: "partial"
    notes: "The `max` option is checkmake's `maxBodyLength`."
    gap: "checkmake ends a recipe at a blank line, a comment line without a tab or a conditional; Sudsy follows make, where they belong to the recipe."
    priority: "p1"
    usage: "medium"
  - id: "uniquetargets"
    name: "uniquetargets"
    default: "on"
    kind: "lint"
    sudsy: "rule: unique-targets"
    coverage: "covered"
    notes: "The `ignore` option is checkmake's `ignore` setting. Double-colon rules, which make allows to repeat, are skipped."
    gap: ""
    priority: "p2"
    usage: "low"
