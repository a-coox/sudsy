    coverage: "covered"
    notes: "Verified by `scripts/parity.sh stylecop` (the fixtures format with `preset:csharp/stylecop`): StyleCop wants `delegate(int v)` (no space), the default layout prints `delegate (int v)`; `space_after_delegate: false` (preset `csharp/stylecop`) removes the space. Other parentheses always match the one spacing table."
    category: "spacing/readability"
