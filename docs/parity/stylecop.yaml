tool: "stylecop"
version: "1.2.0-beta.556 (pinned; NuGet StyleCop.Analyzers). Rules only in later master builds are dropped."
languages: ["csharp"]
sources:
  - "https://github.com/DotNetAnalyzers/StyleCopAnalyzers (clone at d4fdfe5, rule list = documentation/*.md, defaults = AnalyzerConstants in src/StyleCop.Analyzers/**/*.cs, release tracking = AnalyzerReleases.*.md)"
  - "https://www.nuget.org/packages/StyleCop.Analyzers (latest stable 1.1.118, latest beta 1.3.151-beta)"
  - "https://github.com/DotNetAnalyzers/StyleCopAnalyzers/blob/master/documentation/KnownChanges.md (intentionally omitted rules)"
  - "https://github.com/DotNetAnalyzers/StyleCopAnalyzers/blob/master/documentation/Configuration.md"
scope: "SA0001-SA1652 and SX1101/SX1309 (197 rules)"
default_severity: "Every rule is Warning when enabled; defaults 'off' come from DisabledByDefault / DisabledAlternative descriptors (the EnabledByDefault flag, not a severity)."
verification: "Formatter coverage was checked by running a debug build of Sudsy (this repo at HEAD 83aaab1) over deliberately mis-formatted C#; rules marked 'Verified' in notes were observed, the rest follow from the documented layout rules."
sdk_note: "`sdk` = a .NET SDK rule (IDE*/CA*/CS*) with the same intent; 'Partial equivalence' marks differences. Policy: Sudsy never reimplements these."
legend:
  sudsy: "rule: <id> | option: <language>.format.<name> | formatter | sdk: <id> | config: <text> | planned | deferred | wontfix: <reason>"
  coverage: "covered | partial | missing | sdk | wontfix | deferred (planned counts as missing; partial keeps its primary mapping and states the gap)"
  priority: "p1 = on by default upstream, p2 = popular opt-in, p3 = rare (judgment, not measured)"
entries:
  - id: "SA0001"
    name: "XML comment analysis disabled"
    default: "on (warning)"
    kind: "lint"
    sudsy: "wontfix: analyzer meta diagnostic (XML comment analysis disabled)"
    coverage: "wontfix"
    notes: ""
    category: "special"
  - id: "SA0002"
    name: "Invalid settings file"
    default: "on (warning)"
    kind: "lint"
    sudsy: "wontfix: analyzer meta diagnostic (invalid stylecop.json); sudsy.yaml errors are config errors"
    coverage: "wontfix"
    notes: ""
    category: "special"
  - id: "SA1000"
    name: "Keywords should be spaced correctly"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified by formatting deliberately mis-spaced input; spacing is not configurable (one spacing table), so it always matches StyleCop's required style. Text inside interpolated strings holes is left as written."
    category: "spacing/readability"
  - id: "SA1001"
    name: "Commas should be spaced correctly"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified by formatting deliberately mis-spaced input; spacing is not configurable (one spacing table), so it always matches StyleCop's required style. Text inside interpolated strings holes is left as written."
    category: "spacing/readability"
  - id: "SA1002"
    name: "Semicolons should be spaced correctly"
    default: "on (warning)"
    kind: "lint"
    sudsy: "option: csharp.format.space_between_empty_for_clauses"
    coverage: "covered"
    notes: "Verified by formatting deliberately mis-spaced input. Only `for (; ;)` (empty condition, `csharp/stylecop` sets the option) is not the default `for (;;)`; the rest is fixed spacing that matches StyleCop. Text inside interpolated strings holes is left as written."
    category: "spacing/readability"
  - id: "SA1003"
    name: "Symbols should be spaced correctly"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified by formatting deliberately mis-spaced input; spacing is not configurable (one spacing table), so it always matches StyleCop's required style. Text inside interpolated strings holes is left as written."
    category: "spacing/readability"
  - id: "SA1004"
    name: "Documentation lines should begin with single space"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: doc-comment-space"
    coverage: "covered"
    notes: "Verified by `scripts/parity.sh stylecop`: no space, a tab, or several spaces on the first line of a doc comment are reported; several spaces on continuation lines are allowed. Not a formatter behavior: the formatter never rewrites comment text."
    category: "spacing/readability"
  - id: "SA1005"
    name: "Single line comments should begin with single space"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: comment-space"
    coverage: "covered"
    notes: "Shared rule (`comment-space`, also for JSONC and YAML comments), off by default; safe fix inserts the space. Exempt (as StyleCop): marker repeated (`////`), `//--` separator lines, nothing but whitespace after the marker. Verified by `scripts/parity.sh stylecop`. Not a formatter behavior: the formatter never rewrites comment text."
    category: "spacing/readability"
  - id: "SA1006"
    name: "Preprocessor keywords should not be preceded by space"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: directive-keyword-space"
    coverage: "covered"
    notes: "Verified by `scripts/parity.sh stylecop`, including directives in disabled `#if` branches. Safe fix removes the space."
    category: "spacing/readability"
  - id: "SA1007"
    name: "Operator keyword should be followed by space"
