    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: parameter and argument lists are re-flowed: either all on one line or one per line starting on the line after `(`; `(` stays on the name's line, commas trail."
    category: "readability"
  - id: "SA1117"
    name: "Parameters should be on same line or separate lines"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: parameter and argument lists are re-flowed: either all on one line or one per line starting on the line after `(`; `(` stays on the name's line, commas trail."
    category: "readability"
  - id: "SA1118"
    name: "Parameter should not span multiple lines"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "partial"
    notes: "StyleCop exempts lambdas, anonymous methods, invocations, object/array creations."
    gap: "arguments other than the first that span several lines are produced only for lambdas, invocations and creations (all allowed by SA1118) -- but a long binary/conditional/concatenation argument is wrapped across lines and violates it"
    priority: "p3"
    batch: "B8 stylecop-layout-formatter"
    usage: "low"
    effort: "F formatter option"
    category: "readability"
  - id: "SA1119"
    name: "Statement should not use unnecessary parenthesis"
    default: "on (warning)"
    kind: "lint"
    sudsy: "sdk: IDE0047"
    coverage: "sdk"
    notes: "dotnet_style_parentheses_in_* = never_if_unnecessary; also RCS1032 (Roslynator). StyleCop only reports statement-level redundant parentheses. Partial equivalence."
    category: "readability"
  - id: "SA1120"
    name: "Comments should contain text"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: no-empty-comment"
    coverage: "covered"
    notes: "Shared rule (`no-empty-comment`). Verified by `scripts/parity.sh stylecop`: empty block comments always; an empty `//` only at the start or end of a run of comments (a bare `//` between comment lines is a paragraph separator). No fix, as StyleCop."
    category: "readability"
  - id: "SA1121"
    name: "Use built-in type alias"
    default: "on (warning)"
    kind: "lint"
    sudsy: "sdk: IDE0049"
    coverage: "sdk"
    notes: "dotnet_style_predefined_type_for_locals_parameters_members / _for_member_access = true. Roslynator RCS1013 is the same check (off)."
    category: "readability"
  - id: "SA1122"
    name: "Use string.Empty for empty strings"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: use-string-empty"
    coverage: "partial"
    notes: "Verified by `scripts/parity.sh stylecop`: `\"\"` and `@\"\"` outside const, attribute, default-parameter, case and pattern positions. Safe fix. Roslynator RCS1078 wants the opposite (`\"\"`)."
    gap: "Only the `string.Empty` direction; no option for the opposite style (RCS1078) because no preset needs it"
    category: "readability"
  - id: "SA1123"
    name: "Do not place regions within elements"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: no-region-in-body"
    coverage: "covered"
    notes: "Verified by `scripts/parity.sh stylecop`: a `#region` inside any block (method, accessor, lambda, switch); not in initializers, accessor lists, enums or expression-bodied members. No fix."
    category: "readability"
  - id: "SA1124"
    name: "Do not use regions"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: no-regions"
    coverage: "covered"
    notes: "Verified by `scripts/parity.sh stylecop`, disabled `#if` branches included; regions inside a block are SA1123 (`no-region-in-body`). No fix (removing a region pair is not mechanical when it interleaves with `#if`)."
    category: "readability"
  - id: "SA1125"
    name: "Use shorthand for nullable types"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: nullable-shorthand"
    coverage: "covered"
    notes: "Verified by `scripts/parity.sh stylecop`: `Nullable<T>`, `System.Nullable<T>`, `global::System.Nullable<T>` in types and expressions; not in using aliases, `nameof`, `typeof(Nullable<>)`. Name-based (a user type called `Nullable` is reported; StyleCop binds it). Not reported before a member access (`Nullable<int>.Equals`). Safe fix."
    category: "readability"
  - id: "SA1126"
    name: "Prefix calls correctly"
    default: "on (warning)"
    kind: "lint"
    sudsy: "wontfix: intentionally omitted from StyleCop Analyzers (disabled upstream)"
    coverage: "wontfix"
    notes: ""
    category: "readability"
  - id: "SA1127"
    name: "Generic type constraints should be on their own line"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: `where T:class` moves to its own indented line."
    category: "readability"
  - id: "SA1128"
    name: "Put constructor initializers on their own line"
    default: "on (warning)"
    kind: "lint"
    sudsy: "option: csharp.format.constructor_initializer_line"
    coverage: "covered"
