  - id: "SA1026"
    name: "Code should not contain space after new or stackalloc keyword in implicitly typed array allocation"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified by formatting deliberately mis-spaced input; spacing is not configurable (one spacing table), so it always matches StyleCop's required style. Text inside interpolated strings holes is left as written."
    category: "spacing/readability"
  - id: "SA1027"
    name: "Use tabs correctly"
    default: "on (warning)"
    kind: "lint"
    sudsy: "option: csharp.format.indent_style"
    coverage: "covered"
    notes: "Indentation is rewritten with the configured style, so mixed tabs/spaces cannot survive. StyleCop's useTabs/indentationSize/tabSize map to indent_style/indent_size (tab width = indent_size). Sudsy: csharp.format.indent_style / indent_size."
    category: "spacing/readability"
  - id: "SA1028"
    name: "Code should not contain trailing whitespace"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified by formatting deliberately mis-spaced input; spacing is not configurable (one spacing table), so it always matches StyleCop's required style. Text inside interpolated strings holes is left as written."
    category: "spacing/readability"
  - id: "SA1100"
    name: "Do not prefix calls with base unless local implementation exists"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: no-unneeded-base-prefix"
    coverage: "covered"
    notes: "Verified by `scripts/parity.sh stylecop`: `base.M()` / `base[i]` where `this` binds to the same member (speculative binding); fix writes `this`."
    category: "readability"
  - id: "SA1101"
    name: "Prefix local calls with this"
    default: "on (warning)"
    kind: "lint"
    sudsy: "sdk: IDE0009"
    coverage: "sdk"
    notes: "csharp: dotnet_style_qualification_for_field/property/method/event = true:warning. StyleCop default requires `this.`; the inverse is SX1101 / IDE0003. Merged proposal: no Sudsy rule, the SDK pair covers both directions."
    category: "readability"
  - id: "SA1102"
    name: "Query clause should follow previous clause"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: queries are re-flowed (all on one line when they fit, else one clause per line), so mixed layouts cannot survive."
    category: "readability"
  - id: "SA1103"
    name: "Query clauses should be on separate lines or all on one line"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: queries are re-flowed (all on one line when they fit, else one clause per line), so mixed layouts cannot survive."
    category: "readability"
  - id: "SA1104"
    name: "Query clause should begin on new line when previous clause spans multiple lines"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: queries are re-flowed (all on one line when they fit, else one clause per line), so mixed layouts cannot survive."
    category: "readability"
  - id: "SA1105"
    name: "Query clauses spanning multiple lines should begin on own line"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: queries are re-flowed (all on one line when they fit, else one clause per line), so mixed layouts cannot survive."
    category: "readability"
  - id: "SA1106"
    name: "Code should not contain empty statements"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: no-empty-statement"
    coverage: "covered"
    notes: "Verified by `scripts/parity.sh stylecop`: `label: ;` is allowed, every other lone `;` is reported. Fix removes the statement or makes an embedded one `{ }` (like StyleCop's code fix); not offered for the only statement of a switch section. Roslynator RCS1038 is the same check."
    category: "readability"
  - id: "SA1107"
    name: "Code should not contain multiple statements on one line"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: `int x = 1; int y = 2;` is split."
    category: "readability"
  - id: "SA1108"
    name: "Block statements should not contain embedded comments"
    default: "on (warning)"
    kind: "lint"
    sudsy: "rule: no-comment-before-block"
    coverage: "covered"
    notes: "Verified by `scripts/parity.sh stylecop`: comments between the head of if/else/while/do/for/foreach/lock/try/catch/finally/switch/checked/unchecked and its `{`; StyleCop does not report `using`, method bodies, accessors or bare blocks. No fix."
    category: "readability"
  - id: "SA1109"
    name: "Block statements should not contain embedded regions"
    default: "on (warning)"
    kind: "lint"
    sudsy: "wontfix: intentionally omitted from StyleCop Analyzers (disabled upstream)"
    coverage: "wontfix"
    notes: ""
    category: "readability"
  - id: "SA1110"
    name: "Opening parenthesis or bracket should be on declaration line"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: parameter and argument lists are re-flowed: either all on one line or one per line starting on the line after `(`; `(` stays on the name's line, commas trail."
    category: "readability"
  - id: "SA1111"
    name: "Closing parenthesis should be on line of last parameter"
    default: "on (warning)"
    kind: "lint"
    sudsy: "option: csharp.format.closing_paren_line"
    coverage: "covered"
    notes: "Verified by `scripts/parity.sh stylecop` (the fixtures format with `preset:csharp/stylecop`): `closing_paren_line: same_line` puts the `)` of a broken parameter, argument or attribute argument list after the last item (`own_line`, the default, is CSharpier's and the Microsoft layout). Not applied to a list with a comment in front of the `)`."
    category: "readability"
  - id: "SA1112"
    name: "Closing parenthesis should be on line of opening parenthesis"
    default: "on (warning)"
    kind: "lint"
    sudsy: "formatter"
    coverage: "covered"
    notes: "Verified: parameter and argument lists are re-flowed: either all on one line or one per line starting on the line after `(`; `(` stays on the name's line, commas trail."
    category: "readability"
  - id: "SA1113"
