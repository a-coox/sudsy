[workspace]
resolver = "3"
members = ["crates/*", "xtask", "xtask/full", "tools/wire-bench", "tools/perf-bench"]
# Builds for wasm32-wasip2 on its own (the plugin tests do that); not part of the host build.
exclude = ["tests/plugins/sample"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
insta = "1"
memchr = "2"
unicode-width = "0.2"
proptest = "1"
rmp-serde = "1"
regex = "1"
regex-syntax = "0.8"
rowan = { path = "third_party/rowan" }
mimalloc = "0.1"
salsa = "0.28"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde-saphyr = "2"
serde_json = "1"
stacker = "0.1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tree-sitter = "0.27"
# oxc is pre-1.0 and breaks its AST about weekly: pinned exactly, bumped by hand only (dependabot ignores it).
oxc_allocator = "=0.158.0"
oxc_ast = "=0.158.0"
oxc_ast_visit = "=0.158.0"
oxc_parser = "=0.158.0"
oxc_span = "=0.158.0"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# generated:grammars
tree-sitter-containerfile = "0.9"
konomanoasa-tree-sitter-editorconfig = "0.9"
konomanoasa-tree-sitter-gitignore = "0.7"
tree-sitter-graphql = { path = "grammars/tree-sitter-graphql" }
tree-sitter-hcl = "1.1"
tree-sitter-ini = { path = "grammars/tree-sitter-ini" }
tree-sitter-make = { path = "grammars/tree-sitter-make" }
tree-sitter-md = { version = "0.5", default-features = false }
woodruffw-trough-tree-sitter-powershell = "0.1"
tree-sitter-proto = "0.6"
tree-sitter-bash = { path = "grammars/tree-sitter-bash" }
tree-sitter-toml-ng = "0.7"
tree-sitter-xml = "0.7"
# /generated

core-config = { path = "crates/core-config" }
core-patterns = { path = "crates/core-patterns" }
core-plugins = { path = "crates/core-plugins" }
plugin-sdk = { path = "crates/plugin-sdk" }
core-flow = { path = "crates/core-flow" }
core-semantics = { path = "crates/core-semantics" }
core-incremental = { path = "crates/core-incremental" }
core-rules = { path = "crates/core-rules" }
core-format = { path = "crates/core-format" }
core-workspace = { path = "crates/core-workspace" }
lang-csharp = { path = "crates/lang-csharp" }
lang-json = { path = "crates/lang-json" }
lang-js = { path = "crates/lang-js" }
lang-css = { path = "crates/lang-css" }
lang-yaml = { path = "crates/lang-yaml" }
lang-github-actions = { path = "crates/lang-github-actions" }
# generated:languages
lang-dockerfile = { path = "crates/lang-dockerfile", default-features = false }
lang-editorconfig = { path = "crates/lang-editorconfig", default-features = false }
lang-gitignore = { path = "crates/lang-gitignore", default-features = false }
lang-graphql = { path = "crates/lang-graphql", default-features = false }
lang-hcl = { path = "crates/lang-hcl", default-features = false }
lang-ini = { path = "crates/lang-ini", default-features = false }
lang-makefile = { path = "crates/lang-makefile", default-features = false }
lang-markdown = { path = "crates/lang-markdown", default-features = false }
lang-powershell = { path = "crates/lang-powershell", default-features = false }
lang-protobuf = { path = "crates/lang-protobuf", default-features = false }
lang-shell = { path = "crates/lang-shell", default-features = false }
lang-toml = { path = "crates/lang-toml", default-features = false }
lang-xml = { path = "crates/lang-xml", default-features = false }
# /generated
core-packs = { path = "crates/core-packs" }
core-treesitter = { path = "crates/core-treesitter" }
core-syntax = { path = "crates/core-syntax" }
languages = { path = "crates/languages", default-features = false }
lsp = { path = "crates/lsp", default-features = false }
provider-api = { path = "crates/provider-api" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Line tables only and opt-level 1: backtraces keep file:line, debug assertions and overflow checks
# stay on, and the ~100 test binaries rebuild after an edit in a third of the time (smaller
# binaries to link; docs/performance/numbers.md). A debugger shows no variable values.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

# Release speed with debug assertions: the corpus and conformance runs keep the formatter safety check.
[profile.corpus]
inherits = "release"
debug-assertions = true
