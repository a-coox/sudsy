[workspace]
resolver = "3"
members = ["crates/*", "xtask", "tools/wire-bench"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.0.0"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
insta = "1"
unicode-width = "0.2"
prost = "0.14"
proptest = "1"
rmp-serde = "1"
rowan = "0.16"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde-saphyr = "2"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

core-config = { path = "crates/core-config" }
core-format = { path = "crates/core-format" }
core-workspace = { path = "crates/core-workspace" }
lang-json = { path = "crates/lang-json" }
lang-yaml = { path = "crates/lang-yaml" }
core-syntax = { path = "crates/core-syntax" }
provider-api = { path = "crates/provider-api" }

[workspace.lints.rust]
unsafe_code = "forbid"
