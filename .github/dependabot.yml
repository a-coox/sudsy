version: 2
# One grouped PR per ecosystem per month (actions: per week) instead of one PR per package.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    groups: { cargo: { patterns: ["*"] } }
    # oxc breaks its AST about weekly: bumped by hand (kind table + adapter + conformance run), never automatically.
    ignore: [{ dependency-name: "oxc_*" }]
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule: { interval: monthly }
    groups: { npm: { patterns: ["*"] } }
    # typescript-eslint peers cap typescript below 7; drop this once it accepts 7.
    # @types/vscode must not exceed engines.vscode (vsce refuses to package): bump both by hand.
    ignore:
      - { dependency-name: typescript, update-types: ["version-update:semver-major"] }
      - { dependency-name: "@types/vscode" }
  - package-ecosystem: nuget
    directory: /workers/csharp
    schedule: { interval: monthly }
    groups: { nuget: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
