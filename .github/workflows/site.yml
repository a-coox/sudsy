name: Site

# Documentation site (site/, docs/development/site.md). Manual like ci.yml while the repository is
# private (Actions minutes); once public, add push (branches: [main]) and pull_request triggers with
# paths site/**, docs/rules/rules.json, docs/formatting/presets.md, schemas/sudsy.schema.json,
# crates/lang-*/presets/**, and switch the deploy job on.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: scripts/site.sh build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    # DEPLOY SWITCH: change `false` to `github.event_name != 'pull_request'` once the repository is
    # public and Settings > Pages > Source is "GitHub Actions". Nothing else needs to change.
    if: false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
