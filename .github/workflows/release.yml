name: Release

# Pushing a tag vX.Y.Z runs every gate of ci.yml, builds the CLI and the VS Code extension for each
# platform, and drafts a GitHub release with the archives and checksums. Nothing is published to
# a registry from here except by the manual `marketplace` job below, which needs the VSCE_PAT
# secret and a run started by hand on the tag.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: "Publish the built extensions to the VS Code Marketplace (run this on a tag)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Tag, Cargo.toml, package.json and CHANGELOG.md agree
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/check-version.sh "$TAG"

  gate:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, exe: sudsy }
          - { os: ubuntu-24.04-arm, target: linux-arm64, exe: sudsy }
          - { os: windows-latest, target: win32-x64, exe: sudsy.exe }
          - { os: windows-11-arm, target: win32-arm64, exe: sudsy.exe }
          - { os: macos-15-intel, target: darwin-x64, exe: sudsy }
          - { os: macos-latest, target: darwin-arm64, exe: sudsy }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --locked -p cli
      - run: dotnet publish workers/csharp/Sudsy.Worker -c Release -o "$RUNNER_TEMP/worker"
      - name: The CLI archive
        run: scripts/package-cli.sh ${{ matrix.target }} target/release/${{ matrix.exe }} "$RUNNER_TEMP/worker" dist
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run stage-server -- ../../target/release/${{ matrix.exe }} "$RUNNER_TEMP/worker"
        working-directory: editors/vscode
      - name: The staged server formats C# without SUDSY_CSHARP_WORKER
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          printf 'class  A{}\n' > "$RUNNER_TEMP/smoke/A.cs"
          cd "$RUNNER_TEMP/smoke"
          "$GITHUB_WORKSPACE/editors/vscode/server/${{ matrix.exe }}" format A.cs
          grep -q 'class A' A.cs
      - run: npm run package -- --target ${{ matrix.target }}
        working-directory: editors/vscode
      - run: cp editors/vscode/*.vsix dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sudsy-${{ matrix.target }}
          path: dist/*

  # A draft: someone looks at it and publishes it by hand.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '$0 ~ "^## \\[?" v "\\]?" {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $prerelease --title "Sudsy $version" \
            --notes "$notes" dist/*

  marketplace:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_marketplace && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # vsce comes from package-lock.json, never from an unpinned download next to the secret.
      - run: npm ci
        working-directory: editors/vscode
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish every platform package
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          for vsix in dist/*.vsix; do
            "$GITHUB_WORKSPACE/editors/vscode/node_modules/.bin/vsce" publish --packagePath "$vsix"
          done
