name: CI

# Manual only while the repo is private (Actions minutes are limited); restore push: [main] and
# pull_request when it goes public. The local gate (scripts/gate.sh) is the check until then.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: scripts/check-dco.sh ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          # The plugin host's tests build tests/plugins/sample to a Wasm component.
          targets: wasm32-wasip2
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the worker contract tests, which build and run the C# worker.
      # The big dotnet/runtime corpus test is #[ignore]d and not fetched here.
      - run: cargo test --workspace
      - run: cargo fmt --manifest-path tests/plugins/sample/Cargo.toml -- --check
      - run: cargo test --manifest-path tests/plugins/sample/Cargo.toml

  # Tier 1 of scripts/bench.sh against the PR base (or the previous main commit): deterministic
  # instruction and allocation counts, fails on a regression.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-wasip2
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Benchmark against the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BASE" in 0000000*|"") BASE=$(git rev-parse HEAD^) ;; esac
          bash scripts/bench.sh --base "$BASE" --no-record

  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build workers/csharp
      - run: dotnet test workers/csharp

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # One extension package per platform, each with its own native binary and the C# worker, and a
  # check that the staged binary finds the worker without being told where it is.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            exe: sudsy
          - os: windows-latest
            target: win32-x64
            exe: sudsy.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release -p cli
      - run: dotnet publish workers/csharp/Sudsy.Worker -c Release -o "$RUNNER_TEMP/worker"
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run stage-server -- ../../target/release/${{ matrix.exe }} "$RUNNER_TEMP/worker"
        working-directory: editors/vscode
      - name: The staged server formats C# without SUDSY_CSHARP_WORKER
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          printf 'class  A{}\n' > "$RUNNER_TEMP/smoke/A.cs"
          cd "$RUNNER_TEMP/smoke"
          "$GITHUB_WORKSPACE/editors/vscode/server/${{ matrix.exe }}" format A.cs
          grep -q 'class A' A.cs
      - run: npm run package -- --target ${{ matrix.target }}
        working-directory: editors/vscode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sudsy-${{ matrix.target }}
          path: editors/vscode/*.vsix
