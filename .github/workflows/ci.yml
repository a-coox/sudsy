name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # The plugin host's tests build tests/plugins/sample to a Wasm component.
          targets: wasm32-wasip2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the worker contract tests, which build and run the C# worker.
      # The big dotnet/runtime corpus test is #[ignore]d and not fetched here.
      - run: cargo test --workspace
      - run: cargo fmt --manifest-path tests/plugins/sample/Cargo.toml -- --check
      - run: cargo test --manifest-path tests/plugins/sample/Cargo.toml

  # Tier 1 of scripts/bench.sh against the PR base (or the previous main commit): deterministic
  # instruction and allocation counts, fails on a regression.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Benchmark against the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BASE" in 0000000*|"") BASE=$(git rev-parse HEAD^) ;; esac
          bash scripts/bench.sh --base "$BASE" --no-record

  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build workers/csharp
      - run: dotnet test workers/csharp

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # One extension package per platform, each with its own native binary and the C# worker, and a
  # check that the staged binary finds the worker without being told where it is.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            exe: sudsy
          - os: windows-latest
            target: win32-x64
            exe: sudsy.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p cli
      - run: dotnet publish workers/csharp/Sudsy.Worker -c Release -o "$RUNNER_TEMP/worker"
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run stage-server -- ../../target/release/${{ matrix.exe }} "$RUNNER_TEMP/worker"
        working-directory: editors/vscode
      - name: The staged server formats C# without SUDSY_CSHARP_WORKER
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          printf 'class  A{}\n' > "$RUNNER_TEMP/smoke/A.cs"
          cd "$RUNNER_TEMP/smoke"
          "$GITHUB_WORKSPACE/editors/vscode/server/${{ matrix.exe }}" format A.cs
          grep -q 'class A' A.cs
      - run: npm run package -- --target ${{ matrix.target }}
        working-directory: editors/vscode
      - uses: actions/upload-artifact@v7
        with:
          name: sudsy-${{ matrix.target }}
          path: editors/vscode/*.vsix
