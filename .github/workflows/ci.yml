name: CI

# Every push to main and every pull request runs the gates of scripts/gate.sh on Linux plus
# `cargo test` on Windows. Runs for a push to main are never cancelled; other refs cancel their
# previous run. The `CI ok` job is the one required check. release.yml reuses this workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides what to run: `code` is false for prose-only changes, `package` is false for changes that
  # cannot affect the extension packages (scripts/ci-changes.sh). Dispatch and tag runs do everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.c.outputs.code }}
      package: ${{ steps.c.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: c
        env:
          BASE: ${{ github.event.pull_request.base.sha || (github.event_name == 'push' && github.ref_type == 'branch' && github.event.before) || '' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci-changes.sh "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  dco:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: scripts/check-dco.sh ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

  # Linux: the full gate. Includes the worker contract tests, which build and run the C# worker;
  # the big dotnet/runtime corpus test is #[ignore]d and not fetched here.
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          # The plugin host's tests build tests/plugins/sample to a Wasm component.
          targets: wasm32-wasip2
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo xtask codegen --check
      - run: cargo fmt --manifest-path tests/plugins/sample/Cargo.toml -- --check
      - run: cargo test --manifest-path tests/plugins/sample/Cargo.toml

  # Windows: tests only. They build and run the worker there, so there is no separate Windows dotnet job.
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-wasip2
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace

  # Dependabot PRs only: tier 1 of scripts/bench.sh of every language against the PR base.
  bench:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    uses: ./.github/workflows/bench.yml
    with:
      base: ${{ github.event.pull_request.base.sha }}
      args: --all --no-record

  dotnet:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build workers/csharp
      - run: dotnet test workers/csharp

  vscode:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # One extension package per platform, each with its own native binary and the C# worker, and a
  # check that the staged binary finds the worker without being told where it is. Only when
  # packaging inputs changed (scripts/ci-changes.sh) or on dispatch.
  package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            exe: sudsy
          - os: windows-latest
            target: win32-x64
            exe: sudsy.exe
          - os: macos-latest
            target: darwin-arm64
            exe: sudsy
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release -p cli
      - run: dotnet publish workers/csharp/Sudsy.Worker -c Release -o "$RUNNER_TEMP/worker"
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run stage-server -- ../../target/release/${{ matrix.exe }} "$RUNNER_TEMP/worker"
        working-directory: editors/vscode
      - name: The staged server formats C# without SUDSY_CSHARP_WORKER
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          printf 'class  A{}\n' > "$RUNNER_TEMP/smoke/A.cs"
          cd "$RUNNER_TEMP/smoke"
          "$GITHUB_WORKSPACE/editors/vscode/server/${{ matrix.exe }}" format A.cs
          grep -q 'class A' A.cs
      - run: npm run package -- --target ${{ matrix.target }}
        working-directory: editors/vscode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sudsy-${{ matrix.target }}
          path: editors/vscode/*.vsix
          retention-days: 3

  # The one required check: green when every job that ran passed (skipped jobs are fine).
  ci:
    name: CI ok
    if: always()
    needs: [changes, dco, rust, windows, bench, dotnet, vscode, package]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
