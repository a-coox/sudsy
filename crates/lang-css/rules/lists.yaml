id: property-allowed-list
family: names
params: { target: property, mode: allowed }
message: "the property `{name}` is not allowed"
description: A property that is not in the `list` option (names, or `/regex/`). Custom properties are left out; an empty list allows everything.
example: "a { float: left }   # reported with list: [color]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The allowed properties: names, or `/regex/`." }
---
id: property-disallowed-list
family: names
params: { target: property, mode: disallowed }
message: "the property `{name}` is not allowed"
description: A property that is in the `list` option (names, or `/regex/`). Custom properties are left out.
example: "a { float: left }   # reported with list: [float]"
severity: off
