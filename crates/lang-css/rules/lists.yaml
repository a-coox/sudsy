id: selector-attribute-name-disallowed-list
family: names
params: { target: attribute, mode: disallowed }
message: "the attribute `{name}` is not allowed in a selector"
description: An attribute selector whose name is in the `list` option.
example: "a[style] {}   # reported with list: [style]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The disallowed attribute names: names, or `/regex/`." }
---
id: selector-disallowed-list
family: names
params: { target: selector, mode: disallowed }
message: "the selector `{name}` is not allowed"
description: "The selector list of a rule (whitespace collapsed) that is in the `list` option (selectors, or `/regex/`)."
example: "a b {}   # reported with list: [a b]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The disallowed selectors: text, or `/regex/`." }
---
id: selector-attribute-operator-allowed-list
