id: custom-property-pattern
family: names
params: { target: custom-property, mode: pattern }
message: "the custom property `--{name}` does not match the pattern"
description: "A custom property, as declared, used in `var()` or named by `@property`, whose name without the `--` does not match the `pattern` option (a regex). An empty pattern allows everything."
example: "a { --fooBar: 1 }   # reported with pattern: ^[a-z-]+$"
severity: off
category: style
options:
  - { name: pattern, type: regex, default: "", description: "The regex a custom property name, without its `--`, must match." }
