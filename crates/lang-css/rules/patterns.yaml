id: selector-class-pattern
family: names
params: { target: class, mode: pattern }
message: "the class `.{name}` does not match the pattern"
description: A class selector whose name does not match the `pattern` option (a regex). An empty pattern allows everything.
example: ".fooBar {}   # reported with pattern: ^[a-z-]+$"
severity: off
category: style
options:
  - { name: pattern, type: regex, default: "", description: The regex a class name must match. }
---
