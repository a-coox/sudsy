id: selector-max-class
family: max
params: { count: class }
message: "the selector has {count} classes (at most {max})"
description: A selector with more class selectors than the `max` option (the ones inside `:not()` and the like count).
example: ".a.b {}   # reported with max: 1"
severity: off
category: style
options:
  - { name: max, type: int, default: 0, description: The most classes a selector may have. }
