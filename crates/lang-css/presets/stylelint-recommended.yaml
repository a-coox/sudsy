# The rules of stylelint-config-recommended that Sudsy has, at stylelint's severity (error).
css:
  lint:
    rules:
      at-rule-no-deprecated: error
      at-rule-no-unknown: error
      block-no-empty: error
      color-no-invalid-hex: error
      comment-no-empty: error
      custom-property-no-missing-var-function: error
      declaration-block-no-duplicate-custom-properties: error
      declaration-block-no-duplicate-properties:
        level: error
        options:
          ignore_consecutive_different_values: true
      declaration-block-no-shorthand-property-overrides: error
      font-family-no-duplicate-names: error
      font-family-no-missing-generic-family-keyword: error
      function-calc-no-unspaced-operator: error
      function-linear-gradient-no-nonstandard-direction: error
      keyframe-block-no-duplicate-selectors: error
      keyframe-declaration-no-important: error
      media-feature-name-no-unknown: error
      media-type-no-deprecated: error
      named-grid-areas-no-invalid: error
      no-descending-specificity: error
      no-duplicate-at-import-rules: error
      no-duplicate-selectors: error
      no-empty-source: error
      no-invalid-double-slash-comments: error
      no-invalid-position-at-import-rule: error
      no-invalid-position-declaration: error
      property-no-deprecated: error
      property-no-unknown: error
      selector-anb-no-unmatchable: error
      selector-no-deprecated: error
      selector-pseudo-class-no-unknown: error
      selector-pseudo-element-no-unknown: error
      selector-type-no-unknown:
        level: error
        options:
          ignore: ["/-/"]
