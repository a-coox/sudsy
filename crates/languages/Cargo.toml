[package]
name = "languages"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
core-config.workspace = true
core-packs.workspace = true
core-patterns.workspace = true
core-plugins.workspace = true
core-rules.workspace = true
lang-csharp.workspace = true
lang-json.workspace = true
lang-yaml.workspace = true
lang-toml.workspace = true
lang-xml.workspace = true
lang-markdown.workspace = true
lang-editorconfig.workspace = true
lang-ini.workspace = true
lang-gitignore.workspace = true
lang-dockerfile.workspace = true
lang-powershell.workspace = true
lang-shell.workspace = true
