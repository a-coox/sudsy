provider-api.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# Grammars linked in (dev, tests, `cargo install`); without it the tree-sitter languages load from packs.
default = ["static-grammars"]
static-grammars = ["lang-toml/static-grammars", "lang-xml/static-grammars", "lang-markdown/static-grammars", "lang-editorconfig/static-grammars", "lang-ini/static-grammars", "lang-gitignore/static-grammars", "lang-dockerfile/static-grammars", "lang-powershell/static-grammars", "lang-shell/static-grammars"]

[lints]
workspace = true
