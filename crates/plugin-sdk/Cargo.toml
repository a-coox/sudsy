[package]
name = "plugin-sdk"
description = "SDK for Sudsy rule plugins (Wasm components): the Rule trait, the syntax tree, the flow API and the pattern matcher, plus the glue that exports a plugin."
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
core-config.workspace = true
core-flow.workspace = true
core-patterns.workspace = true
core-rules.workspace = true
core-semantics.workspace = true
core-syntax.workspace = true
rmp-serde.workspace = true
wit-bindgen = "0.63"
# Only for `plugin_sdk::testing`, which runs a rule natively against a real provider.
provider-api = { workspace = true, optional = true }
lang-csharp = { workspace = true, optional = true }
lang-json = { workspace = true, optional = true }
lang-yaml = { workspace = true, optional = true }

[features]
testing = ["dep:provider-api", "dep:lang-csharp", "dep:lang-json", "dep:lang-yaml"]

# wit-bindgen's generated glue is unsafe; everything else in the crate is not.
[lints.rust]
unsafe_code = "deny"
