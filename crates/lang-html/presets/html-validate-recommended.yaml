# The rules of html-validate:standard and of html-validate:recommended that Sudsy has, at error.
extends: [preset:html/html-validate-standard]
html:
  lint:
    rules:
      aria-hidden-body: error
      attr-case: error
      attr-delimiter: error
      attr-quotes: error
      attribute-boolean-style: error
      attribute-empty-style: error
      doctype-style: error
      element-case: error
      empty-heading: error
      empty-title: error
      long-title: error
      meta-refresh: error
      no-autoplay: error
      no-conditional-comment: error
      no-duplicate-class: error
      no-implicit-button-type: error
      no-implicit-close: error
      no-implicit-input-type: error
      no-inline-style: error
      no-redundant-for: error
      no-redundant-role: error
      no-self-closing: error
      no-trailing-whitespace: error
      prefer-button: error
      prefer-native-element: error
      prefer-tbody: error
      presentation-role-style: error
      text-content: error
      unique-landmark: error
      valid-id: error
      void-style: error
