id: no-inline-style
message: use a class and a stylesheet instead of a `style` attribute
description: A `style` attribute is a sign of unstructured CSS. `display` alone is allowed, because scripts toggle it.
example: '<p style="color: red">   <p class="red">'
severity: off
category: style
rule:
  kind: Attribute
  regex: '(?is)^style\s*='
  not: { regex: '(?is)^style\s*=\s*["'']?\s*display\s*:[^;"'']*;?\s*["'']?$' }
