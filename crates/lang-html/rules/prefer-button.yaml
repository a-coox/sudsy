id: prefer-button
message: use <button> instead of <input type="$TYPE">
description: A `<button>` can hold markup and is styled with CSS like any element; `<input type="button">` cannot.
example: '<input type="submit" value="Go">   <button type="submit">Go</button>'
severity: off
category: style
rule:
  kind: Attribute
  regex: '(?is)^type\s*=\s*["'']?\s*(?<TYPE>button|submit|reset|image)\s*["'']?$'
  parent: { kind: StartTag, regex: '(?i)^<input\b' }
