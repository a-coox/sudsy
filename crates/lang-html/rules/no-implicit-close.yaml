id: no-implicit-close
message: write the end tag of `<$NAME>`
description: >-
  An element whose end tag is left out is closed by the next sibling or its parent's end tag
  (`<li>`, `<p>`, ...). Writing the end tag says where it ends. Void and self-closed elements
  have none.
example: '<ul><li>a<li>b</ul>   <ul><li>a</li><li>b</li></ul>'
severity: off
category: style
rule:
  kind: Element
  regex: '^<(?<NAME>[^\s/>]+)'
  not-has: { kind: EndTag }
  not:
    any:
      - regex: '(?i)^<(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)\b'
      - child: { kind: StartTag, regex: '/>$' }
report-on: first-token
