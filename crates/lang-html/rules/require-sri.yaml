id: require-sri
message: a script or stylesheet needs an `integrity` attribute
description: >-
  A `<script src>` or `<link rel="stylesheet" href>` without `integrity` runs or applies a file
  that changed on its server (a CDN) without the page noticing.
example: '<script src="a.js"></script>   <script src="a.js" integrity="sha384-..." crossorigin="anonymous"></script>'
severity: off
category: suspicious
rule:
  kind: StartTag
  not-has: { kind: Attribute, regex: '(?i)^integrity\b' }
  any:
    - regex: '(?i)^<script\b'
      has: { kind: Attribute, regex: '(?i)^src\b' }
    - regex: '(?i)^<link\b'
      has: { kind: Attribute, regex: '(?is)^rel\s*=\s*["'']?\s*stylesheet\b' }
report-on: first-token
