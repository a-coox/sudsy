id: long-title
message: the title is longer than 70 characters
description: Search engines cut a title off after about 70 characters.
example: '<title>A title that goes on and on for far more than seventy characters in all, really</title>'
severity: off
category: style
rule:
  kind: Element
  regex: '(?is)^<title\b[^>]*>[^<]{71,}</title'
report-on: first-token
