id: element-name
family: meta
params: { check: element-name }
message: "<{name}> is neither an HTML element nor a valid custom element name"
description: >-
  A custom element name is lowercase letters, digits, `-`, `.` and `_`, and has a `-`, so that it
  never clashes with an element HTML adds later. Everything inside `<svg>` and `<math>` is left alone.
example: '<custom_el>   <custom-el>'
severity: off
category: correctness
