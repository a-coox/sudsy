id: element-case
message: element names are lowercase
description: >-
  Element names are case-insensitive in HTML; lowercase is the convention. Everything inside
  `<svg>` and `<math>` keeps its case. Reported on the name of a start or end tag.
example: '<DIV></DIV>   <div></div>'
severity: off
category: style
rule:
  any: [{ kind: StartTag }, { kind: EndTag }]
  not-inside: { kind: Element, regex: '(?i)^<(svg|math)\b' }
token: { kind: [TagName], regex: '[A-Z]' }
