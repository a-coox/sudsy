id: no-implicit-input-type
message: an <input> needs a `type`
description: An `<input>` without a `type` is a text field by default; writing the type says so.
example: '<input name="a">   <input type="text" name="a">'
severity: off
category: style
rule:
  kind: StartTag
  regex: '(?i)^<input\b'
  not-has: { kind: Attribute, regex: '(?i)^type\b' }
report-on: first-token
