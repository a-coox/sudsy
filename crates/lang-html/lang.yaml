grammar-crate: tree-sitter-html
grammar-path: grammars/tree-sitter-html
extensions: [html, htm]
formatter: HtmlFormatter
deps: [rowan]
options:
  - line_width: 80
  - indent_size: 2
  - indent_style
  - final_newline: true
  - end_of_line
  - whitespace_sensitivity:
      values: ["css", "strict", "ignore"]
      default: "css"
      doc: "Whether whitespace between inline elements and text is significant: `css` follows each element's CSS display, `strict` treats every element as inline, `ignore` as block."
  - bracket_same_line:
      default: false
      doc: "Put the `>` of a multi-line start tag at the end of the last attribute's line."
  - single_attribute_per_line:
      default: false
      doc: "Put every attribute of a tag that has several on its own line."
mapping:
  wrap: {Text: Chunk, Entity: Chunk, CData: Chunk, RawText: Chunk}
  same: 'document comment attribute text entity end_tag'
  StartTag: 'start_tag self_closing_tag'
  Element: element script_element style_element rcdata_element
  StrayEndTag: erroneous_end_tag
  Doctype: doctype
  DoctypeKw: '"doctype"'
  DoctypeBody: doctype_body
  TagName: 'tag_name erroneous_end_tag_name'
  AttrName: attribute_name
  AttrValue: 'attribute_value quoted_attribute_value'
  CData: cdata
  RawText: raw_text
