id: no-anonymous-operations
message: the operation has no name
description: An operation without a name (`{ a }`, `query { a }`), which tools that log, trace or cache by operation name cannot tell apart. Equivalent - graphql-eslint no-anonymous-operations.
example: "query {   # reported\n  a\n}"
severity: warn
category: suspicious
rule:
  kind: Operation
  regex: '^(query|mutation|subscription)?\s*[({@]'
report-on: first-token
