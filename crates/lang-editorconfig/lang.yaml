grammar-crate: konomanoasa-tree-sitter-editorconfig
grammar-version: "0.9"
file-names: [.editorconfig]
formatter: EditorConfigFormatter
hooks: hooks::EditorConfigHooks
dev-deps: [insta]
options:
  - final_newline: true
  - end_of_line
  - max_blank_lines: [1, "Largest number of blank lines kept between entries, sections and comments."]
mapping:
  same: 'document section section_header pair comment key value'
  Newline: line_ending
  LBracket: section_open
  RBracket: section_close
  Equals: assignment_operator
  Glob: pattern
