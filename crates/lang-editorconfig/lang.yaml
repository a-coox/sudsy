grammar-crate: konomanoasa-tree-sitter-editorconfig
grammar-version: "0.9"
file-names: [.editorconfig]
formatter: EditorConfigFormatter
hooks: hooks::EditorConfigHooks
dev-deps: [insta]
options:
  - final_newline: true
  - end_of_line
  - max_blank_lines: [1, "Largest number of blank lines kept between entries, sections and comments."]
presets: [default]
