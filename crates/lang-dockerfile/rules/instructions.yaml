id: workdir-absolute
message: 'WORKDIR should be an absolute path'
description: >-
  A WORKDIR whose path is not absolute (a leading `/`, a drive letter or a variable).
example: 'WORKDIR app'
severity: off
category: correctness
rule:
  kind: Instruction
  regex: '(?is)^workdir[ \t\r\n]+[^ \t\r\n]'
  not: { regex: '(?is)^workdir[ \t\r\n]+["'']?(?:[/$]|[A-Za-z]:)' }
---
id: no-latest-tag
message: 'pin the base image to a release tag, not latest'
description: >-
  A FROM image tagged `latest` (without a digest).
example: 'FROM alpine:latest'
severity: off
category: suspicious
rule:
  kind: Instruction
  regex: '(?is)^from[ \t\r\n]+(?:--[^ \t\r\n]+[ \t\r\n]+)*[^ \t\r\n@]*:latest(?:[ \t\r\n]|$)'
---
id: expose-port-range
message: 'valid ports range from 0 to 65535'
description: >-
  An EXPOSE with a port above 65535.
example: 'EXPOSE 70000'
severity: error
category: correctness
rule:
  kind: Instruction
  regex: '(?is)^expose[ \t\r\n](?:.*[[ \t\r\n]-])?(?:6553[6-9]|655[4-9][0-9]|65[6-9][0-9][0-9]|6[6-9][0-9]{3}|[7-9][0-9]{4}|[0-9]{6,})(?:[ \t\r\n]|/|$)'
---
id: json-cmd-entrypoint
message: 'use the JSON form for CMD and ENTRYPOINT'
description: >-
  A CMD, ENTRYPOINT or HEALTHCHECK CMD in shell form, which runs under `sh -c` and does not get signals.
example: 'CMD node server.js'
severity: warn
category: suspicious
rule:
  kind: Instruction
  regex: '(?is)^(?:cmd|entrypoint)[ \t\r\n]+[^\[[ \t\r\n]]'
  not: { parent: { regex: '(?is)^onbuild(?-u:\b)' } }
---
id: no-from-platform
message: 'do not set --platform on FROM'
description: >-
  A FROM with a fixed `--platform`; a variable such as `$BUILDPLATFORM` is fine.
example: 'FROM --platform=linux/amd64 alpine:3'
severity: off
category: suspicious
rule:
  kind: Instruction
  regex: '(?is)^from[ \t\r\n]+--platform='
  not: { regex: '(?is)^from[ \t\r\n]+--platform=[^ \t\r\n]*(?:BUILDPLATFORM|TARGETPLATFORM)' }
---
id: no-redundant-target-platform
message: 'the target platform is the default platform of FROM; drop the option'
description: >-
  A FROM with `--platform=$TARGETPLATFORM`, which is what it does without the option.
example: 'FROM --platform=$TARGETPLATFORM alpine:3'
severity: off
category: cleanup
rule:
  kind: Instruction
  regex: '(?is)^from[ \t\r\n]+--platform=\$\{?TARGETPLATFORM\}?(?:[ \t\r\n]|$)'
---
id: no-nested-onbuild
message: 'ONBUILD cannot trigger ONBUILD, FROM or MAINTAINER'
description: >-
  An ONBUILD whose instruction is ONBUILD, FROM or MAINTAINER.
example: 'ONBUILD FROM alpine'
severity: error
category: correctness
rule:
  kind: Instruction
  regex: '(?is)^onbuild(?-u:\b)'
  child: { kind: Instruction, regex: '(?is)^(?:onbuild|from|maintainer)(?-u:\b)' }
---
id: no-reserved-stage-name
message: 'the stage name is a reserved word'
description: >-
  A stage named `scratch` or `context`.
example: 'FROM alpine:3 AS scratch'
severity: warn
category: suspicious
rule:
  kind: Instruction
  regex: '(?is)^from[ \t\r\n].*[ \t\r\n]as[ \t\r\n]+(?:scratch|context)[ \t\r\n]*$'
---
id: no-maintainer
message: 'MAINTAINER is deprecated; use LABEL maintainer=...'
description: >-
  A MAINTAINER instruction.
example: 'MAINTAINER a@b.c'
category: cleanup
rule:
  kind: Instruction
  regex: '(?is)^maintainer(?-u:\b)'
---
id: no-copy-whole-stage
message: 'do not copy an entire filesystem from another stage'
description: >-
  A `COPY --from` with `/` as a source and as the target.
example: 'COPY --from=build / /'
severity: off
category: suspicious
rule:
  kind: Instruction
  regex: '(?is)^copy[ \t\r\n].*--from=[^ \t\r\n].*[ \t\r\n]["'']?/["'']?(?:[ \t\r\n]+[^ \t\r\n]+)*?[ \t\r\n]+["'']?/["'']?[ \t\r\n]*$'
---
id: copy-instead-of-add
message: 'use COPY instead of ADD for files and folders'
description: >-
  An ADD with no URL and no archive (`.tar`, `.gz`, `.tgz`, `.xz` and the like) among its arguments,
  which ADD would extract or download.
example: 'ADD app.js /app/'
severity: off
category: suspicious
rule:
  kind: Instruction
  regex: '(?is)^add[ \t\r\n]'
  not:
    regex: '(?i)(?:(?-u:\b)https?://|\.(?:tar|z|bz2|gz|lz|lzma|tz|tb2|tbz|tbz2|tgz|tlz|tpz|txz|xz)["'']?(?:[ \t\r\n]|$))'
---
id: copy-many-needs-directory
message: 'COPY with several sources needs a target ending in /'
description: >-
  A COPY with more than one source whose last argument does not end with `/`.
example: 'COPY a b /app'
severity: error
category: correctness
rule:
  kind: Instruction
  all:
    - regex: '(?is)^copy[ \t\r\n]+(?:--[^ \t\r\n]+[ \t\r\n]+)*[^ \t\r\n\[-][^ \t\r\n]*[ \t\r\n]+[^ \t\r\n]+[ \t\r\n]+(?:[^ \t\r\n]+[ \t\r\n]+)*[^ \t\r\n]*[^/ \t\r\n][ \t\r\n]*$'
    - not: { regex: '<<' }
---
id: numeric-user-id
message: 'a non-numeric user may not be resolvable by the host; use a numeric id'
description: >-
  A USER that is a name rather than a numeric id (a variable is accepted).
example: 'USER app'
severity: off
category: suspicious
rule:
  kind: Instruction
  regex: '(?is)^user[ \t\r\n]+[^ \t\r\n]'
  not: { regex: '(?is)^user[ \t\r\n]+["'']?(?:[0-9]+(?:[:"''[ \t\r\n]]|$)|\$)' }
---
id: no-secret-in-env
message: 'potentially sensitive data should not be set with ARG or ENV'
description: >-
  An ARG or ENV whose name contains `api_key`, `client_key`, `password`, `private`, `secret`, `token`
  or `username`, or is a well-known credential variable. Build secrets belong in `--mount=type=secret`.
example: 'ENV DB_PASSWORD=x'
severity: warn
category: suspicious
rule:
  kind: Instruction
  any:
    - regex: '(?is)^arg[ \t\r\n]+[A-Za-z0-9_]*(?:api_key|client_key|password|private|secret|token|username)[A-Za-z0-9_]*(?:[= \t\r\n]|$)'
    - regex: '(?is)^env[ \t\r\n]+(?:[A-Za-z0-9_]+=[^ \t\r\n]*[ \t\r\n]+)*[A-Za-z0-9_]*(?:api_key|client_key|password|private|secret|token|username)[A-Za-z0-9_]*[= \t\r\n]'
    - regex: '(?s)^(?i:arg|env)[ \t\r\n]+(?:[A-Za-z0-9_]+=[^ \t\r\n]*[ \t\r\n]+)*(?:APPLICATION_KEY|AWS_ACCESS_KEY_ID|CI_DEPLOY_USER|DOCKER_EMAIL|FACEBOOK_APP_ID|HEROKU_API_USER|OKTA_AUTHN_GROUPID|OKTA_CLIENT_ORGURL|OKTA_OAUTH2_CLIENTID|STRIPE_DEVICE_NAME|TRAVIS_OS_NAME|TRAVIS_SECURE_ENV_VARS|TRAVIS_SUDO)(?:[= \t\r\n]|$)'
