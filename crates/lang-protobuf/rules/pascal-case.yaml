id: message-pascal-case
message: 'message names are PascalCase'
description: >-
  A message name that is not PascalCase (buf lint MESSAGE_PASCAL_CASE).
example: 'message foo_bar {}'
severity: off
category: style
rule: { kind: MessageName, not: { regex: '^[A-Z][A-Za-z0-9]*$' } }
