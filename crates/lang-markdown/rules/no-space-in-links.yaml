id: no-space-in-links
message: the link text has spaces inside its brackets
description: >-
  Link text that starts or ends with a space (markdownlint MD039).
example: '[ docs ](url)   # [docs](url)'
severity: warn
category: style
rule:
  kind: Link
  regex: '^\[(?:[ \t]+[^\]]|[^\]]*[^\]\s][ \t]+\])'
