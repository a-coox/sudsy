id: no-trailing-punctuation
message: the heading ends with punctuation
description: >-
  A heading that ends with `.`, `,`, `;`, `:` or `!` (or the full-width forms) reads as a
  sentence, not a title (markdownlint MD026). `?` is allowed.
example: '# Introduction.   # Introduction'
severity: off
category: style
rule:
  kind: Heading
  regex: '[.,;:!。，；：！]$'
