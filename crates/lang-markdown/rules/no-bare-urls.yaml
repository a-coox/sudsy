id: no-bare-urls
message: wrap the URL in <> or write a link
description: >-
  A URL that is neither a link nor an autolink (markdownlint MD034), found when it follows a
  space or starts the paragraph. Reported on the paragraph.
example: 'See https://example.com   # See <https://example.com>'
severity: warn
category: style
rule:
  kind: Inline
  regex: '(?:^|\s)https?://[^\s<>]'
  not-inside:
    kind: Heading
