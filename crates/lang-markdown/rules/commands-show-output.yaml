id: commands-show-output
message: the code block has $ prompts and no output; drop the $ or show the output
description: >-
  A fenced code block in which every line starts with `$ ` shows commands without their output,
  which makes copying them awkward (markdownlint MD014).
example: 'a code block with the lines   $ npm install   $ npm test'
severity: off
category: style
rule:
  kind: FencedCode
  regex: '\A(?:`{3,}|~{3,})[^\n]*\n(?:[ \t]*\$[ \t][^\n]*\n|[ \t]*\n)+[ \t]*(?:`{3,}|~{3,})'
