grammar-crate: tree-sitter-ini
grammar-path: grammars/tree-sitter-ini
extensions: [ini, cfg]
file-names: [.gitconfig, .gitmodules]
formatter: IniFormatter
dev-deps: [insta]
options:
  - final_newline: true
  - end_of_line
  - space_around_equals:
      default: true
      doc: "Write `key = value` rather than `key=value`."
  - max_blank_lines: [1, "Largest number of blank lines kept between settings, sections and comments."]
presets: [default]
