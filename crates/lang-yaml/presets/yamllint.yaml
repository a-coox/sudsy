# yamllint's default configuration: output that satisfies it (two spaces before an inline comment,
# at most two blank lines, sequences indented) and the lint levels it sets.
yaml:
  format:
    line_width: 80
    indent_size: 2
    sequence_indent: indented
    max_blank_lines: 2
    comment_spacing: 2
    end_of_line: lf
    bracket_spacing: false
  lint:
    rules:
      max-line-length:
        level: error
        options:
          max: 80
          allow_non_breakable_words: true
      ambiguous-booleans:
        level: warn
        options:
          check_keys: true
          allowed: []
      no-undefined-alias: error
      document-start: warn
      comment-space: warn
      sorted-keys:
        level: off
        options:
          report: misplaced
