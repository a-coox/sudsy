# Formats like Prettier's YAML output: 80 columns, sequences indented below their key, double
# quotes unless the text contains one, no blank line between a key and its block value.
yaml:
  format:
    line_width: 80
    indent_size: 2
    sequence_indent: indented
    quote_style: prefer_double
    document_start: preserve
    max_blank_lines: 1
    blank_lines_after_key: remove
