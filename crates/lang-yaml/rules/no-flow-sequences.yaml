id: no-flow-sequences
message: flow sequences are not allowed
description: "A flow sequence (`[a, b]`); write a block sequence instead."
example: "list: [1, 2]   # reported; write one `- item` per line"
severity: off
category: style
options:
  - { name: allow_empty, type: bool, default: false, description: "Do not report empty collections (`{}`, `[]`)." }
rule:
  kind: FlowSequence
  not: { option: allow_empty, regex: '^\[(?:\s|#[^\r\n]*)*\]$' }
report-on: first-token
