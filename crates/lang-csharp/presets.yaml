# The presets of the C# provider: `extends: [preset:csharp/<name>]`. A preset only sets options of
# the provider (see `sudsy config print` or schemas/sudsy.schema.json for what each does), so a
# sudsy.yaml that spells the same options out formats identically. Presets are versioned: change
# a preset by adding `@2`, never by editing `@1`.

# Microsoft's C# coding conventions: Allman braces, four spaces. These are the defaults of every
# option, so the preset sets nothing.
microsoft@1: {}

# The dotnet/runtime coding style: Microsoft's layout, except that a short accessor body stays on
# the accessor's line (`get { return _count; }`).
dotnet-runtime@1:
  inline_accessor_bodies: true

# Google's C# style guide: two spaces, 100 columns, braces on the line of the header, `} else {`,
# `{}` for an empty body, trailing commas in multi-line lists.
google@1:
  line_width: 100
  indent_size: 2
  brace_newline: none
  trailing_commas: multiline
  wrapped_brace_line: none
  clause_keyword_line: same_line
  empty_braces: tight

# Formats like CSharpier 1.x, for migrating without reformat churn.
csharpier-compat@1:
  line_width: 100
  trailing_commas: multiline
  blank_lines_between_members: separate
  accessor_blank_lines: remove
  inline_accessor_bodies: true
  indent_switch_section_block: false
  assignment_layout: fluid
  switch_arm_layout: assignment
  indent_nested_binary: true
  member_chain_keep_accesses: true
  member_chain_break_on_block: true
  wrapped_brace_line: all
  initializer_collapse: always
  lambda_argument_hug: sole
  constructor_initializer_line: new_line
  base_list_layout: hanging
  unbreakable_single_item_lists: true
  do_while_line: same_line
