id: no-empty-delegate-parens
message: the anonymous method has an empty parameter list
description: >-
  An anonymous method with an empty parameter list: `delegate() { }` is `delegate { }`. Parentheses
  with a comment in them are left alone. The fix is unsafe: without a parameter list the method
  also converts to delegate types that have parameters, which can change which overload is chosen.
example: "Action a = delegate() { };   // write: delegate { }"
severity: off
category: style
rule:
  kind: ParameterList
  regex: '^\(\s*\)$'
  parent: { kind: AnonymousMethodExpression }
report-on: first-token
fix: ""
fix-trim-before: true
fix-title: Remove the parentheses
fix-kind: unsafe
