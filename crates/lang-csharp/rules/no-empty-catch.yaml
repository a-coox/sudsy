id: no-empty-catch
message: empty catch block swallows the exception
description: A catch block with no statements and no comment swallows the exception silently.
example: "try { Run(); } catch (Exception) { }   // add handling, or a comment saying why not"
severity: warn
category: suspicious
rule:
  kind: CatchClause
  child: { kind: Block, regex: '^\{[ \t\r\n]*\}$' }
report-on: first-token
