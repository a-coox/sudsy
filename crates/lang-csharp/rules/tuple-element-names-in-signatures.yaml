id: tuple-element-names-in-signatures
language: csharp
family: finding
params: { check: unnamed_tuple_element }
message: "tuple elements in a signature should have names"
description: "A tuple type in the signature of a method, constructor, property, indexer, conversion operator or delegate whose elements have no names. Overrides and implementations of interface members are left alone (their names are not the member's to choose). No fix."
example: "(int, int) Pair();   // write: (int x, int y) Pair();"
severity: off
category: style
requires: [types]
