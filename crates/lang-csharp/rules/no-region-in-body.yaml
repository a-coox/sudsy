id: no-region-in-body
language: csharp
message: do not place regions within elements
description: >-
  A `#region` inside a block (a method, accessor or lambda body, or any block in one); regions
  belong between members. No fix.
example: "void M() {\n#region Setup   // move the region out of the body\n}"
severity: off
category: style
rule:
  kind: RegionDirectiveTrivia
  inside: { kind: Block }
report-on: first-token
