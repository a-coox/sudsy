id: doc-typeparam-has-text
language: csharp
family: doc-element
params: { check: text, element: typeparam, scope: generic, skip-inheritdoc: true, report: element }
message: "the <typeparam> should have text"
description: "A `<typeparam>` without text (`<typeparam name=\"T\" />` counts), in the documentation of a generic class, struct, interface, method or delegate. No fix."
example: "/// <typeparam name=\"T\"></typeparam>   // describe the type parameter\nvoid Add<T>() { }"
severity: off
category: style
