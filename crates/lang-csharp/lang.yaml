options:
  - line_width: 120
  - indent_size: 4
  - indent_style
  - final_newline: true
  - end_of_line
  - brace_newline:
      values: ["all", "none"]
      default: "all"
      doc: "Opening braces of types, members, blocks and lambdas: `all` puts each on its own line (Allman); `none` keeps it on the line of the declaration or statement."
  - brace_same_line:
      kind: "words"
      doc: "Elements whose opening brace stays on the line of the declaration or statement although `brace_newline` is `all`: `types`, `methods`, `properties`, `accessors`, `anonymous_methods`, `anonymous_types`, `control_blocks`, `lambdas`, `object_collection_array_initializers` (types include namespaces, methods include constructors, operators and local functions, properties include indexers and events, control blocks include `switch` statements and bare blocks)."
  - trailing_commas:
      values: ["preserve", "never", "multiline"]
      default: "preserve"
      doc: "Trailing comma after the last element of initializers, collection expressions, enums and switch expressions: `preserve` keeps what the source has; `never` removes it; `multiline` adds one when the list is on several lines and removes it otherwise."
  - member_chain_min_calls:
      range: [1, 1000]
      default: 3
      doc: "A chain of member accesses and calls with at least this many calls is broken one call per line when it does not fit on a line."
  - preprocessor_symbols:
      kind: "words"
      doc: "Conditional compilation symbols (`DEBUG`, `NET8_0`) defined when parsing, which decide the active branch of `#if`. Branches that are inactive under these symbols stay as they are unless `preprocessor_symbol_sets` or `derive_symbol_sets` format them."
  - preprocessor_symbol_sets:
      kind: "word-sets"
      doc: "Further sets of conditional compilation symbols. The file is also parsed with each set (a set replaces `preprocessor_symbols`), and the `#if` branches that are inactive under `preprocessor_symbols` but active under a set are formatted from that parse. Empty (the default) leaves inactive branches as they are."
  - derive_symbol_sets:
      default: false
      doc: "Also parse with sets of symbols taken from the `#if` and `#elif` conditions of the file (the empty set, all symbols, then each symbol, then pairs and so on, at most 16 sets, after those of `preprocessor_symbol_sets`) until every branch has been active once, and format the branches that are inactive under `preprocessor_symbols` from those parses. A branch no set activates stays as it is."
  - blank_lines_between_members:
      values: ["preserve", "separate", "always"]
      default: "preserve"
      doc: "Blank lines between the members of a type, namespace or enum: `preserve` keeps the source's (at most one) and never adds one; `separate` also requires one between two members when either has a body, an attribute or a comment above it; `always` requires one between any two members of a type or namespace and between the `using` directives and what follows them, except between two fields or two `using` directives (enum members as `separate`)."
  - accessor_blank_lines:
      values: ["preserve", "remove"]
      default: "preserve"
      doc: "Blank lines between the accessors of a property that is laid out on several lines: `preserve` keeps the source's (at most one); `remove` drops them."
  - collection_blank_lines:
      values: ["preserve", "remove"]
      default: "preserve"
      doc: "Blank lines between the elements of a collection initializer, array initializer or collection expression: `preserve` keeps the source's (at most one); `remove` drops them. The members of an object initializer keep theirs."
  - inline_accessor_bodies:
      default: false
      doc: "Keep the body of an accessor on its line (`get { return x; }`) when it is one simple statement without comments and fits; otherwise the braces go on their own lines."
  - preserve_single_line_blocks:
      default: false
      doc: "A block written on one line (`void M() { return; }`, `get { return x; }`,              `if (a)` followed by `{ b(); }`) stays on one line, as `{ a; b; }`, when it has no comment and no label in it. Type, namespace, enum and `switch` bodies written on one line stay as well."
  - preserve_single_line_statements:
      default: false
      doc: "Statements written on one line stay there: `a(); b();` in a sequence, `case 1:              break;`, and a whole `if`, `while`, `for`, `foreach`, `do`, `try`, `using`, `lock`,              `fixed`, `checked` or `unsafe` statement (with its blocks) written on one line,              unless it has a comment, a `switch` or a label in it."
  - indent_switch_section_block:
      default: true
      doc: "Indent a block that is the only statement of a `case` section below its label; when false the block starts at the label's indentation."
  - assignment_layout:
      values: ["compact", "fluid"]
      default: "compact"
      doc: "Where the value after `=` or the body after `=>` goes when the line is too long: `compact` moves a binary expression, a conditional or a query to the next line and leaves any other value on the line; `fluid` also moves strings, collection expressions and property initializers, and any other value whose first line does not fit after the operator; a string that spans lines stays on the operator's              line, and the body of an expression lambda moves below `=>` when the lambda does              not fit."
  - switch_arm_layout:
      values: ["inline", "assignment"]
      default: "inline"
      doc: "Layout of a switch expression arm: `inline` keeps `pattern => value` as one run of tokens; `assignment` lays out the value like the right-hand side of `=` (see `assignment_layout`)."
  - indent_nested_binary:
      default: false
      doc: "Indent the operands of a binary expression that is itself an operand of a binary expression with an operator of another precedence (`a && b || c`)."
  - member_chain_keep_accesses:
      default: false
      doc: "In a broken member chain a property access stays on the line of the call after it (`.A.B()` is one group) instead of starting a line of its own."
  - member_chain_break_on_block:
      default: false
      doc: "Break a member chain one call per line when a call other than the last has an argument with a block body (a lambda), even if the chain would fit."
  - wrapped_brace_line:
      values: ["creation", "all", "none"]
      default: "creation"
      doc: "Opening brace of an initializer or property pattern that is laid out on several lines: `creation` puts it on its own line for `new T { ... }` only; `all` also for an initializer nested in an assignment (`Prop = { ... }`) and for property patterns; `none` keeps it on the line of the expression."
  - initializer_collapse:
      values: ["preserve", "always"]
      default: "preserve"
      doc: "Initializers and collection expressions: `preserve` keeps one expanded when the source has a line break in it; `always` puts one on a single line whenever it fits."
  - preserve_query_breaks:
      default: false
      doc: "A query expression with a line break in the source keeps one clause per line even when it fits on a line."
  - initializer_expand:
      values: ["fit", "crowded"]
      default: "fit"
      doc: "Initializers (and anonymous types) that fit on a line: `fit` keeps them on it; `crowded` puts one item per line when there are three or more member assignments, or two or more items one of which creates an object with an initializer."
  - lambda_argument_hug:
      values: ["last", "sole"]
      default: "last"
      doc: "A lambda argument whose body can hang from the call's line: `last` hugs a block lambda that is the last argument; `sole` hugs a lambda (block or expression) only when it is the only argument."
  - constructor_initializer_line:
      values: ["same_line", "new_line"]
      default: "same_line"
      doc: "The `: base(...)` or `: this(...)` initializer of a constructor: `same_line` keeps it after the parameter list; `new_line` puts it on its own indented line."
  - parameter_attribute_layout:
      values: ["inline", "hanging"]
      default: "inline"
      doc: "A parameter with attribute lists: `inline` keeps them in front of the parameter;              `hanging` keeps them there when the parameter fits and otherwise puts the rest of              the parameter on an indented line below them."
  - base_list_layout:
      values: ["inline", "hanging"]
      default: "inline"
      doc: "The base list of a type (`: A, B`): `inline` keeps it on the line of the type name; `hanging` keeps it there when it fits and otherwise starts a line, with one base type per line."
  - unbreakable_single_item_lists:
      default: false
      doc: "Never break a list that holds one simple item: an attribute list with one attribute, a type argument list with one name, an index that is one name or literal."
  - do_while_line:
      values: ["new_line", "same_line"]
      default: "new_line"
      doc: "The `while` of a `do` statement: `new_line` starts a line; `same_line` follows the closing brace (`} while (x);`)."
  - clause_keyword_line:
      values: ["new_line", "same_line"]
      default: "new_line"
      doc: "`else`, `catch` and `finally` after a block: `new_line` starts a line; `same_line` follows the closing brace (`} else {`) unless a comment sits between them."
  - else_line:
      values: ["inherit", "new_line", "same_line"]
      default: "inherit"
      doc: "`else` after a block: `new_line` starts a line; `same_line` follows the closing brace; `inherit` takes `clause_keyword_line`."
  - catch_line:
      values: ["inherit", "new_line", "same_line"]
      default: "inherit"
      doc: "`catch` after a block: `new_line` starts a line; `same_line` follows the closing brace; `inherit` takes `clause_keyword_line`."
  - finally_line:
      values: ["inherit", "new_line", "same_line"]
      default: "inherit"
      doc: "`finally` after a block: `new_line` starts a line; `same_line` follows the closing brace; `inherit` takes `clause_keyword_line`."
  - label_indent:
      values: ["no_change", "one_less", "flush_left"]
      default: "no_change"
      doc: "Indentation of a `goto` label: `no_change` keeps the indentation of the statements around it; `one_less` indents it one level less; `flush_left` puts it in column 0."
  - empty_braces:
      values: ["space", "tight", "expanded"]
      default: "space"
      doc: "Braces with nothing between them: `space` prints `{ }`, `tight` prints `{}`, `expanded` puts the closing brace of an empty body on the line after the opening one (initializers, and lambdas and anonymous methods, stay `{ }`)."
  - closing_paren_line:
      values: ["own_line", "same_line"]
      default: "own_line"
      doc: "The `)` of a parameter, argument or attribute argument list that does not fit on one line: `own_line` puts it on a line of its own after the last item; `same_line` right after the last item."
  - blank_lines_after_block:
      values: ["preserve", "require"]
      default: "preserve"
      doc: "Blank line after a statement, member or switch section that ends with a closing brace: `preserve` keeps the source's (at most one); `require` adds one before the next statement, member or section."
  - blank_line_before_comment:
      values: ["preserve", "require"]
      default: "preserve"
      doc: "Blank line between a statement, member or switch section and a `//` comment on the lines before the next one (not `////`): `preserve` keeps the source's; `require` adds one."
  - blank_line_after_comment:
      values: ["preserve", "remove"]
      default: "preserve"
      doc: "Blank line between the last `//` or `///` comment in front of code and that code: `preserve` keeps the source's (at most one); `remove` drops it. Comments at the start of a file and `////` comments keep theirs."
  - space_after_delegate:
      default: true
      doc: "A space between `delegate` and the parameter list of an anonymous method (`delegate (int x) { }`); when false `delegate(int x) { }`."
  - space_between_empty_for_clauses:
      default: false
      doc: "A space between the two semicolons of a `for` with an empty condition (`for (; ;)`); when false `for (;;)`."
  - space_after_empty_last_for_clause:
      default: false
      doc: "A space before the `)` of a `for` whose last clause is empty (`for (int i = 0; i < n; )`); when false `for (int i = 0; i < n;)`."
  - sort_usings:
      default: false
      doc: "Sort `using` directives like the `using-order` rule with `compare: culture_ignore_case`, `static_position: after` and `alias_position: after` (System first, then the others, `using static`, aliases), and join the groups: blank lines between directives go, comments above a directive move with it. `global using` directives come first, `using global::X` behind the System ones. `#if` regions stay as they are behind the sorted directives; a list with another preprocessor directive is left alone."
  - sort_usings_system_first:
      default: true
      doc: "With `sort_usings`: `System` namespaces come before the others (`using static System.*` before other `using static`)."
  - separate_using_groups:
      default: false
      doc: "With `sort_usings`: one blank line between the System usings and the others (only with `sort_usings_system_first`)."
presets: [microsoft, dotnet-runtime, google, csharpier-compat, stylecop]
