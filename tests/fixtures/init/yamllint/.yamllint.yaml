extends: default
ignore: |
  vendor/
rules:
  line-length:
    max: 120
    level: warning
    allow-non-breakable-inline-mappings: true
  indentation:
    spaces: 4
    indent-sequences: false
  truthy:
    allowed-values: ['true', 'false', 'on']
    check-keys: false
  document-start: disable
  comments:
    min-spaces-from-content: 1
    require-starting-space: true
  braces:
    min-spaces-inside: 1
    max-spaces-inside: 1
  empty-lines:
    max: 1
  new-lines:
    type: unix
  key-ordering: enable
  key-duplicates:
    forbid-duplicated-merge-keys: true
  quoted-strings:
    quote-type: single
  trailing-spaces: disable
  colons:
    max-spaces-after: 2
  anchors:
    forbid-undeclared-aliases: false
    forbid-duplicated-anchors: true
    forbid-unused-anchors: true
  brackets:
    min-spaces-inside: 0
  float-values: enable
  octal-values: {level: warning}
  empty-values: enable
  new-line-at-end-of-file: disable
  foo-bar: enable
