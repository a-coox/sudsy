differences:
  subst-indent: choice  the lines of a multi-line `$(...)` or `<(...)` keep the source indentation; shfmt re-indents them
  array-indent: choice  array elements on several lines keep the source indentation; shfmt re-indents them
  array-pipeline: gap  an array whose elements are a backslash-continued pipeline is kept as written
  blanks-inside: choice  the blanks inside `(( ))`, `$(( ))`, `$( cmd )`, `<( cmd )`, `$(< f)` and `[[ ]]` are kept; shfmt removes or sets them
  expr-kept: choice  an expression written on one line is kept as written (`$(a ; b)`, `$((N+1))`, `${v//x/}`, `||:`); shfmt re-lays and respaces it
  backticks: choice  backticks are kept (the formatter never changes tokens; the rule `no-backticks` fixes them); shfmt rewrites them to `$(...)`
  heredoc-tabs: choice  the tabs of a `<<-` heredoc body are kept; shfmt re-indents them
  comment-column: choice  a trailing comment keeps the blanks of the source before it; shfmt keeps its column
  continued-conditions: gap  an `if`/`elif` condition, a `case` arm or a case pattern continued with `\` or over several lines with comments is kept as written
  case-last-arm: choice  a last `case` arm without `;;` is kept (the formatter never adds tokens); shfmt adds it
  case-in-if-indent: gap  the arms of a `case` used as an `if` condition are not indented a level further
  empty-file: choice  a file of one empty line becomes an empty file; shfmt keeps the line
