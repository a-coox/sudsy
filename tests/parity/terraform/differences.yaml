differences:
  interpolation-in-list: choice  terraform fmt unwraps `"${x}"` only as a whole argument; the rule `deprecated-interpolation` also fixes it inside a list
  semantic-error: choice  terraform rejects a file for a semantic error (a repeated plugin name); Sudsy formats it
  token-rewrite: choice  terraform fmt rewrites tokens (it quotes a bare block label, `list` becomes `list(any)`); Sudsy keeps the tokens
files:
