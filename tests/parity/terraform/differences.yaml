  corpus/packer/hcl2template/testdata/build/provisioner_build_name_interpolation.pkr.hcl: interpolation-in-list
  corpus/packer/hcl2template/testdata/init/duplicate_required_plugins/packer.pkr.hcl: semantic-error
  corpus/terraform/internal/command/testdata/fmt/general_in.tf: token-rewrite
  corpus/terraform/internal/command/testdata/fmt/variable_type_in.tf: token-rewrite
  corpus/terraform/internal/configs/testdata/valid-files/variables.tf: token-rewrite
