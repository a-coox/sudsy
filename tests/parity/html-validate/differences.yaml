  id-pattern-values: "gap  `attribute-allowed-values` does not check values that the metadata gives as a pattern (`id`), only listed values; `valid-id` reports an invalid id"
  aria-hidden: "gap  html-validate skips what is inside an `aria-hidden` element; `input-missing-label` does not"
