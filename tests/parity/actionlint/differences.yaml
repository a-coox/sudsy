differences:
  script-line: choice  a script rule is reported at the line of the text of a block scalar; actionlint reports it at the line of the `|`
  needs-location: choice  an unknown `needs` entry is reported at the entry; actionlint reports it at the job
  self-hosted-labels: choice  a job with `self-hosted` is not checked for custom runner labels; actionlint wants them in its config
