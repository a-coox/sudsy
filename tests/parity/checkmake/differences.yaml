differences:
  empty-recipe: "choice  a rule with an explicit empty recipe (`$(OBJS): ;`) has a body; checkmake reads it as none"
  target-specific-variable: choice  a target-specific variable assignment is a variable; checkmake does not read it as one
  double-colon-rule: choice  a repeated `::` rule is allowed, as make does; checkmake reports it
  multi-target-rule: choice  each target of a rule like `c d:` is checked on its own; checkmake reads one target named `c d`
