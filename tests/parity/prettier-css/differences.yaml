differences:
  no-formatter: gap  the css, scss and less formatters are not built yet, and the .css fixtures that hold SCSS or Less syntax on purpose are parse failures
  project-options: gap  real-world projects run under Prettier's defaults (`--no-config`), not their own Prettier options; the corpus fetches no config files and Sudsy's CSS options are not mapped yet
files:
  prettier-css: no-formatter
  prettier-scss: no-formatter
  prettier-less: no-formatter
  real-world: no-formatter, project-options
ratchet:
  prettier-css: 0
  prettier-scss: 0
  prettier-less: 0
  real-world: 0
