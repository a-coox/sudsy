differences:
  scss-layout: gap  SCSS maps with a group as key or a comment inside, `@include` with comment arguments, `with (...)` configurations in a nested block, selectors with `#{ }` blanks, `if()` with `;` arguments and `.css` fixtures that hold such SCSS syntax on purpose
  less-mixin-calls: gap  Less mixin calls and `each()` with `{ }` arguments, mixin guards with lookups, long `:extend()` lists and inline JavaScript are kept as written
  comments: gap  a comment inside a selector, between property and value or in at-rule parameters keeps the statement as written, where Prettier moves the comment
  value-math: gap  math inside `url()` is not normalized, `[a=#{$b}]` is not quoted (the safety check compares selectors token by token)
  front-matter: gap  front matter blocks, `@custom-selector` and `@nest` are not understood
  project-options: gap  real-world projects run under Prettier's defaults (`--no-config`), not their own Prettier options; the corpus fetches no config files and Sudsy's CSS options are not mapped yet
