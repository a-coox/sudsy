differences:
  scss-layout: gap  SCSS maps, the arguments of `@include`, `@mixin` and `@function`, control-flow expressions and `@else` after `}` are kept as written (and `.css` fixtures that hold such SCSS syntax on purpose); not laid out yet
  less-layout: gap  Less mixin call arguments, guards, detached rulesets and `each()` bodies are kept as written; not laid out yet
  comments: gap  a comment inside a selector, between property and value or in at-rule parameters keeps the statement as written, where Prettier moves the comment
  value-math: gap  spaces around the operators of values (`+`, `-`, `/` outside calc(), math in parentheses) and numbers like `1.` are not normalized
  front-matter: gap  front matter blocks, `@custom-selector`, `@nest` and brace values of custom properties are not understood
  project-options: gap  real-world projects run under Prettier's defaults (`--no-config`), not their own Prettier options; the corpus fetches no config files and Sudsy's CSS options are not mapped yet
files:
  prettier-css: scss-layout, comments, value-math, front-matter
  prettier-scss: scss-layout, comments, value-math
  prettier-less: less-layout, comments, value-math
  real-world: scss-layout, less-layout, project-options
ratchet:
  prettier-css: 99
  prettier-scss: 28
  prettier-less: 17
  real-world: 430
