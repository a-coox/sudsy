# The Sudsy side of the comparison with .yamllint.
lint:
  rules:
    document-start: warn
    max-line-length:
      level: warn
      options:
        max: 30
    ambiguous-booleans: warn
    no-duplicate-keys:
      level: error
      options:
        merge_keys: forbid
    sorted-keys:
      level: warn
      options:
        ignored_keys: ["^_"]
