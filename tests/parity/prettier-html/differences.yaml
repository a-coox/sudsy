differences:
  embedded-code: gap  embedded code the JS and CSS formatters print differently from Prettier (directive quotes, `<!--` comments, line breaks of call chains and templates), `<html:script>` and `<style type="text/less">`, which Sudsy reads as other languages
  glued-inline-unit: gap  text, an inline element and text written without blanks between (`a"<b>x</b>".`) are not kept together on one line when they are too wide; the element's tags break inside
  conditional-comments: gap  IE conditional comments are comments, not parsed as markup
  syntax-errors: gap  files the grammar rejects (unclosed tags, `<!- ->` comments, `{{ }}` with `>` in text, cursor markers, `<plaintext>`)
  project-options: gap  real-world pages run under Prettier's defaults (`--no-config`), not their own Prettier options
  vue-filters: gap  Vue filters (`value | filter(arg)`) are printed as bitwise or, with the operator at the end of the line
  vue-patterns: gap  `v-for`, `v-slot`, `slot-scope` and `generic` values with destructuring or TypeScript annotations are not formatted as parameter lists (`v-for` loop variables are only joined), and `script setup="..."` / `style vars="..."` values are kept
  vue-blocks: gap  custom blocks of formats Sudsy does not format, `<template lang>` of other languages, a self-closing `<style />` and several root templates are not as Prettier prints them
  vue-js-layout: gap  JS layout differences in `<script>` and expressions (assignment of a generic call, comments inside expressions, `z && (a && b)` is refused by the JS safety check)
  svelte-blocks: gap  a block written without blanks around its tags (`{#if a}<p></p>{/if}`) is always broken onto lines, and a `<script>` or `<style>` that is empty or invalid is not kept as written
  svelte-attributes: gap  mustache tags inside quoted attribute values are not broken up, and long `class:`/`on:` expressions break differently
  svelte-ignore: gap  `<!-- prettier-ignore-start -->` / `-end` ranges are not kept
  svelte-syntax: gap  `{@attach}` and `{#each x as { a, b = "" }}` are rejected by the grammar
  svelte-inline: gap  where the tags of inline elements and mustache tags break in a long line differs from the plugin's printer
