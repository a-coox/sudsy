differences:
  pipeline-indent: gap  the lines after a multi-line pipeline or call are indented as the source has them; Invoke-Formatter derives the indentation from the syntax tree
  backtick-scriptblock: choice  Invoke-Formatter outdents the script block that follows a backtick continuation; Sudsy keeps its indentation
  hashtable-first-entry: gap  a hashtable whose first entry is on the `@{` line is aligned to the column of that entry; Invoke-Formatter lays it out differently
  switch-brace: gap  a `{` on its own line after a switch clause that is a string, or after a comment, is joined by Invoke-Formatter and not by Sudsy
  enum-alignment: gap  Invoke-Formatter aligns the `=` of enum members; Sudsy aligns hashtables only
  operator-chain-comments: gap  Invoke-Formatter aligns the comments of an operator chain
  not-powershell: "choice  the file is C# source: Sudsy rejects it"
