syntax = "proto3";

package acme.v1;

message Good {
  string good_name = 1;
  int32 field_2 = 2;
  map<string, string> good_map = 3;
  oneof good_choice {
    string a = 4;
  }
}

message bad_message {
//      ^^^^^^^^^^^ message-pascal-case
  string BadName = 1;
//       ^^^^^^^ field-lower-snake-case
  map<string, string> BadMap = 2;
//                    ^^^^^^ field-lower-snake-case
  oneof BadChoice {
//      ^^^^^^^^^ oneof-lower-snake-case
    string b = 3;
    string C = 4;
//         ^ field-lower-snake-case
  }
}

enum bad_enum {
//   ^^^^^^^^ enum-pascal-case
  BAD_ENUM_UNSPECIFIED = 0;
  Bad_Value = 1;
//^^^^^^^^^ enum-value-upper-snake-case
}

service bad_service {
//      ^^^^^^^^^^^ service-pascal-case
  rpc bad_call(Good) returns (Good);
//    ^^^^^^^^ rpc-pascal-case
}
