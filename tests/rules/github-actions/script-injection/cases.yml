jobs:
  a:
    steps:
      - run: echo "${{ github.event.issue.title }}"
#                      ^^^^^^^^^^^^^^^^^^^^^^^^ script-injection
      - run: |
          echo ${{ github.head_ref }}
#                  ^^^^^^^^^^^^^^^ script-injection
          echo ${{ github.event.commits[0].message }} ${{ github.sha }}
#                  ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ script-injection
      - name: ${{ github.event.issue.title }}
        run: echo "$TITLE"
        env:
          TITLE: ${{ github.event.issue.title }}
      - run: echo '${{ toJSON(github.event.*.body) }}'
#                             ^^^^^^^^^^^^^^^^^^^ script-injection
      - uses: actions/github-script@v7
        with:
          script: console.log('${{ github.event.head_commit.message }}')
#                                  ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ script-injection
